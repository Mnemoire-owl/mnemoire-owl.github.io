const SUBJECT_COLORS = ['#E05C82','#3B82F6','#22C55E','#F59E0B','#8B5CF6','#06B6D4','#EF4444','#84CC16','#EC4899','#0EA5E9','#F97316','#14B8A6'];
function normalizeState(){
  state.settings = Object.assign({pomodoroWork:25,pomodoroBreak:5,language:'ko',theme:'wizard'}, state.settings||{});
  if(!THEME_IDS.includes(state.settings.theme)) state.settings.theme = 'wizard';
  state.cardReview = Object.assign({queue:[], index:0, flipped:false, mode:'due', browseSubjectId:'all', browseSubtopic:'all', fullscreen:false}, state.cardReview||{});
  if(state.editingSubjectId===undefined) state.editingSubjectId = null;
  if(state.editingTopicId===undefined) state.editingTopicId = null;
  if(state.lastCardSubjectId===undefined) state.lastCardSubjectId = null;
  if(state.lastCardType!=='basic' && state.lastCardType!=='cloze') state.lastCardType = 'basic';
  if(!state.lastCardSubtopicBySubject || typeof state.lastCardSubtopicBySubject!=='object' || Array.isArray(state.lastCardSubtopicBySubject)) state.lastCardSubtopicBySubject = {};
  if(state.cardEditingId===undefined) state.cardEditingId = null;
  if(state.editingCategoryId===undefined) state.editingCategoryId = null;
  if(state.editingSubtopicId===undefined) state.editingSubtopicId = null;
  if(state.editingRewardId===undefined) state.editingRewardId = null;
  if(state.editingGapId===undefined) state.editingGapId = null;
  if(state.editingOutputAttemptId===undefined) state.editingOutputAttemptId = null;
  if(state.editingPlanItemId===undefined) state.editingPlanItemId = null;
  state.gamification = Object.assign({xp:0,streak:0,lastStudyDate:null,badges:[]}, state.gamification||{});
  /* Long-term goals: title + targetDate are set once at creation and never
     edited afterward (no editGoal function exists at all — only add/
     resolve/delete), so this is just backfilling old backups, not migrating
     editable fields. */
  if(!Array.isArray(state.goals)) state.goals = [];
  state.goals.forEach(gl=>{
    if(gl.status===undefined) gl.status = 'active';
    if(gl.resolvedAt===undefined) gl.resolvedAt = null;
    if(gl.createdAt===undefined) gl.createdAt = gl.targetDate || todayISO();
  });
  /* Calendar events (exams/appointments) are simple standalone records —
     nothing else in the app references them, so there's no migration logic
     beyond making sure the array/shape exist for old backups. */
  if(!Array.isArray(state.calendarEvents)) state.calendarEvents = [];
  state.calendarEvents.forEach(ev=>{
    if(ev.time===undefined) ev.time = null;
    if(ev.type===undefined) ev.type = 'other';
  });
  state.calendarView = Object.assign({year:null, month:null}, state.calendarView||{});
  if(state.calendarSelectedDate===undefined) state.calendarSelectedDate = null;
  state.draw = Object.assign({subjectId:null,categoryId:'all',current:null,currentSubId:null,revealed:false,includeSubtopics:false,mode:'equal',itemType:'topic',cardSubjectId:'all',cardSubtopic:'all',currentCardId:null,cardRevealed:false}, state.draw||{});
  if(typeof state.notesSubjectMgmtOpen !== 'boolean') state.notesSubjectMgmtOpen = false;
  if(!Array.isArray(state.subjects)) state.subjects = [];
  state.subjects.forEach((s,sIdx)=>{
    /* Subject color, used to tell subjects apart on the dashboard calendar's
       per-day study-time bars. Old subjects created before this feature get
       one assigned automatically (rotating through SUBJECT_COLORS by their
       position), same as a newly-created subject defaults to before the
       user picks a swatch — this never overwrites a color already chosen. */
    if(!s.color) s.color = SUBJECT_COLORS[sIdx % SUBJECT_COLORS.length];
    /* Per-subject review schedule (days-after-creation offsets for the
       "오늘의 노트 복습"/dashboard review reminders — see computeDueReviews).
       Used to be a single hardcoded global (REVIEW_OFFSETS = [1,4,7,14,28])
       applied to every subject; now each subject carries its own array so
       the user can customize round count AND each round's day-offset per
       subject (overlapping/non-increasing offsets are fine — nothing here
       requires sorted or unique values). Backfilling old subjects to a copy
       of REVIEW_OFFSETS keeps their behavior byte-for-byte identical to
       before this field existed — this must never change what an existing
       user already sees. */
    if(!Array.isArray(s.reviewOffsets) || !s.reviewOffsets.length) s.reviewOffsets = REVIEW_OFFSETS.slice();
    if(!Array.isArray(s.topics)) s.topics = [];
    s.topics.forEach(tp=>{
      if(tp.notes===undefined) tp.notes = '';
      if(tp.pretestText===undefined) tp.pretestText = '';
      if(!Array.isArray(tp.subtopics)) tp.subtopics = [];
      normalizeSubtopics(tp.subtopics);
      if(!tp.createdAt) tp.createdAt = todayISO();
      /* reviewDone is now a flexible-length boolean array indexed by review
         round (index i -> s.reviewOffsets[i]), instead of always exactly 5
         entries — a subject's reviewOffsets length can vary/change now that
         it's user-configurable, and reading past the end of a shorter array
         just yields undefined, which every reader already treats as "not
         done" (falsy), so no length-matching/resizing is needed here. */
      if(!Array.isArray(tp.reviewDone)) tp.reviewDone = [];
      if(tp.confidence===undefined) tp.confidence = null;
      if(tp.lastReviewedAt===undefined) tp.lastReviewedAt = null;
    });
  });
  /* The tutorial overlay is a live DOM construct built by renderTutorialOverlay()
     (not something renderAll() reconstructs from state alone), so resuming
     "active" straight out of a page reload — before the overlay elements
     exist — would leave stale state with nothing on screen. Always start a
     fresh load with the tour closed, same as the pomodoro/stopwatch's own
     running flag just below; the person can always reopen it from the
     header button. */
  state.tutorialActive = false;
  if(typeof state.tutorialStep !== 'number') state.tutorialStep = 0;
  if(typeof state.tutorialSeen !== 'boolean') state.tutorialSeen = false;
  state.timer.running = false;
  state.timer.mode = 'work';
  state.timer.remaining = state.settings.pomodoroWork*60;
  state.timer.alarmed = false;
  state.timer.overtimeSeconds = 0;
  state.stopwatch = Object.assign({running:false, elapsedSeconds:0, committedSeconds:0, subElapsed:0, lastSittingSeconds:0, checkpoints:[], day:null}, state.stopwatch||{});
  if(!Array.isArray(state.stopwatch.checkpoints)) state.stopwatch.checkpoints = [];
  /* state.stopwatch.day is a separate, LIVE-advancing real-calendar-day
     tracker for the stopwatch — deliberately distinct from sessionAnchorDate/
     sessionToday(), which is intentionally pinned for the whole session so
     Plan/Reward state doesn't re-lock mid-session. state.stopwatch.day DOES
     advance mid-session (see checkFocusDayRollover below) so cross-midnight
     study time is tagged to the correct calendar day in stats. First-time
     backfill for saves from before this field existed: just stamp today,
     never treat a missing field as a rollover (that would wrongly wipe an
     existing user's in-progress stopwatch total the moment this ships). */
  if(!state.stopwatch.day) state.stopwatch.day = todayISO();
  if(!Array.isArray(state.focusSessions)) state.focusSessions = [];
  if(state.editingStopwatchTime===undefined) state.editingStopwatchTime = false;
  /* Migration: pomodoro-cycle completions used to be logged as extra focusLog
     entries (source:'pomodoro') on top of the stopwatch's own per-minute
     entries, which double-counted every completed cycle's minutes into daily
     totals/goals. Cycle counting now lives in its own state.pomodoroCycles
     array instead. Backfill it from any legacy entries in old backups so
     cycle-based rewards keep their history, then drop those legacy entries'
     minutes so old backups stop double-counting once reloaded. */
  if(!Array.isArray(state.pomodoroCycles)) state.pomodoroCycles = [];
  state.sidenote = Object.assign({content:'', collapsed:false, width:260, mobileHeight:280}, state.sidenote||{});
  if(typeof state.sidenote.content !== 'string') state.sidenote.content = '';
  state.sidenote.collapsed = !!state.sidenote.collapsed;
  state.sidenote.width = Math.max(200, Math.min(520, Number(state.sidenote.width)||260));
  state.sidenote.mobileHeight = Math.max(160, Math.min(700, Number(state.sidenote.mobileHeight)||280));
  state.sidenoteLeft = Object.assign({content:'', collapsed:true, width:260, mobileHeight:280}, state.sidenoteLeft||{});
  if(typeof state.sidenoteLeft.content !== 'string') state.sidenoteLeft.content = '';
  state.sidenoteLeft.collapsed = !!state.sidenoteLeft.collapsed;
  state.sidenoteLeft.width = Math.max(200, Math.min(520, Number(state.sidenoteLeft.width)||260));
  state.sidenoteLeft.mobileHeight = Math.max(160, Math.min(700, Number(state.sidenoteLeft.mobileHeight)||280));
  if(state.focusLog.some(f=>f.source==='pomodoro' && f.minutes>0)){
    state.focusLog.forEach(f=>{
      if(f.source==='pomodoro' && f.minutes>0){
        state.pomodoroCycles.push({id:f.id, date:f.date, subjectId:f.subjectId||null});
        f.minutes = 0;
      }
    });
  }
  state.output = Object.assign({subjectId:null, topicId:null, targetId:'', revealed:false, recallText:'', mode:'sequential'}, state.output||{});
  state.output.exam = Object.assign(defaultExamState(), state.output.exam||{});
  state.output.exam.running = false;
  if(!Array.isArray(state.gaps)) state.gaps = [];
  state.gaps.forEach(g=>{ if(g.resolved===undefined) g.resolved = false; });
  if(!Array.isArray(state.outputAttempts)) state.outputAttempts = [];
  state.outputAttempts.forEach(a=>{
    if(a.subtopicId===undefined) a.subtopicId = null;
    if(typeof a.gapText !== 'string') a.gapText = '';
    if(typeof a.referenceHtml !== 'string') a.referenceHtml = '';
    if(typeof a.attemptNumber !== 'number') a.attemptNumber = 1;
  });
  if(!Array.isArray(state.passLog)) state.passLog = [];
  if(!Array.isArray(state.reviewLog)) state.reviewLog = [];
  state.stats = Object.assign({notesSaved:0, drawsUsed:0, outputReveals:0, cardsCreated:0}, state.stats||{});
  state.settings.soundscape = Object.assign({type:'none', volume:0.5}, state.settings.soundscape||{});
  if(['cafe','library'].includes(state.settings.soundscape.type)) state.settings.soundscape.type = 'none';
  state.daily = Object.assign({date:null, questBonusGiven:false}, state.daily||{});
  if(!state.gapsFilter) state.gapsFilter = 'all';
  if(!state.gapsStatusFilter) state.gapsStatusFilter = 'all';
  state.plan = Object.assign({date:null, targetMinutes:60, items:[]}, state.plan||{});
  if(!Array.isArray(state.plan.items)) state.plan.items = [];
  if(!Array.isArray(state.planHistory)) state.planHistory = [];
  /* Recurring ("resident") plan items: unlike state.plan.items, these never
     get archived away when checked off — each stays in this list forever
     and just reappears on every scheduled weekday, with its "done" state
     tracked per-date in completedDates rather than on the item itself. */
  if(!Array.isArray(state.recurringPlans)) state.recurringPlans = [];
  state.recurringPlans.forEach(rp=>{
    if(!Array.isArray(rp.weekdays) || rp.weekdays.length===0) rp.weekdays = [0,1,2,3,4,5,6];
    if(!Array.isArray(rp.completedDates)) rp.completedDates = [];
    if(typeof rp.label !== 'string') rp.label = '';
  });
  state.focusSessions.forEach(f=>{
    if(f.seconds===undefined){ f.seconds = Math.round((f.minutes||0)*60); }
    if(f.subjectId===undefined) f.subjectId = null;
    if(f.t===undefined) f.t = 0;
  });
  state.focusLog.forEach(f=>{ if(f.t===undefined) f.t = 0; });
  state.stopwatch.running = false;
  if(!Array.isArray(state.rewards)) state.rewards = [];
  if(!Array.isArray(state.rewardClaims)) state.rewardClaims = [];
  state.rewards.forEach(r=>{
    if(!r.cyclesRequired || r.cyclesRequired<1) r.cyclesRequired = 1;
    if(r.url===undefined) r.url = '';
    if(!r.restMinutes || r.restMinutes<1) r.restMinutes = 10;
  });
  state.rewardTimer = Object.assign({active:false, rewardId:null, rewardTitle:'', totalSeconds:0, remainingSeconds:0, running:false}, state.rewardTimer||{});
  state.rewardTimer.running = false;
  state.notesSearchQuery = '';
  state.planPickerQuery = '';
  state.reviewQueue = Object.assign({active:false, items:[], index:0}, state.reviewQueue||{});
  state.reviewQueue.active = false;
  if(!Array.isArray(state.cards)) state.cards = [];
  state.cards.forEach(c=>{ if(typeof c.subtopic!=='string') c.subtopic = ''; });
  /* Migration: topic/subtopic notes, pretest answers, gap-notebook entries,
     and basic flashcard front/back all used to be stored as plain text and
     rendered via escapeHtml()+\n->br. Rich-text color typing (introduced
     alongside this flag) stores them as sanitized HTML instead, so any
     value saved before this flag was set needs to be wrapped once as safe
     HTML — otherwise a literal "<" or "&" typed before this feature
     existed would be misread as markup the first time it's redrawn as a
     contenteditable field. Runs exactly once per backup; the flag itself
     travels with exported/imported JSON so a restored old backup is
     migrated again on import but an already-migrated one never is. */
  if(!state.settings.richTextMigratedV1){
    state.subjects.forEach(s=>{
      s.topics.forEach(tp=>{
        tp.notes = plainToRichHtml(tp.notes);
        tp.pretestText = plainToRichHtml(tp.pretestText);
        (function walk(list){
          list.forEach(node=>{
            node.notes = plainToRichHtml(node.notes);
            walk(node.subtopics||[]);
          });
        })(tp.subtopics);
      });
    });
    state.gaps.forEach(g=>{ g.gapText = plainToRichHtml(g.gapText); });
    state.outputAttempts.forEach(a=>{
      a.recallText = plainToRichHtml(a.recallText);
      a.gapText = plainToRichHtml(a.gapText);
      /* referenceHtml was always built from buildFullTopicNotesHtml(), which
         already produced HTML, so it is not re-wrapped here. */
    });
    state.cards.forEach(c=>{
      if(c.type==='basic'){
        if(typeof c.front==='string') c.front = plainToRichHtml(c.front);
        if(typeof c.back==='string') c.back = plainToRichHtml(c.back);
      }
    });
    state.settings.richTextMigratedV1 = true;
  }
}
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(defaultState(), parsed);
      normalizeState();
    }
  }catch(e){

  }
}

      setStatus(t('status.saved'));

App.exportData = function(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mnemoire-backup-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
};
App.handleImportFile = function(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  showConfirm(t('header.importConfirm'), function(){
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.subjects)){
          throw new Error('invalid backup shape');
        }
        state = Object.assign(defaultState(), parsed);
        normalizeState();
        saveState();
        renderChrome();
        renderAll();
        setStatus(t('header.importSuccess'));
      }catch(e){
        showAlert(t('header.importError'));
      }
    };
    reader.onerror = function(){ showAlert(t('header.importError')); };
    reader.readAsText(file);
  });
};

/* ============ GAMIFICATION ============ */
/* RPG-style level curve: 300 levels total. Each level needs more XP than the
   last (xpForLevel(L) = 8*L), so early levels come fast and later levels are
   long-term milestones. */
const MAX_LEVEL = 300;
function xpForLevel(level){ return 8 * level; }
const LEVEL_START_XP = (function(){
  const arr = new Array(MAX_LEVEL + 1).fill(0);
  for(let L=1; L<MAX_LEVEL; L++){
    arr[L+1] = arr[L] + xpForLevel(L);
  }
  return arr;
})();
function levelForXp(xp){
  let lvl = 1;
  for(let L=2; L<=MAX_LEVEL; L++){
    if(xp >= LEVEL_START_XP[L]) lvl = L; else break;
  }
  return lvl;
}
function xpIntoLevel(xp){
  const lvl = levelForXp(xp);
  return xp - LEVEL_START_XP[lvl];
}
function xpNeededForLevel(level){
  if(level >= MAX_LEVEL) return null;
  return xpForLevel(level);
}
function xpPercentIntoLevel(xp){
  const lvl = levelForXp(xp);
  const needed = xpNeededForLevel(lvl);
  if(needed===null) return 100;
  return Math.max(0, Math.min(100, Math.round(xpIntoLevel(xp)/needed*100)));
}

function bumpStreak(){
  const g = state.gamification;
  const today = todayISO();
  if(g.lastStudyDate === today) return;
  const yesterday = addDays(today, -1);
  g.streak = (g.lastStudyDate === yesterday) ? g.streak + 1 : 1;
  g.lastStudyDate = today;
}

function awardXp(amount){
  const g = state.gamification;
  const beforeLevel = levelForXp(g.xp);
  g.xp += amount;
  bumpStreak();
  const afterLevel = levelForXp(g.xp);
  checkBadges();
  if(afterLevel > beforeLevel){
    celebrate(t('game.levelUpTitle'), t('game.levelUpSub').replace('{level}', afterLevel));
  }
  checkDailyQuestBonus();
  saveState();
}

/* ============ SPACED NOTE REVIEW (default 1/4/7/14/28 days, customizable per subject) ============ */
const REVIEW_OFFSETS = [1, 4, 7, 14, 28];
/* Splits a user-entered comma-separated list ("1, 4, 7") into a validated
   array of non-negative integer day-offsets (0 = "same day" is allowed —
   matches the feature request's "1회독은 당일" example). Order/uniqueness
   is never enforced (overlapping/non-increasing offsets are explicitly
   allowed), and an empty/all-invalid result falls back to the site's
   existing default schedule rather than producing a subject with no
   review reminders at all. */
function parseReviewOffsets(text){
  const parsed = (text||'').split(',')
    .map(s=>parseInt(s.trim(),10))
    .filter(n=>Number.isInteger(n) && n>=0);
  return parsed.length ? parsed : REVIEW_OFFSETS.slice();
}
function computeDueReviews(){
  const today = todayISO();
  const due = [];
  state.subjects.forEach(s=>{
    const offsets = (Array.isArray(s.reviewOffsets) && s.reviewOffsets.length) ? s.reviewOffsets : REVIEW_OFFSETS;
    s.topics.forEach(tp=>{
      if(!tp.createdAt) return;
      const rd = tp.reviewDone || [];
      for(let idx=0; idx<offsets.length; idx++){
        if(rd[idx]) continue;
        const checkpointDate = addDays(tp.createdAt, offsets[idx]);
        if(checkpointDate <= today){
          due.push({subjectId:s.id, subjectName:s.name, topicId:tp.id, topicName:tp.name, checkpointIndex:idx, offset:offsets[idx], checkpointDate});
        }
        break;
      }
    });
  });
  due.sort((a,b)=> a.checkpointDate.localeCompare(b.checkpointDate));
  return due;
}
App.markReviewDone = function(sid, tid, idx){
  const s = state.subjects.find(x=>x.id===sid);
  if(!s) return;
  const tp = s.topics.find(x=>x.id===tid);
  if(!tp) return;
  if(!Array.isArray(tp.reviewDone)) tp.reviewDone = [];
  tp.reviewDone[idx] = true;
  awardXp(5);
  saveState(); renderAll();
};
App.goToNoteFromDashboard = function(sid, tid){
  if(state.activeTab==='notes') saveAllNotes();
  state.activeSubjectId = sid;
  state.notesTopicId = tid;
  state.activeTab = 'notes';
  saveState(); renderAll();
  scrollActiveTabIntoView();
};

function ensureDailyReset(){
  const today = todayISO();
  if(state.daily.date !== today){
    state.daily.date = today;
    state.daily.questBonusGiven = false;
  }
}
function todayQuestStats(){
  ensureDailyReset();
  const today = todayISO();
  return {
    focusMinutes: state.focusLog.filter(f=>f.date===today).reduce((a,f)=>a+f.minutes,0),
    cardsReviewed: state.reviewLog.filter(r=>r.date===today).length,
    passesCompleted: state.passLog.filter(p=>p.date===today).length,
  };
}
const QUEST_DEFS = [
  {id:'focus10', statKey:'focusMinutes', target:10, labelKey:'game.questFocus'},
  {id:'cards3', statKey:'cardsReviewed', target:3, labelKey:'game.questCards'},
  {id:'pass1', statKey:'passesCompleted', target:1, labelKey:'game.questPass'},
];
function checkDailyQuestBonus(){
  ensureDailyReset();
  if(state.daily.questBonusGiven) return;
  const ts = todayQuestStats();
  const allDone = QUEST_DEFS.every(q=> ts[q.statKey] >= q.target);
  if(allDone){
    state.daily.questBonusGiven = true;
    state.gamification.xp += 30;
    checkBadges();
    celebrate(t('game.dailyQuestTitle'), t('game.dailyQuestSub'));
  }
}

/* ============ REWARDS (unlocked by pomodoro cycles) ============ */
function todayPomodoroCycles(){
  const today = sessionToday();
  return state.pomodoroCycles.filter(f=>f.date===today).length;
}
function isRewardClaimedToday(rewardId){
  const today = sessionToday();
  return state.rewardClaims.some(c=>c.rewardId===rewardId && c.date===today);
}
function sortedRewards(){
  return [...state.rewards].sort((a,b)=>a.cyclesRequired-b.cyclesRequired);
}
function nextLockedReward(){
  const cycles = todayPomodoroCycles();
  return sortedRewards().find(r=> !(cycles>=r.cyclesRequired && isRewardClaimedToday(r.id)) && cycles<r.cyclesRequired) || null;
}
function checkRewardUnlocks(prevCycles, newCycles){
  if(newCycles<=prevCycles) return;
  const newlyUnlocked = state.rewards.filter(r=> r.cyclesRequired>prevCycles && r.cyclesRequired<=newCycles && !isRewardClaimedToday(r.id));
  newlyUnlocked.forEach(r=>{
    celebrate(t('rewards.unlockedTitle'), r.title || r.url || '');
  });
}
const LEVEL_TIER_THRESHOLDS = [1, 5, 10, 20];
function levelTitle(level){
  const tiers = t('game.tiers');
  let idx = 0;
  for(let i=0;i<LEVEL_TIER_THRESHOLDS.length;i++){ if(level>=LEVEL_TIER_THRESHOLDS[i]) idx=i; }
  return Array.isArray(tiers) ? tiers[idx] : '';
}

const BADGE_DEFS = [
  {id:'first_pass', test:(s,g)=> s.subjects.some(sub=>sub.topics.some(tp=>tp.passes.some(Boolean)))},
  {id:'streak_3', test:(s,g)=> g.streak >= 3},
  {id:'streak_7', test:(s,g)=> g.streak >= 7},
  {id:'streak_30', test:(s,g)=> g.streak >= 30},
  {id:'cards_100', test:(s,g)=> s.cards.reduce((a,c)=>a+c.reps,0) >= 100},
  {id:'focus_300', test:(s,g)=> s.focusLog.reduce((a,f)=>a+f.minutes,0) >= 300},
  {id:'subject_complete', test:(s,g)=> s.subjects.some(sub=> sub.topics.length>0 && sub.topics.every(tp=>tp.passes.every(Boolean)))},
  {id:'gap_master', test:(s,g)=> s.gaps.filter(x=>x.resolved).length >= 5},
  {id:'output_10', test:(s,g)=> s.stats.outputReveals >= 10},
  {id:'notes_20', test:(s,g)=> s.stats.notesSaved >= 20},
];
function checkBadges(){
  const g = state.gamification;
  BADGE_DEFS.forEach(def=>{
    if(!g.badges.includes(def.id) && def.test(state, g)){
      g.badges.push(def.id);
      celebrate(t('game.badgeUnlockTitle'), t('game.badges.'+def.id));
    }
  });
}

/* ============ LONG-TERM GOALS ============
   A goal's title and targetDate are locked the moment it's created: there
   is no editGoal function anywhere, only addGoal/resolveGoal/deleteGoal, so
   "can't be changed until the target date" is enforced simply by never
   offering an edit path. Resolution (achieved / not achieved) only becomes
   possible once the real calendar date (todayISO(), not the pinned
   sessionToday() used for daily-reset logic elsewhere) reaches targetDate.
   An achieved goal doesn't join the fixed BADGE_DEFS list — it's shown
   inline in its own card with a small icon that follows the active theme,
   standing in for a themed "badge" per concept. */
const GOAL_BADGE_ICON = { wizard:'🔮', classic:'🏅', hospital:'🎗️', law:'⚖️', lab:'🧪' };
function currentGoalIcon(){
  const theme = (state && state.settings && state.settings.theme) || 'wizard';
  return GOAL_BADGE_ICON[theme] || GOAL_BADGE_ICON.wizard;
}
function sortedGoals(){
  return [...state.goals].sort((a,b)=> a.targetDate.localeCompare(b.targetDate));
}
App.addGoal = function(){
  const titleEl = document.getElementById('goalTitle');
  const dateEl = document.getElementById('goalDate');
  if(!titleEl || !dateEl) return;
  const title = titleEl.value.trim();
  const targetDate = dateEl.value;
  const today = todayISO();
  if(!title || !targetDate || targetDate <= today) return;
  state.goals.push({id:uid(), title, targetDate, createdAt: today, status:'active', resolvedAt:null});
  titleEl.value = '';
  dateEl.value = '';
  saveState(); renderAll();
  focusInput('goalTitle');
};
App.resolveGoal = function(id, achieved){
  const gl = state.goals.find(x=>x.id===id);
  if(!gl || gl.status!=='active') return;
  const today = todayISO();
  if(today < gl.targetDate) return; // guards against the buttons being reached before unlock (shouldn't happen via the UI)
  gl.status = achieved ? 'achieved' : 'failed';
  gl.resolvedAt = today;
  if(achieved){
    awardXp(50);
    celebrate(t('game.badgeUnlockTitle'), gl.title);
  }
  saveState(); renderAll();
};
App.deleteGoal = function(id){
  const target = state.goals.find(x=>x.id===id);
  if(!target) return;
  showConfirm(tf('confirm.deleteGoal', {name: target.title}), function(){
    state.goals = state.goals.filter(x=>x.id!==id);
    saveState(); renderAll();
  });
};
function renderGoalsSection(){
  const today = todayISO();
  const rows = sortedGoals().map(gl=>{
    const checkable = gl.status==='active' && today >= gl.targetDate;
    let statusHtml;
    if(gl.status==='achieved'){
      statusHtml = `
        <span class="badge-chip">${currentGoalIcon()} ${escapeHtml(t('game.badgesLabel'))}</span>
        <div class="muted mono" style="font-size:11px;margin-top:6px;">${tf('goals.achievedOn',{date:gl.resolvedAt})}</div>`;
    } else if(gl.status==='failed'){
      statusHtml = `
        <span class="badge-chip locked">☆ ${escapeHtml(t('goals.statusFailed'))}</span>
        <div class="muted mono" style="font-size:11px;margin-top:6px;">${tf('goals.failedOn',{date:gl.resolvedAt})}</div>`;
    } else if(checkable){
      statusHtml = `
        <div class="muted" style="font-size:12px;margin-bottom:8px;">⏰ ${t('goals.overdueHint')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn teal small" onclick="App.resolveGoal('${gl.id}',true)">${t('goals.achievedBtn')}</button>
          <button class="btn ghost small" onclick="App.resolveGoal('${gl.id}',false)">${t('goals.notAchievedBtn')}</button>
        </div>`;
    } else {
      const daysLeft = Math.ceil((new Date(gl.targetDate+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
      statusHtml = `
        <span class="pill">${daysLeft<=0 ? t('goals.dueToday') : tf('goals.daysLeft',{n:daysLeft})}</span>
        <div class="muted" style="font-size:11px;margin-top:6px;">🔒 ${t('goals.dateHint')}</div>`;
    }
    const giveUpBtn = gl.status==='active' ? `<button class="btn danger small" onclick="App.deleteGoal('${gl.id}')">${t('goals.giveUp')}</button>` : '';
    return `
      <div class="topic-row" style="align-items:flex-start;flex-direction:column;gap:8px;">
        <div style="display:flex;justify-content:space-between;width:100%;gap:8px;flex-wrap:wrap;">
          <span class="topic-name">${escapeHtml(gl.title)}</span>
          <span class="muted mono" style="font-size:11px;">🎯 ${escapeHtml(gl.targetDate)}</span>
        </div>
        <div>${statusHtml}</div>
        ${giveUpBtn}
      </div>
    `;
  }).join('') || `<div class="empty">${t('goals.empty')}</div>`;

  const minDate = addDays(today, 1);
  return `
    <div class="card" style="margin-bottom:16px;">
      <h2 class="section-title">${t('goals.title')}</h2>
      <div class="muted" style="font-size:12.5px;margin-bottom:14px;">${t('goals.subtitle')}</div>
      <div class="row" style="margin-bottom:8px;">
        <div><label>${t('goals.titlePh')}</label><input type="text" id="goalTitle" placeholder="${t('goals.titlePh')}" onkeypress="if(event.key==='Enter'){App.addGoal()}"></div>
        <div style="max-width:180px;"><label>${t('goals.dateLabel')}</label><input type="date" id="goalDate" min="${minDate}"></div>
      </div>
      <div class="muted" style="font-size:11.5px;margin:-4px 0 12px;">🔒 ${t('goals.dateHint')}</div>
      <button class="btn" onclick="App.addGoal()">${t('goals.addBtn')}</button>
      <hr class="divider">
      <div>${rows}</div>
    </div>
  `;
}

/* ============ CONFIRM / ALERT MODAL ============
   Native window.confirm() and window.alert() are unreliable inside
   Claude.ai's sandboxed artifact iframe (they can silently no-op instead of
   showing a dialog), which made delete buttons and validation messages that
   relied on them appear broken — the click just seemed to do nothing.
   This custom modal replaces both for all confirmations and messages. */
let pendingConfirmAction = null;
let confirmModalOpen = false;
function showConfirm(message, onConfirm, confirmLabel, confirmClass){
  pendingConfirmAction = onConfirm;
  confirmModalOpen = true;
  const root = document.getElementById('confirmModalRoot');
  if(!root) return;
  const label = confirmLabel || t('subjects.delete');
  const cls = confirmClass || 'danger';
  root.innerHTML = `
    <div class="confirm-overlay" onclick="if(event.target===this){App.confirmNo();}">
      <div class="confirm-box">
        <p>${escapeHtml(message)}</p>
        <div class="confirm-actions">
          <button class="btn ghost small" onclick="App.confirmNo()">${t('subjects.cancel')}</button>
          <button class="btn ${cls} small" onclick="App.confirmYes()">${escapeHtml(label)}</button>
        </div>
      </div>
    </div>
  `;
}
/* Single-button variant for messages that just need acknowledging (form
   validation errors, import failures, etc.) — the in-app replacement for
   window.alert(). */
function showAlert(message){
  pendingConfirmAction = null;
  confirmModalOpen = true;
  const root = document.getElementById('confirmModalRoot');
  if(!root) return;
  root.innerHTML = `
    <div class="confirm-overlay" onclick="if(event.target===this){App.confirmNo();}">
      <div class="confirm-box">
        <p>${escapeHtml(message)}</p>
        <div class="confirm-actions">
          <button class="btn small" onclick="App.confirmNo()">${t('common.ok')}</button>
        </div>
      </div>
    </div>
  `;
}
function hideConfirm(){
  pendingConfirmAction = null;
  confirmModalOpen = false;
  const root = document.getElementById('confirmModalRoot');
  if(root) root.innerHTML = '';
}
App.confirmYes = function(){
  const action = pendingConfirmAction;
  hideConfirm();
  if(action) action();
};
App.confirmNo = function(){
  hideConfirm();
};
// Esc closes the confirm/alert modal the same way clicking the overlay
// backdrop does (safe default = cancel, never confirm), matching what
// people expect from any modal dialog. Space starts/stops the linked
// pomodoro+stopwatch timer from anywhere on the page (same action as
// clicking the header timer's start/pause button), EXCEPT while the
// person is actually typing somewhere — a text field, a dropdown, a
// contenteditable area (the rich-text notes editor, sidenotes), or a
// focused button that space would otherwise activate (e.g. a confirm
// modal's own buttons) — there space needs to keep doing its normal job.
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && confirmModalOpen) App.confirmNo();
  if((e.key === ' ' || e.code === 'Space') && !e.repeat && !confirmModalOpen){
    const target = e.target;
    const isTypingTarget = target && target.closest && target.closest('input, textarea, select, button, [contenteditable="true"]');
    if(!isTypingTarget){
      e.preventDefault(); // stop the page from scrolling on space
      App.linkedToggle();
    }
  }
});

function celebrate(title, sub){
  const layer = document.getElementById('celebrateLayer');
  if(!layer) return;
  const toast = document.createElement('div');
  toast.className = 'celebrate-overlay';
  toast.innerHTML = `<div class="celebrate-toast"><div class="ct-title">${escapeHtml(title)}</div><div class="ct-sub">${escapeHtml(sub||'')}</div></div>`;
  layer.appendChild(toast);
  spawnConfetti();
  setTimeout(()=>{ toast.remove(); }, 2200);
}
function cssThemeVar(name){
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}
/* Reads the live --teal/--amber/--berry/--ink values so confetti, sidenote
   swatches, and the rich-text reset color automatically follow whichever
   theme (wizard or classic) is currently active, instead of being frozen
   to whatever palette was hardcoded at the time this file was last edited. */
function themeAccentColors(){
  return [cssThemeVar('--teal'), cssThemeVar('--amber'), cssThemeVar('--berry'), cssThemeVar('--ink')];
}
function spawnConfetti(){
  const layer = document.getElementById('celebrateLayer');
  if(!layer) return;
  const colors = themeAccentColors();
  for(let i=0;i<28;i++){
    const c = document.createElement('div');
    c.className = 'confetto';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.6 + Math.random()*1.2)+'s';
    c.style.animationDelay = (Math.random()*0.3)+'s';
    layer.appendChild(c);
    setTimeout(()=>c.remove(), 3200);
  }
}

App.setLanguage = function(lang){
  state.settings.language = lang;
  saveState();
  renderChrome();
  renderAll();
};
/* Applies state.settings.theme to <body> so the matching *-theme CSS
   override block (defined near :root) takes effect, and keeps everything
   that reads colors at render time (renderAll below, plus confetti/
   sidenote swatches via themeAccentColors()) in sync with whichever theme
   is active. 'wizard' needs no class since its palette lives on :root
   itself as the baseline. */
function applyTheme(){
  const body = document.body;
  THEME_IDS.forEach(id=>{ if(id!=='wizard') body.classList.remove(id+'-theme'); });
  if(state.settings.theme!=='wizard') body.classList.add(state.settings.theme+'-theme');
}
App.setTheme = function(theme){
  state.settings.theme = THEME_IDS.includes(theme) ? theme : 'wizard';
  applyTheme();
  saveState();
  renderChrome();
  renderAll();
};
function renderChrome(){
  document.getElementById('tagline').textContent = t('tagline');
  document.getElementById('langSelect').value = state.settings.language;
  document.getElementById('tutorialBtn').textContent = t('header.tutorialBtn');
  document.getElementById('exportBtn').textContent = t('header.export');
  document.getElementById('importBtn').textContent = t('header.import');
  const themeSelect = document.getElementById('themeSelect');
  if(themeSelect){
    themeSelect.innerHTML = THEME_IDS.map(id=>`<option value="${id}">${escapeHtml(t('theme.'+id+'Label'))}</option>`).join('');
    themeSelect.value = state.settings.theme;
  }
  setStatus(t('status.saved'));
  renderHeaderTimers();
  renderSoundscapeBar();
  renderRewardTimerBar();
  renderSidenoteChrome('right');
  renderSidenoteChrome('left');
}

/* ============ INTERACTIVE TUTORIAL ============
   A guided, hands-on walkthrough launched from the "🎓 Tutorial" header
   button — distinct from the static "사용법"/Guide tab (which is read-only
   reference text). Each step switches to a real tab and spotlights a real
   element with a highlight box + a tooltip explaining it, but — critically
   — never blocks the page: the dim layer and highlight box are both
   pointer-events:none (see their CSS), so the actual UI underneath stays
   fully clickable while the tour is open. The person can create a subject,
   type in a field, or click a tab exactly as the tooltip describes it,
   without first closing the tour — "차근차근 직접해볼수있는" (step by step,
   hands-on) taken literally rather than as a passive slideshow. */
const TUTORIAL_STEPS = [
  {key:'welcome', tab:null, target:null},
  {key:'subjects', tab:'subjects', target:'#newSubjectName'},
  {key:'notes', tab:'notes', target:'#notesSearchInput'},
  {key:'cycle', tab:'cycle', target:"#tabs button[onclick=\"App.setTab('cycle')\"]"},
  {key:'draw', tab:'draw', target:"#tabs button[onclick=\"App.setTab('draw')\"]"},
  {key:'output', tab:'output', target:"#tabs button[onclick=\"App.setTab('output')\"]"},
  {key:'gaps', tab:'gaps', target:"#tabs button[onclick=\"App.setTab('gaps')\"]"},
  {key:'cards', tab:'cards', target:"#tabs button[onclick=\"App.setTab('cards')\"]"},
  {key:'focus', tab:'focus', target:'#timerBar'},
  {key:'dashboard', tab:'dashboard', target:'.cal-grid'},
  {key:'plan', tab:'plan', target:'#newRecurringLabel'},
  {key:'rewards', tab:'rewards', target:"#tabs button[onclick=\"App.setTab('rewards')\"]"},
  {key:'closing', tab:null, target:null},
];
function removeTutorialOverlayEls(){
  ['tutorialDim','tutorialHighlight','tutorialTooltip'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.remove();
  });
}
/* Rebuilds the three overlay elements (dim layer, highlight box, tooltip)
   from scratch against the CURRENT DOM every time it's called — safe (and
   necessary) to call after any re-render, since renderAll() rebuilds the
   whole #panel innerHTML and any previously-highlighted element reference
   would otherwise go stale. If the step's target selector doesn't resolve
   to a visible element (e.g. content that only renders in certain data
   states), falls back to a centered tooltip with a plain dim background
   instead of leaving a broken/invisible highlight box. */
function renderTutorialOverlay(){
  removeTutorialOverlayEls();
  if(!state.tutorialActive) return;
  const step = TUTORIAL_STEPS[state.tutorialStep];
  if(!step){ App.closeTutorial(); return; }

  let rect = null;
  if(step.target){
    const el = document.querySelector(step.target);
    if(el){
      const r = el.getBoundingClientRect();
      if(r.width>0 && r.height>0) rect = r;
    }
  }

  const dim = document.createElement('div');
  dim.className = 'tutorial-dim' + (rect ? '' : ' centered');
  dim.id = 'tutorialDim';
  document.body.appendChild(dim);

  const hl = document.createElement('div');
  hl.id = 'tutorialHighlight';
  hl.className = 'tutorial-highlight';
  if(rect){
    const pad = 6;
    hl.style.top = (rect.top-pad)+'px';
    hl.style.left = (rect.left-pad)+'px';
    hl.style.width = (rect.width+pad*2)+'px';
    hl.style.height = (rect.height+pad*2)+'px';
  } else {
    hl.style.display = 'none';
  }
  document.body.appendChild(hl);

  const total = TUTORIAL_STEPS.length;
  const isFirst = state.tutorialStep===0;
  const isLast = state.tutorialStep===total-1;
  const tip = document.createElement('div');
  tip.id = 'tutorialTooltip';
  tip.className = 'tutorial-tooltip';
  tip.innerHTML = `
    <div class="tt-title">${t('tutorial.'+step.key+'Title')}</div>
    <div class="tt-body">${t('tutorial.'+step.key+'Body')}</div>
    <div class="tt-footer">
      <span class="tt-counter">${state.tutorialStep+1} / ${total}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn ghost small" onclick="App.closeTutorial()">${t('tutorial.skip')}</button>
        ${!isFirst ? `<button class="btn ghost small" onclick="App.tutorialPrev()">${t('tutorial.prev')}</button>` : ''}
        <button class="btn small" onclick="${isLast ? 'App.closeTutorial()' : 'App.tutorialNext()'}">${isLast ? t('tutorial.done') : t('tutorial.next')}</button>
      </div>
    </div>
  `;
  document.body.appendChild(tip);

  // Positioned after insertion so tip.getBoundingClientRect() reflects its
  // actual rendered size (depends on the step's text length).
  const tipRect = tip.getBoundingClientRect();
  if(rect){
    let top = rect.bottom + 14;
    let left = rect.left;
    if(top + tipRect.height > window.innerHeight - 10) top = Math.max(10, rect.top - tipRect.height - 14);
    if(left + tipRect.width > window.innerWidth - 10) left = window.innerWidth - tipRect.width - 10;
    if(left < 10) left = 10;
    tip.style.top = top+'px';
    tip.style.left = left+'px';
  } else {
    tip.style.top = '50%';
    tip.style.left = '50%';
    tip.style.transform = 'translate(-50%,-50%)';
  }
}
function goToTutorialStep(idx){
  const step = TUTORIAL_STEPS[idx];
  if(!step) return;
  state.tutorialStep = idx;
  if(step.tab && state.activeTab !== step.tab){
    App.setTab(step.tab); // setTab() already calls renderAll(), which (see renderAll) re-renders the overlay once tutorialActive is set
  } else {
    saveState();
    renderAll();
  }
}
App.startTutorial = function(){
  state.tutorialActive = true;
  state.tutorialSeen = true;
  goToTutorialStep(0);
};
App.tutorialNext = function(){
  if(state.tutorialStep < TUTORIAL_STEPS.length-1) goToTutorialStep(state.tutorialStep+1);
};
App.tutorialPrev = function(){
  if(state.tutorialStep > 0) goToTutorialStep(state.tutorialStep-1);
};
App.closeTutorial = function(){
  state.tutorialActive = false;
  removeTutorialOverlayEls();
  saveState();
};
// Keep the highlight box glued to its target across resizes/scrolls (the
// page is a single scrolling column, and the highlight uses viewport-
// relative coordinates via position:fixed + getBoundingClientRect).
window.addEventListener('resize', ()=>{ if(state.tutorialActive) renderTutorialOverlay(); });
window.addEventListener('scroll', ()=>{ if(state.tutorialActive) renderTutorialOverlay(); }, true);

/* ============ SIDENOTE (persistent side memo) ============ */
/* Returns the current --teal/--amber/--berry/--ink values so the sidenote
   swatches follow the active theme instead of a color set frozen at
   whichever theme was in effect when this file was last edited. */
function getSidenoteColors(){ return themeAccentColors(); }
/* Shared rich-text color palette used across editable note/recall/card
   fields (topic notes, subtopic notes, pretest, output recall, gap
   notebook, basic card front/back). Chosen for strong, unambiguous
   contrast against each other and against the paper-toned background,
   unlike the muted sidenote palette above which is meant to blend in on
   the floating scratchpad rather than pop as category markers. */
const RICH_COLORS = ['#DC2626','#2563EB','#16A34A','#9333EA','#EA580C'];
function getRichClearColor(){ return cssThemeVar('--ink'); } /* always matches the active theme's --ink */
/* Strips everything from a contenteditable field's innerHTML except plain
   markup and an inline color style, so pasted content (or any future
   markup drift) can never carry scripts/handlers/links into stored state
   or into read-only reference views that later re-inject this HTML. */
function sanitizeRichHtml(html){
  const div = document.createElement('div');
  div.innerHTML = html||'';
  div.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(el=>el.remove());
  div.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(attr=>{
      const name = attr.name.toLowerCase();
      if(name.startsWith('on') || name==='href' || name==='src'){
        el.removeAttribute(attr.name);
      } else if(name==='style'){
        const m = attr.value.match(/color\s*:\s*[^;]+/i);
        if(m) el.setAttribute('style', m[0]); else el.removeAttribute('style');
      }
    });
  });
  return div.innerHTML;
}
/* Recovers plain text from a sanitized rich-text HTML value, preserving
   line breaks, for contexts that can't render HTML: search snippets,
   PDF export text extraction, cross-field text embedding (e.g. seeding a
   flashcard's title from a note), and "is this field actually empty"
   checks (contenteditable can leave behind an empty <br> even when the
   user hasn't typed anything, so a truthy-string check alone is not
   reliable once fields store HTML instead of plain text). */
function richTextToPlain(html){
  if(!html) return '';
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
  div.querySelectorAll('div,p,li').forEach(el=>{
    if(el.nextSibling) el.insertAdjacentText('afterend','\n');
  });
  const text = div.textContent || '';
  return text.replace(/\n{3,}/g,'\n\n');
}
function richIsEmpty(html){ return richTextToPlain(html).trim()===''; }
/* One-time migration helper: wraps old plain-text field values (from
   backups saved before rich-text color typing existed) as safe HTML so
   they display identically once the field becomes a contenteditable
   rich-text field. */
function plainToRichHtml(text){ return escapeHtml(text||'').replace(/\n/g,'<br>'); }
/* Renders the shared color toolbar + contenteditable body used by every
   rich-text field. valueHtml must already be sanitized HTML (or a
   migrated plain-text value) — never raw user input. */
function richFieldHtml(bodyId, valueHtml, placeholder, minHeight, extraAttrs){
  // onmousedown="event.preventDefault()" on every toolbar button (same fix
  // for both the format buttons and the color swatches below) stops the
  // browser's default mousedown behavior of moving focus to the button
  // being clicked. Without it, clicking a swatch/format button blurs the
  // contenteditable body first — and when applyRichColor()/applyRichFormat()
  // then calls body.focus() to bring it back, the browser doesn't reliably
  // restore the previous selection, so the caret (and the color/format
  // about to be applied) jumps to the very start of the field instead of
  // wherever the person was actually typing. Preventing the mousedown's
  // default keeps focus (and the live selection) on the body the entire
  // time, so the click just applies to whatever was already selected.
  const formatBtn = (cmd, cls, label, glyph) =>
    `<button type="button" class="rich-format-btn ${cls}" onmousedown="event.preventDefault()" onclick="App.applyRichFormat('${bodyId}','${cmd}')" aria-label="${label}" title="${label}">${glyph}</button>`;
  const formatBtns = [
    formatBtn('bold', 'bold', t('richtext.boldAria'), 'B'),
    formatBtn('italic', 'italic', t('richtext.italicAria'), 'I'),
    formatBtn('underline', 'underline', t('richtext.underlineAria'), 'U'),
    formatBtn('insertUnorderedList', 'bullet', t('richtext.bulletAria'), '•')
  ].join('');
  const swatches = RICH_COLORS.map(hex=>
    `<button type="button" class="rich-swatch" style="background:${hex}" onmousedown="event.preventDefault()" onclick="App.applyRichColor('${bodyId}','${hex}')" aria-label="${t('richtext.colorAria')}"></button>`
  ).join('');
  const clearBtn = `<button type="button" class="rich-swatch rich-swatch-clear" onmousedown="event.preventDefault()" onclick="App.applyRichColor('${bodyId}','${getRichClearColor()}')" aria-label="${t('richtext.clearAria')}">A</button>`;
  return `
    <div class="rich-field">
      <div class="rich-colorbar">${formatBtns}<span class="rich-toolbar-sep"></span>${swatches}${clearBtn}</div>
      <div class="rich-body" id="${bodyId}" contenteditable="true" style="min-height:${minHeight||90}px;" data-placeholder="${escapeAttr(placeholder||'')}" ${extraAttrs||''}>${valueHtml||''}</div>
    </div>
  `;
}
App.applyRichColor = function(bodyId, hex){
  const body = document.getElementById(bodyId);
  if(!body) return;
  body.focus();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('foreColor', false, hex);
  body.dispatchEvent(new Event('input', {bubbles:true}));
};
App.applyRichFormat = function(bodyId, cmd){
  const body = document.getElementById(bodyId);
  if(!body) return;
  body.focus();
  // Force styleWithCSS off for these — applyRichColor turns it ON (so
  // execCommand('foreColor', ...) produces an inline color style instead of
  // a <font> tag), and that flag is a global document setting that would
  // otherwise leak into bold/italic/underline too, making them produce
  // <span style="font-weight:bold"> etc. sanitizeRichHtml only ever keeps a
  // `color:` declaration inside a style attribute and drops the rest, so a
  // style-based bold/italic/underline would silently vanish the moment the
  // note is saved. Semantic <b>/<i>/<u>/<ul><li> tags (what execCommand
  // produces with styleWithCSS off) survive sanitizing untouched.
  document.execCommand('styleWithCSS', false, false);
  document.execCommand(cmd, false, null);
  body.dispatchEvent(new Event('input', {bubbles:true}));
};
function isMobileSidenote(){
  if(window.matchMedia) return window.matchMedia('(max-width:720px)').matches;
  return window.innerWidth <= 720;
}
function sidenoteIds(side){
  const suf = side==='left' ? 'Left' : '';
  return {
    panel:'sidenotePanel'+suf, resizer:'sidenoteResizer'+suf, titleLabel:'sidenoteTitleLabel'+suf,
    saved:'sidenoteSaved'+suf, collapseBtn:'sidenoteCollapseBtn'+suf, colorbar:'sidenoteColorbar'+suf,
    body:'sidenoteBody'+suf, edgeBtn:'sidenoteEdgeBtn'+suf
  };
}
function sidenoteState(side){
  return side==='left' ? state.sidenoteLeft : state.sidenote;
}
function sidenoteTKey(side, key){
  return (side==='left' ? 'sidenoteLeft.' : 'sidenote.') + key;
}
function applySidenoteLayout(side){
  const ids = sidenoteIds(side);
  const panel = document.getElementById(ids.panel);
  const edgeBtn = document.getElementById(ids.edgeBtn);
  if(!panel || !edgeBtn) return;
  const sn = sidenoteState(side);
  if(isMobileSidenote()){
    panel.style.width = '';
    panel.style.height = (sn.mobileHeight||280) + 'px';
  } else {
    panel.style.height = '';
    panel.style.width = (sn.width||260) + 'px';
  }
  if(sn.collapsed){
    panel.classList.add('collapsed');
    edgeBtn.classList.add('show');
  } else {
    panel.classList.remove('collapsed');
    edgeBtn.classList.remove('show');
  }
}
App.toggleSidenote = function(side){
  side = side==='left' ? 'left' : 'right';
  const sn = sidenoteState(side);
  sn.collapsed = !sn.collapsed;
  applySidenoteLayout(side);
  saveState();
};
let sidenoteSaveTimer = null;
let sidenoteSaveTimerLeft = null;
function commitSidenoteContent(side){
  const ids = sidenoteIds(side);
  const body = document.getElementById(ids.body);
  if(!body) return;
  const sn = sidenoteState(side);
  sn.content = sanitizeRichHtml(body.innerHTML);
  saveState();
  const savedEl = document.getElementById(ids.saved);
  if(savedEl){
    savedEl.textContent = t(sidenoteTKey(side,'saved'));
    savedEl.style.opacity = '1';
    setTimeout(()=>{ savedEl.style.opacity = '0'; }, 1200);
  }
}
function initSidenoteColors(side){
  const ids = sidenoteIds(side);
  const bar = document.getElementById(ids.colorbar);
  if(!bar) return;
  bar.innerHTML = '';
  getSidenoteColors().forEach(hex=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sidenote-swatch';
    b.style.background = hex;
    b.setAttribute('aria-label', t(sidenoteTKey(side,'colorAria')));
    b.onclick = function(){
      const body = document.getElementById(ids.body);
      if(body) body.focus();
      document.execCommand('foreColor', false, hex);
      commitSidenoteContent(side);
    };
    bar.appendChild(b);
  });
}
function initSidenoteResize(side){
  const ids = sidenoteIds(side);
  const resizer = document.getElementById(ids.resizer);
  const panel = document.getElementById(ids.panel);
  if(!resizer || !panel) return;
  let dragging = false;
  function point(e){ return e.touches ? e.touches[0] : e; }
  function onMove(e){
    if(!dragging) return;
    const p = point(e);
    const sn = sidenoteState(side);
    if(isMobileSidenote()){
      const h = Math.round(window.innerHeight - p.clientY);
      sn.mobileHeight = Math.max(160, Math.min(Math.round(window.innerHeight*0.75), h));
      panel.style.height = sn.mobileHeight + 'px';
    } else {
      const w = side==='left' ? Math.round(p.clientX) : Math.round(window.innerWidth - p.clientX);
      sn.width = Math.max(200, Math.min(520, w));
      panel.style.width = sn.width + 'px';
    }
    e.preventDefault();
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
    saveState();
  }
  function onDown(e){
    if(sidenoteState(side).collapsed) return;
    dragging = true;
    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  }
  resizer.addEventListener('mousedown', onDown);
  resizer.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
  window.addEventListener('resize', function(){ applySidenoteLayout(side); });
}
function renderSidenoteChrome(side){
  const ids = sidenoteIds(side);
  const titleEl = document.getElementById(ids.titleLabel);
  if(titleEl) titleEl.textContent = t(sidenoteTKey(side,'title'));
  const body = document.getElementById(ids.body);
  if(body) body.setAttribute('data-placeholder', t(sidenoteTKey(side,'placeholder')));
  const collapseBtn = document.getElementById(ids.collapseBtn);
  if(collapseBtn) collapseBtn.setAttribute('aria-label', t(sidenoteTKey(side,'collapseAria')));
  const edgeBtn = document.getElementById(ids.edgeBtn);
  if(edgeBtn) edgeBtn.setAttribute('aria-label', t(sidenoteTKey(side,'expandAria')));
}
function initSidenoteSide(side){
  const ids = sidenoteIds(side);
  const body = document.getElementById(ids.body);
  if(body){
    body.innerHTML = sanitizeRichHtml(sidenoteState(side).content||'');
    body.addEventListener('input', function(){
      if(side==='left'){
        clearTimeout(sidenoteSaveTimerLeft);
        const savedEl = document.getElementById(ids.saved);
        if(savedEl) savedEl.style.opacity = '0';
        sidenoteSaveTimerLeft = setTimeout(()=>commitSidenoteContent('left'), 500);
      } else {
        clearTimeout(sidenoteSaveTimer);
        const savedEl = document.getElementById(ids.saved);
        if(savedEl) savedEl.style.opacity = '0';
        sidenoteSaveTimer = setTimeout(()=>commitSidenoteContent('right'), 500);
      }
    });
  }
  initSidenoteColors(side);
  initSidenoteResize(side);
  renderSidenoteChrome(side);
  applySidenoteLayout(side);
}
function initSidenote(){
  initSidenoteSide('right');
  initSidenoteSide('left');
}

/* Called once the set pomodoro focus length has already elapsed and the timer is
   sitting in overtime (state.timer.alarmed===true). Ends the current continuous
   sitting for stats purposes, then hands the timer over to a break of the
   configured length. The pomodoro cycle itself (pomodoroCycles entry, for
   reward/streak counting) was already recorded the moment the alarm rang,
   so this only handles the break switch. */
App.startBreak = function(){
  if(state.timer.mode!=='work' || !state.timer.alarmed) return;
  logSitting();
  state.timer.mode = 'break';
  state.timer.remaining = state.settings.pomodoroBreak*60;
  state.timer.alarmed = false;
  state.timer.overtimeSeconds = 0;
  saveState();
  renderHeaderTimers();
  if(['focus','dashboard','plan'].includes(state.activeTab)) renderAll();
};
/* Skip the current break entirely and jump straight into the next work interval.
   The pomodoro cycle for the work interval just finished was already recorded to
   pomodoroCycles back when the alarm rang, so skipping the break does not touch
   cycle/reward counts at all — it only shortens the break to zero. */
App.skipBreak = function(){
  if(state.timer.mode!=='break') return;
  state.timer.mode = 'work';
  state.timer.remaining = state.settings.pomodoroWork*60;
  state.timer.alarmed = false;
  state.timer.overtimeSeconds = 0;
  sfxPlayBreakEndChime();
  saveState();
  renderHeaderTimers();
  if(['focus','dashboard','plan'].includes(state.activeTab)) renderAll();
};

};

/* Maps each guide section's leading number to the tab it documents, so the
   wizard theme can show the current tab name with the plain original name
   struck through beside it — computed at render time from the live tabs.*
   translations rather than baked into the guide text itself, so nothing
   here needs to change if tab names are ever renamed again. */
const GUIDE_TAB_MAP = {1:'subjects',2:'notes',3:'cycle',4:'draw',5:'output',6:'gaps',7:'cards',8:'focus',9:'dashboard',11:'rewards'};
function guideSectionTitle(sec, i){
  const tabKey = GUIDE_TAB_MAP[i];
  if(tabKey && state.settings.theme!=='classic'){
    const lang = state.settings.language;
    const themedName = t('tabs.'+tabKey);
    const classicName = (CLASSIC_TERMS[lang] && CLASSIC_TERMS[lang].tabs && CLASSIC_TERMS[lang].tabs[tabKey]) || '';
    if(themedName && classicName && themedName!==classicName && sec.title.includes(classicName)){
      return escapeHtml(sec.title.replace(classicName, '\u0000')).replace('\u0000', `${escapeHtml(themedName)} <del>${escapeHtml(classicName)}</del>`);
    }
  }
  return escapeHtml(sec.title);
}
/* Swaps classic tab names inside guide body prose for the active theme's
   equivalents (wizard, hospital, law, or lab), so inline mentions like
   "the Notes tab" read consistently with whichever theme renamed the tabs,
   without requiring a full duplicate copy of every guide paragraph per
   theme. Longer names are replaced first so e.g. "Gap Notebook"/"오답노트"
   get swapped before the shorter "Notes"/"노트" pass would otherwise
   clobber a substring inside them (case-sensitive matching keeps this
   safe — see test_guide_body.js for the collision check). */
function wizardizeGuideBody(bodyHtml, lang){
  if(state.settings.theme==='classic') return bodyHtml;
  const classicTabs = (CLASSIC_TERMS[lang] && CLASSIC_TERMS[lang].tabs) || {};
  let out = bodyHtml;
  Object.keys(classicTabs)
    .filter(k=>k!=='guide' && classicTabs[k])
    .sort((a,b)=> classicTabs[b].length - classicTabs[a].length)
    .forEach(key=>{
      const themedName = t('tabs.'+key);
      if(themedName && themedName!==classicTabs[key]){
        out = out.split(classicTabs[key]).join(themedName);
      }
    });
  return out;
}

/* ============ DASHBOARD CALENDAR (per-subject study time + events/D-day) ============
   Per-day, per-subject study minutes are derived from state.focusSessions
   (each sitting already carries date+subjectId+seconds) rather than
   state.focusLog, whose stopwatch/adjustment entries are always
   subjectId:null (see commitStopwatch) — focusLog stays the source of
   truth for daily/streak/XP totals, this calendar just reads a different,
   already-existing record for its per-subject breakdown. A sitting with no
   subject selected still counts toward the day's total, grouped into an
   "untagged" slice instead of being silently dropped. */
const EVENT_TYPE_LABEL_KEYS = {exam:'calendar.typeExam', appointment:'calendar.typeAppointment', other:'calendar.typeOther'};
function dayStudyBreakdown(dateISO){
  const sessions = state.focusSessions.filter(f=>f.date===dateISO && f.source==='stopwatch');
  const byKey = {};
  let totalSeconds = 0;
  sessions.forEach(f=>{
    const key = f.subjectId || '__untagged__';
    byKey[key] = (byKey[key]||0) + (f.seconds||0);
    totalSeconds += (f.seconds||0);
  });
  const slices = Object.keys(byKey).map(key=>{
    if(key==='__untagged__') return {subjectId:null, name:t('calendar.untaggedLabel'), color:'var(--ink-dim)', seconds:byKey[key], minutes:Math.round(byKey[key]/60)};
    const s = state.subjects.find(x=>x.id===key);
    return {subjectId:key, name: s?s.name:t('calendar.untaggedLabel'), color: s?s.color:'var(--ink-dim)', seconds:byKey[key], minutes:Math.round(byKey[key]/60)};
  }).sort((a,b)=>b.seconds-a.seconds);
  return {totalSeconds, totalMinutes:Math.round(totalSeconds/60), slices};
}
function eventsOnDate(dateISO){
  return state.calendarEvents.filter(e=>e.date===dateISO).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function upcomingEvents(limit){
  const today = todayISO();
  const list = state.calendarEvents.filter(e=>e.date>=today).sort((a,b)=>{
    return (a.date+(a.time||'00:00')).localeCompare(b.date+(b.time||'00:00'));
  });
  return typeof limit==='number' ? list.slice(0, limit) : list;
}
/* D-day plus, once the event is within 24 REAL hours and has a time set, an
   hour:minute countdown alongside it — "as the date approaches, show it in
   hours" per the feature request. Deliberately uses the real wall clock
   (new Date()) rather than sessionToday()/sessionAnchorDate: the rest of
   the app pins "today" for the session so daily stats don't shift mid-use,
   but a live countdown needs to keep ticking within that same pinned day. */
function formatEventCountdown(ev){
  const daysUntil = daysBetween(todayISO(), ev.date);
  const dday = daysUntil>0 ? `D-${daysUntil}` : t('calendar.ddayToday');
  let detail = '';
  if(ev.time){
    const target = new Date(ev.date+'T'+ev.time+':00');
    const diffMs = target - new Date();
    const absMs = Math.abs(diffMs);
    if(absMs < 24*3600*1000){
      const h = Math.floor(absMs/3600000);
      const m = Math.floor((absMs%3600000)/60000);
      detail = tf(diffMs>=0 ? 'calendar.hoursLeftFormat' : 'calendar.hoursPastFormat', {h, m});
    }
  }
  return {dday, detail};
}
function ensureCalendarView(){
  if(state.calendarView.year==null || state.calendarView.month==null){
    const now = new Date();
    state.calendarView.year = now.getFullYear();
    state.calendarView.month = now.getMonth();
  }
  if(!state.calendarSelectedDate) state.calendarSelectedDate = todayISO();
}
function buildMonthGrid(year, month){
  const startWeekday = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(formatLocalISO(new Date(year, month, d)));
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}

/* ============ PLAN (pre-study planning) ============ */
function ensurePlanReset(){
  const today = sessionToday();
  let carriedItems = [];
  if(state.plan.date && state.plan.date !== today){
    const actualMinutes = state.focusLog.filter(f=>f.date===state.plan.date).reduce((a,f)=>a+f.minutes,0);
    if(state.plan.items.length>0 || actualMinutes>0){
      state.planHistory.push({
        date: state.plan.date,
        targetMinutes: state.plan.targetMinutes,
        actualMinutes,
        items: state.plan.items.map(i=>Object.assign({}, i))
      });
      if(state.planHistory.length>120) state.planHistory = state.planHistory.slice(-120);
    }
    /* Items still unchecked when the day rolls over follow the plan into the
       new day instead of quietly vanishing — only the finished (done:true)
       ones stay behind, archived in planHistory above. Same id, so ticking
       it off later still counts as finishing the same task (and any prior
       carriedFromDate is kept rather than overwritten, so an item carried
       across several days still remembers the day it was ORIGINALLY
       planned, not just yesterday) — carriedOver marks it for renderPlan()
       to show a small "carried over" pill instead of looking brand new. */
    carriedItems = state.plan.items.filter(i=>!i.done).map(i=>Object.assign({}, i, {
      carriedOver: true,
      carriedFromDate: i.carriedFromDate || state.plan.date
    }));
  }
  if(state.plan.date !== today){
    state.plan.date = today;
    state.plan.items = carriedItems;
  }
}
/* ---- Recurring ("resident") plan items ----
   Weekday numbers follow JS Date#getDay() (0=Sun...6=Sat), same convention
   as calendar.weekdays/EVENT_TYPE_LABEL_KEYS's month grid, so that array is

   table. Order shown in the UI is Mon-first (1,2,3,4,5,6,0) to match Korean

function renderPlan(){
  ensurePlanReset();
  const todayMinutes = state.focusLog.filter(f=>f.date===sessionToday()).reduce((a,f)=>a+f.minutes,0);
  const goalPct = state.plan.targetMinutes>0 ? Math.min(100, Math.round(todayMinutes/state.plan.targetMinutes*100)) : 0;

  const dueReviews = computeDueReviews();
  const dueCards = state.cards.filter(c=>c.dueDate<=todayISO()).length;

App.setPlanTarget = function(v){

};
App.togglePlanTopic = function(tid, subjectName, topicName){
  const idx = state.plan.items.findIndex(i=>i.type==='topic' && i.topicId===tid);
  if(idx>=0){
    state.plan.items.splice(idx,1);
  } else {
    state.plan.items.push({id:uid(), type:'topic', label:topicName, subjectName, topicId:tid, done:false});
  }
  saveState(); renderAll();
};
/* Search-driven topic picker for the Plan tab (replaces listing every topic, since
   the topic list can grow very large). Always shows already-picked topics so they
   stay visible/uncheckable even without a search query. */
App.runPlanPickerSearch = function(q){
  state.planPickerQuery = q;
  const box = document.getElementById('planPickerResults');
  if(!box) return;
  const query = (q||'').trim().toLowerCase();
  const items = state.plan.items;
  const rows = [];
  state.subjects.forEach(s=>{
    s.topics.forEach(tp=>{
      const checked = items.some(i=>i.type==='topic' && i.topicId===tp.id);
      const matches = query && ((tp.name||'').toLowerCase().includes(query) || (s.name||'').toLowerCase().includes(query));
      if(matches || checked){
        rows.push({sid:s.id, tid:tp.id, subjectName:s.name, topicName:tp.name, checked});
      }
    });
  });
  if(rows.length===0){
    box.innerHTML = query
      ? `<div class="empty" style="padding:10px 0;">${t('plan.pickNoResults')}</div>`
      : `<div class="muted" style="font-size:12px;padding:6px 0;">${t('plan.pickEmptyHint')}</div>`;
    return;
  }
  box.innerHTML = rows.slice(0,50).map(r=>`
    <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer;">
      <input type="checkbox" style="width:auto;" ${r.checked?'checked':''} onchange="App.togglePlanTopic('${r.tid}','${escapeAttr(r.subjectName)}','${escapeAttr(r.topicName)}')">
      <span style="font-size:13.5px;">${escapeHtml(r.topicName)} <span class="muted" style="font-size:11px;">· ${escapeHtml(r.subjectName)}</span></span>
    </label>
  `).join('');
};

/* ---- Drag-to-reorder for "오늘의 계획" (today's plan) — order in
   state.plan.items IS the priority order (top = highest priority), so
   dragging a row just reorders the array; no separate priority field
   needed. Deliberately avoids renderAll() (or any state mutation) during
   dragstart/dragover/dragleave — rebuilding #panel's DOM mid-drag would
   destroy the very node the browser is dragging and abort the gesture.
   The array is only touched, and the panel only re-rendered, on drop
   (the drag is over by then, so a fresh render is safe). Visual feedback
   while dragging is done with plain classList toggles instead. */
let draggedPlanItemId = null;
App.onPlanItemDragStart = function(ev, id){
  draggedPlanItemId = id;
  try{
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', id);
  }catch(err){ /* some browsers restrict dataTransfer access; the module-level var still works */ }
  const row = ev.target.closest('.plan-item-row');
  if(row) row.classList.add('plan-item-dragging');
};
App.onPlanItemDragOver = function(ev){
  if(!draggedPlanItemId) return;
  ev.preventDefault(); // required so this row becomes a valid drop target
  if(ev.currentTarget) ev.currentTarget.classList.add('plan-item-dragover');
};
App.onPlanItemDragLeave = function(ev){
  if(ev.currentTarget) ev.currentTarget.classList.remove('plan-item-dragover');
};
App.onPlanItemDrop = function(ev, targetId){
  ev.preventDefault();
  if(ev.currentTarget) ev.currentTarget.classList.remove('plan-item-dragover');
  const sourceId = draggedPlanItemId;
  draggedPlanItemId = null;
  if(!sourceId || sourceId===targetId) return;
  const items = state.plan.items;
  const fromIdx = items.findIndex(i=>i.id===sourceId);
  const toIdx = items.findIndex(i=>i.id===targetId);
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = items.splice(fromIdx,1);
  items.splice(toIdx,0,moved);
  saveState(); renderAll();
};
App.onPlanItemDragEnd = function(){
  // Fires even when the drag is cancelled (dropped outside any valid
  // target) — clean up so a stray class never lingers.
  draggedPlanItemId = null;
  document.querySelectorAll('.plan-item-dragging').forEach(el=>el.classList.remove('plan-item-dragging'));
  document.querySelectorAll('.plan-item-dragover').forEach(el=>el.classList.remove('plan-item-dragover'));
};

    if(state.editingTopicId===tp.id){
      const editCatOptions = `<option value="">${t('subjects.noCategory')}</option>` + s.categories.map(c=>`<option value="${c.id}" ${tp.categoryId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
      return `<div class="edit-row">
        <div><label>${t('subjects.editTopicNameLabel')}</label><input type="text" id="editTopicName_${tp.id}" value="${escapeHtml(tp.name)}" onkeypress="if(event.key==='Enter'){App.saveTopicEdit('${s.id}','${tp.id}')}"></div>
        <div><label>${t('subjects.editTopicCategoryLabel')}</label><select id="editTopicCategory_${tp.id}">${editCatOptions}</select></div>
        <button class="btn small" onclick="App.saveTopicEdit('${s.id}','${tp.id}')">${t('subjects.save')}</button>
        <button class="btn ghost small" onclick="App.cancelEditTopic()">${t('subjects.cancel')}</button>
      </div>`;
    }
    return `<div class="topic-row">
      <span class="dot ${cat?cat.color:'teal'}"></span>
      <span class="topic-name">${escapeHtml(tp.name)}</span>
      <span class="muted mono" style="font-size:11px;">${tp.passes.filter(Boolean).length}/${s.passCount}</span>
      <button class="btn ghost small" onclick="App.startEditTopic('${tp.id}')">${t('subjects.edit')}</button>
      <button class="btn danger small" onclick="App.deleteTopic('${s.id}','${tp.id}')">${t('subjects.delete')}</button>
    </div>`;
  }).join('') || `<div class="empty">${t('subjects.noTopics')}</div>`;

  return `
    <h2 class="section-title">${escapeHtml(s.name)}</h2>
    <label>${t('subjects.categoryLabel')}</label>
    <div style="margin-bottom:10px;">${cats}</div>

        <select id="newCatColor">
          <option value="amber">${t('subjects.colorYellow')}</option>
          <option value="teal">${t('subjects.colorGreen')}</option>
          <option value="berry">${t('subjects.colorRed')}</option>
        </select>
      </div>
      <button class="btn ghost small" onclick="App.addCategory('${s.id}')">${t('subjects.addCategory')}</button>
    </div>

    <hr class="divider">
    <label>${t('subjects.topicListLabel')}</label>
    <div id="topicListBox" style="max-height:220px;overflow-y:auto;margin-bottom:14px;">${topics}</div>
    <div class="row">
      <div><input type="text" id="newTopicName" placeholder="${t('subjects.newTopicPh')}" onkeypress="if(event.key==='Enter'){App.addTopic('${s.id}')}"></div>
      <div><select id="newTopicCategory">${catOptions}</select></div>
      <button class="btn small" onclick="App.addTopic('${s.id}')">${t('subjects.addTopic')}</button>
    </div>
  `;
}

App.selectSubject = function(id){
  state.activeSubjectId=id;
  saveState(); renderAll();
  // On narrow screens the list and detail panel stack vertically (see the
  // grid-2 -> 1-column breakpoint in CSS), so tapping a subject in the list
  // leaves the detail panel below the fold with no visual cue that anything
  // happened. Scroll it into view there; desktop already shows both side by
  // side, so this is a no-op above the breakpoint.
  if(window.innerWidth <= 640){
    requestAnimationFrame(()=>{
      const el = document.getElementById('subjectDetailPanel');
      if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }
};
App.addSubject = function(){
  const name = document.getElementById('newSubjectName').value.trim();
  const passes = parseInt(document.getElementById('newSubjectPasses').value) || 4;
  const colorEl = document.getElementById('newSubjectColor');
  const color = (colorEl && colorEl.value) || SUBJECT_COLORS[state.subjects.length % SUBJECT_COLORS.length];
  const offsetsEl = document.getElementById('newSubjectReviewOffsets');
  const reviewOffsets = parseReviewOffsets(offsetsEl ? offsetsEl.value : '');
  if(!name) return;
  /* If this is the very first subject ever created, keep the Notes tab's
     embedded management section open through the follow-up "now add a
     topic" step instead of letting it snap shut the moment subjects.length
     goes from 0 to 1 (which would otherwise end the forced-open state). */
  const wasEmpty = state.subjects.length===0;
  const s = {id:uid(), name, passCount:passes, categories:[], topics:[], color, reviewOffsets};
  state.subjects.push(s);
  state.activeSubjectId = s.id;
  if(wasEmpty) state.notesSubjectMgmtOpen = true;
  saveState(); renderAll();
  focusInput('newSubjectName');
  scrollLastIntoView('.subject-row');
};
App.setNotesSubjectMgmtOpen = function(isOpen){
  state.notesSubjectMgmtOpen = !!isOpen;
  saveState();
};
App.deleteSubject = function(id){
  const target = state.subjects.find(s=>s.id===id);
  const doDelete = function(){
    state.subjects = state.subjects.filter(s=>s.id!==id);
    state.cards = state.cards.filter(c=>c.subjectId!==id);
    state.gaps = state.gaps.filter(g=>g.subjectId!==id);
    if(state.activeSubjectId===id) state.activeSubjectId=null;
    if(state.notesTopicId && !state.subjects.some(s=>s.topics.some(tp=>tp.id===state.notesTopicId))) state.notesTopicId=null;
    if(state.draw.subjectId===id){ state.draw.subjectId=null; state.draw.current=null; state.draw.currentSubId=null; }
    if(state.output.subjectId===id){ state.output.subjectId=null; state.output.topicId=null; state.output.targetId=''; }
    if(state.gapsFilter===id) state.gapsFilter='all';
    saveState(); renderAll();
  };
  if(target){
    showConfirm(tf('confirm.deleteSubject', {name: target.name}), doDelete);
  } else {
    doDelete();
  }
};
App.addCategory = function(sid){
  const name = document.getElementById('newCatName').value.trim();
  const color = document.getElementById('newCatColor').value;
  if(!name) return;
  const s = state.subjects.find(x=>x.id===sid);
  s.categories.push({id:uid(), name, color});
  saveState(); renderAll();
  focusInput('newCatName');
};
App.deleteCategory = function(sid,cid){
  const s = state.subjects.find(x=>x.id===sid);
  const target = s.categories.find(c=>c.id===cid);
  const doDelete = function(){
    s.categories = s.categories.filter(c=>c.id!==cid);
    s.topics.forEach(tp=>{ if(tp.categoryId===cid) tp.categoryId=null; });
    saveState(); renderAll();

  if(target){
    showConfirm(tf('confirm.deleteCategory', {name: target.name}), doDelete);
  } else {

};

App.startEditSubject = function(id){ state.editingSubjectId = id; state.editingTopicId = null; renderAll(); focusInput('editSubjectName_'+id, true); };
App.cancelEditSubject = function(){ state.editingSubjectId = null; renderAll(); };
App.saveSubjectEdit = function(id){
  const s = state.subjects.find(x=>x.id===id);
  if(!s) return;
  const nameEl = document.getElementById('editSubjectName_'+id);
  const passEl = document.getElementById('editSubjectPasses_'+id);
  const offsetsEl = document.getElementById('editSubjectReviewOffsets_'+id);
  const name = nameEl.value.trim();
  if(!name) return;
  const passes = Math.max(1, Math.min(10, parseInt(passEl.value)||s.passCount));
  s.name = name;
  if(passes !== s.passCount){
    s.topics.forEach(tp=>{
      const arr = Array.isArray(tp.passes) ? tp.passes.slice() : [];
      if(passes > arr.length){
        while(arr.length < passes) arr.push(false);
      } else if(passes < arr.length){
        arr.length = passes;
      }
      tp.passes = arr;
    });
    s.passCount = passes;
  }
  // Review-round count/timing is intentionally independent of passCount
  // (see the reviewOffsets comment in normalizeState) — no reviewDone
  // resizing needed here, since it's read as a flexible-length array.
  if(offsetsEl) s.reviewOffsets = parseReviewOffsets(offsetsEl.value);
  const colorEl = document.getElementById('editSubjectColor_'+id);
  if(colorEl && colorEl.value) s.color = colorEl.value;
  state.editingSubjectId = null;
  saveState(); renderAll();
};
App.startEditTopic = function(tid){ state.editingTopicId = tid; state.editingSubjectId = null; renderAll(); focusInput('editTopicName_'+tid, true); };
App.cancelEditTopic = function(){ state.editingTopicId = null; renderAll(); };
App.saveTopicEdit = function(sid, tid){
  const s = state.subjects.find(x=>x.id===sid);
  if(!s) return;
  const tp = s.topics.find(x=>x.id===tid);
  if(!tp) return;
  const nameEl = document.getElementById('editTopicName_'+tid);
  const catEl = document.getElementById('editTopicCategory_'+tid);
  const name = nameEl.value.trim();
  if(!name) return;
  tp.name = name;
  tp.categoryId = catEl && catEl.value ? catEl.value : null;
  state.editingTopicId = null;
  saveState(); renderAll();
};
