App.claimReward = function(id){
  const r = state.rewards.find(x=>x.id===id);
  if(!r) return;
  if(todayPomodoroCycles() < r.cyclesRequired) return;
  if(!isRewardClaimedToday(id)){
    state.rewardClaims.push({rewardId:id, date:sessionToday()});
    saveState();
  }
  if(r.url){
    window.open(r.url, '_blank', 'noopener');
  }
  App.startRewardTimer(id);
  renderAll();
};

/* ---- Reward rest/play timer (persistent bar at top of the site) ---- */
let rewardTimerHandle = null;
App.startRewardTimer = function(id){
  const r = state.rewards.find(x=>x.id===id);
  if(!r) return;
  sfxEnsureCtx(); // prime audio here (real click) so the done-chime later is audible
  clearInterval(rewardTimerHandle);
  const seconds = Math.max(1, r.restMinutes||10) * 60;
  state.rewardTimer = {
    active: true, rewardId: r.id, rewardTitle: r.title,
    totalSeconds: seconds, remainingSeconds: seconds, running: true
  };
  rewardLastTs = Date.now();
  rewardTimerHandle = setInterval(rewardTimerTick, 1000);
  saveState();
  renderRewardTimerBar();
};
/* See masterTick's comment: browsers throttle background-tab intervals, so
   we measure real elapsed time rather than assuming 1 tick = 1 second. */
function rewardTimerTick(){
  const rt = state.rewardTimer;
  if(!rt.active || !rt.running) return;
  const now = Date.now();
  if(rewardLastTs==null) rewardLastTs = now;
  let deltaSeconds = Math.floor((now - rewardLastTs)/1000);
  if(deltaSeconds < 1) return;
  if(deltaSeconds > TIMER_CATCHUP_CAP_SECONDS) deltaSeconds = TIMER_CATCHUP_CAP_SECONDS;
  rewardLastTs += deltaSeconds*1000;
  rt.remainingSeconds -= deltaSeconds;
  if(rt.remainingSeconds <= 0){
    rt.remainingSeconds = 0;
    rt.running = false;
    clearInterval(rewardTimerHandle);
    rewardTimerHandle = null;
    rewardLastTs = null;
    sfxPlayRewardTimerDoneChime();
    saveState();
  }
  renderRewardTimerBar();
}
App.pauseResumeRewardTimer = function(){
  const rt = state.rewardTimer;
  if(!rt.active || rt.remainingSeconds<=0) return;
  rt.running = !rt.running;
  if(rt.running){
    sfxEnsureCtx();
    rewardLastTs = Date.now();
    rewardTimerHandle = setInterval(rewardTimerTick, 1000);
  } else {
    clearInterval(rewardTimerHandle);
    rewardTimerHandle = null;
    rewardLastTs = null;
  }
  saveState();
  renderRewardTimerBar();
};
App.dismissRewardTimer = function(){
  clearInterval(rewardTimerHandle);
  rewardTimerHandle = null;
  rewardLastTs = null;
  state.rewardTimer = { active:false, rewardId:null, rewardTitle:'', totalSeconds:0, remainingSeconds:0, running:false };
  saveState();
  renderRewardTimerBar();
};
function renderRewardTimerBar(){
  const bar = document.getElementById('rewardTimerBar');
  if(!bar) return;
  const rt = state.rewardTimer;
  if(!rt || !rt.active){
    bar.style.display = 'none';
    bar.innerHTML = '';
    return;
  }
  const finished = rt.remainingSeconds<=0;
  bar.style.display = 'flex';
  bar.classList.toggle('finished', finished);
  bar.innerHTML = `
    <div class="rtb-info">
      <div class="rtb-label">🎁 ${t('rewards.restTimerLabel')}${finished?' · '+t('rewards.restTimerDone'):''}</div>
      <div class="rtb-title">${escapeHtml(rt.rewardTitle||'')}</div>
    </div>
    <div class="rtb-time">${fmtTime(rt.remainingSeconds)}</div>
    <div class="rtb-controls">
      ${!finished ? `<button class="btn icon" onclick="App.pauseResumeRewardTimer()">${rt.running?t('focus.pause'):t('focus.start')}</button>` : ''}
      <button class="btn ghost icon" onclick="App.dismissRewardTimer()">${t('rewards.restTimerDismiss')}</button>
    </div>
  `;
}

/* ---- Ambient soundscape (Web Audio API, generated live — no audio files) ---- */
let sfxCtx = null, sfxSource = null, sfxGain = null, sfxNodes = [], sfxLfo = null;

function sfxEnsureCtx(){
  if(!sfxCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    sfxCtx = new AC();
  }
  if(sfxCtx.state === 'suspended') sfxCtx.resume();
  return sfxCtx;
}
/* Blends the tail of a buffer into its head so the AudioBufferSourceNode's
   loop point has no audible click/seam when it wraps back to the start.
   Without this, every loop repetition produces a faint but perceptible "tick"
   because the raw noise waveform doesn't naturally end where it began. */
function sfxApplyLoopCrossfade(buf, fadeSeconds){
  const fadeLen = Math.min(buf.length, Math.floor(buf.sampleRate*fadeSeconds));
  if(fadeLen<=0) return;
  for(let ch=0; ch<buf.numberOfChannels; ch++){
    const d = buf.getChannelData(ch);
    for(let i=0;i<fadeLen;i++){
      const mix = i/fadeLen;
      const tailIdx = buf.length - fadeLen + i;
      d[tailIdx] = d[tailIdx]*(1-mix) + d[i]*mix;
    }
  }
}
function sfxWhiteBuffer(ctx, seconds){
  const len = Math.floor(ctx.sampleRate*seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  }
  sfxApplyLoopCrossfade(buf, 1.5);
  return buf;
}
function sfxBrownBuffer(ctx, seconds){
  const len = Math.floor(ctx.sampleRate*seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    let last = 0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2-1;
      last = (last + 0.02*w)/1.02;
      d[i] = last*3.5;
    }
  }
  sfxApplyLoopCrossfade(buf, 2);
  return buf;
}
function sfxFireBuffer(ctx, seconds){
  const len = Math.floor(ctx.sampleRate*seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    // warm low rumble bed
    let last = 0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2-1;
      last = (last + 0.015*w)/1.015;
      d[i] = last*2.2;
    }
    // scatter crackle/pop bursts on top — generated independently per channel
    // so pops land at slightly different spots left/right, like a real fire
    const numPops = Math.floor(seconds*4);
    for(let p=0;p<numPops;p++){
      const start = Math.floor(Math.random()*len);
      const dur = Math.floor(ctx.sampleRate*(0.004 + Math.random()*0.02));
      const amp = 0.3 + Math.random()*0.6;
      for(let i=0;i<dur && (start+i)<len;i++){
        const decay = Math.exp(-i/(dur*0.3));
        d[start+i] += (Math.random()*2-1)*amp*decay;
      }
    }
    let peak = 0;
    for(let i=0;i<len;i++) peak = Math.max(peak, Math.abs(d[i]));
    if(peak>1){ const g=1/(peak*1.05); for(let i=0;i<len;i++) d[i]*=g; }
  }
  sfxApplyLoopCrossfade(buf, 1);
  return buf;
}
function sfxOceanBuffer(ctx, seconds){
  const len = Math.floor(ctx.sampleRate*seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  // Locking the swell rhythm to an exact fraction of the buffer length means
  // the wave motion itself loops seamlessly, not just the underlying noise.
  const period = seconds/3;
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    let filtered = 0;
    const phase = ch===0 ? 0 : 0.35; // slight L/R offset for stereo width
    for(let i=0;i<len;i++){
      const w = Math.random()*2-1;
      filtered = filtered*0.93 + w*0.07;
      const tsec = i/ctx.sampleRate;
      const swell = 0.55 + 0.45*Math.sin(2*Math.PI*tsec/period + phase);
      let v = filtered*3.2*swell;
      if(v>1) v=1; else if(v<-1) v=-1;
      d[i] = v;
    }
  }
  sfxApplyLoopCrossfade(buf, 2);
  return buf;
}
function sfxStop(){
  if(sfxSource){ try{ sfxSource.stop(); }catch(e){} try{ sfxSource.disconnect(); }catch(e){} sfxSource = null; }
  if(sfxLfo){ try{ sfxLfo.stop(); }catch(e){} try{ sfxLfo.disconnect(); }catch(e){} sfxLfo = null; }
  sfxNodes.forEach(n=>{ try{ n.disconnect(); }catch(e){} });
  sfxNodes = [];
  if(sfxGain){ try{ sfxGain.disconnect(); }catch(e){} sfxGain = null; }
}
/* Short two-tone chime played when the pomodoro switches from focus time to break time. */
function sfxPlayTransitionChime(){
  const ctx = sfxEnsureCtx();
  if(!ctx) return;
  const now = ctx.currentTime;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.22, now+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now+0.55);
  g.connect(ctx.destination);
  [880, 1318.5].forEach((freq, i)=>{
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    o.connect(g);
    o.start(now + i*0.13);
    o.stop(now + i*0.13 + 0.35);
  });
}
/* Short two-tone chime played when a break ends and the pomodoro switches back to
   focus time. Same style as the focus->break chime but with the two tones reversed
   (descending instead of ascending) so the two transitions sound distinct. */
function sfxPlayBreakEndChime(){
  const ctx = sfxEnsureCtx();
  if(!ctx) return;
  const now = ctx.currentTime;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.22, now+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now+0.55);
  g.connect(ctx.destination);
  [1318.5, 880].forEach((freq, i)=>{
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    o.connect(g);
    o.start(now + i*0.13);
    o.stop(now + i*0.13 + 0.35);
  });
}
/* Short chime played when a reward's rest/play timer finishes. Three quick
   ascending notes so it's clearly distinguishable from the pomodoro chimes. */
function sfxPlayRewardTimerDoneChime(){
  const ctx = sfxEnsureCtx();
  if(!ctx) return;
  const now = ctx.currentTime;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.22, now+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now+0.7);
  g.connect(ctx.destination);
  [660, 880, 1100].forEach((freq, i)=>{
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    o.connect(g);
    o.start(now + i*0.12);
    o.stop(now + i*0.12 + 0.3);
  });
}
function sfxStart(type){
  sfxStop();
  if(!type || type==='none') return;
  const ctx = sfxEnsureCtx();
  if(!ctx) return;
  let buffer;
  if(type==='airplane') buffer = sfxBrownBuffer(ctx, 18);
  else if(type==='rain') buffer = sfxWhiteBuffer(ctx, 16);
  else if(type==='fire') buffer = sfxFireBuffer(ctx, 20);
  else if(type==='ocean') buffer = sfxOceanBuffer(ctx, 24);
  else buffer = sfxWhiteBuffer(ctx, 16); // white

  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;

  const gain = ctx.createGain();
  const targetVol = state.settings.soundscape.volume;
  // Fade the sound in over ~0.6s instead of jumping straight to full volume,
  // so switching sounds doesn't produce an audible pop/click at the start.
  const now = ctx.currentTime;
  if(targetVol > 0.001){
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(targetVol, now+0.6);
  } else {
    gain.gain.value = 0;
  }

  let node = source;
  if(type==='airplane'){
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; lp.Q.value=0.7;
    node.connect(lp); node = lp; sfxNodes.push(lp);
  } else if(type==='rain'){
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=700;
    const bp = ctx.createBiquadFilter(); bp.type='peaking'; bp.frequency.value=3500; bp.gain.value=5; bp.Q.value=0.8;
    node.connect(hp); hp.connect(bp); node = bp; sfxNodes.push(hp,bp);
  } else if(type==='fire'){
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4200; lp.Q.value=0.6;
    node.connect(lp); node = lp; sfxNodes.push(lp);
  } else if(type==='ocean'){
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1300; lp.Q.value=0.6;
    node.connect(lp); node = lp; sfxNodes.push(lp);
  }

  // Subtle slow "breathing" amplitude modulation on rain and fire so the
  // texture feels alive instead of a perfectly flat, static drone. Ocean
  // already has its own swell motion and airplane/white should stay steady,
  // so only these two get it.
  if(type==='rain' || type==='fire'){
    const lfo = ctx.createOscillator();
    lfo.frequency.value = type==='rain' ? 0.09 : 0.14;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.value = type==='rain' ? 0.05 : 0.08;
    const modGain = ctx.createGain();
    modGain.gain.value = 1;
    lfo.connect(lfoDepth);
    lfoDepth.connect(modGain.gain);
    node.connect(modGain);
    node = modGain;
    lfo.start();
    sfxLfo = lfo;
    sfxNodes.push(lfoDepth, modGain);
  }

  node.connect(gain);
  gain.connect(ctx.destination);
  source.start();
  sfxSource = source;
  sfxGain = gain;
}
App.setSoundscape = function(type){
  state.settings.soundscape.type = type;
  saveState();
  sfxStart(type);
  renderSoundscapeBar();
  if(state.activeTab==='focus') renderAll();
};

/* ---- Linked pomodoro + real study-time stopwatch ---- */
/* One start/pause runs both. The stopwatch only accumulates while the pomodoro
   is in its 'work' phase, and automatically pauses itself during 'break' phases. */
App.linkedToggle = function(){
  state.timer.running = !state.timer.running;
  let sittingLogged = false;
  if(state.timer.running){
    // Unlock/resume the shared AudioContext right here, inside a real click
    // handler. Browsers only allow an AudioContext to actually start playing
    // sound in response to a user gesture; if it's first created later inside
    // the setInterval tick (when a chime is due), some browsers silently keep
    // it suspended and the chime is inaudible. Priming it here means the
    // later chime calls just reuse an already-running context.
    sfxEnsureCtx();
    masterLastTs = Date.now();
    masterHandle = setInterval(masterTick, 1000);
  } else {
    clearInterval(masterHandle);
    masterHandle = null;
    masterLastTs = null;
    if(state.timer.mode==='work'){
      const before = state.focusSessions.length;
      logSitting();
      sittingLogged = state.focusSessions.length > before;
    }
  }
  saveState(); renderHeaderTimers();
  // A completed sitting just changed the data the Focus tab's personalized
  // pomodoro recommendation (analyzeFocus/recommendPomodoro) is based on —
  // force a full re-render so it reflects the new sitting immediately
  // instead of staying stale until the next unrelated re-render.
  if(sittingLogged && (state.activeTab==='focus' || state.activeTab==='dashboard')) renderAll();
};
/* Resets only the pomodoro countdown/mode — leaves the stopwatch's
   accumulated real study time (and everything already logged from it)
   completely untouched. If the master loop is running, it keeps running
   with a freshly-reset work interval. */
App.resetPomodoro = function(){
  showConfirm(t('confirm.resetPomodoro'), function(){
    if(state.timer.mode==='work') logSitting();
    state.timer.mode = 'work';
    state.timer.remaining = state.settings.pomodoroWork*60;
    state.timer.alarmed = false;
    state.timer.overtimeSeconds = 0;
    saveState(); renderHeaderTimers();
    if(state.activeTab==='focus' || state.activeTab==='dashboard') renderAll();
  }, t('focus.reset'), 'ghost');
};
/* Resets only the real-study-time stopwatch display back to 00:00 — leaves
   the pomodoro timer's mode/countdown untouched. Any pending time not yet
   committed to focusLog is flushed first (rounding to the nearest minute)
   so no real study time is silently lost, only the running counter zeroes. */
App.resetStopwatch = function(){
  showConfirm(t('confirm.resetStopwatch'), function(){
    if(state.timer.mode==='work') logSitting();
    commitStopwatch(true);
    state.stopwatch.elapsedSeconds = 0;
    state.stopwatch.committedSeconds = 0;
    state.stopwatch.subElapsed = 0;
    state.stopwatch.lastSittingSeconds = 0;
    state.stopwatch.day = todayISO();
    saveState(); renderHeaderTimers();
    if(['focus','dashboard','plan'].includes(state.activeTab)) renderAll();
  }, t('focus.reset'), 'ghost');
};

/* Applies a manual correction to real study time, down to the second (the
   minutes and seconds fields are combined into one target duration — this
   lets a correction land exactly on e.g. "12분 34초" instead of only whole
   minutes). First flushes any minutes already earned under the old value
   into focusLog (same as a normal commit), then re-bases the stopwatch to
   the new value and logs the remaining difference as a single 'adjustment'
   entry so today's goal total (focusLog) stays in sync with what the
   stopwatch now shows — the difference can be negative if the person is
   correcting time downward. focusLog/XP bookkeeping is still minute-
   granularity by design (every focusLog row represents whole minutes), so
   the adjustment logged there is the seconds difference rounded to the
   nearest minute; the stopwatch display itself (elapsedSeconds/
   committedSeconds) keeps the exact seconds the person entered.
   XP is adjusted by the same rate as normal stopwatch time (2 XP/minute):
   correcting upward awards XP through the normal awardXp() path (streak/
   badges/quest bonus all apply, same as any other earned minute); correcting
   downward just deducts XP directly, floored at 0, without touching streak/
   badges — deleting real study time isn't a "study session" to celebrate,
   it's an accounting fix. */
App.saveStopwatchEdit = function(){
  const minEl = document.getElementById('editStopwatchMin');
  const secEl = document.getElementById('editStopwatchSec');
  if(!minEl) return;
  const newMinutesPart = Math.max(0, Math.round(parseFloat(minEl.value)||0));
  const newSecondsPart = secEl ? Math.min(59, Math.max(0, Math.round(parseFloat(secEl.value)||0))) : 0;
  commitStopwatch(true);
  const newSeconds = newMinutesPart*60 + newSecondsPart;
  const deltaMinutes = Math.round((newSeconds - state.stopwatch.committedSeconds)/60);
  if(deltaMinutes !== 0){
    state.focusLog.push({id:uid(), date:sessionToday(), minutes:deltaMinutes, subjectId:null, source:'adjustment', t:Date.now(), xpApplied:true});
    if(deltaMinutes > 0){
      awardXp(deltaMinutes*2);
    } else {
      state.gamification.xp = Math.max(0, state.gamification.xp + deltaMinutes*2);
    }
  }
  state.stopwatch.elapsedSeconds = newSeconds;
  state.stopwatch.committedSeconds = newSeconds;
  state.stopwatch.subElapsed = 0;
  state.editingStopwatchTime = false;
  saveState(); renderHeaderTimers();
  if(['focus','dashboard','plan'].includes(state.activeTab)) renderAll();
};
/* The pomodoro work interval no longer force-switches into a break on its own.
   Once the configured focus length elapses, an alarm chime plays and the cycle is
   logged (XP + focusLog + reward check) right away, but the timer stays in 'work'
   mode and keeps running in "overtime" (state.timer.overtimeSeconds counts up)
   until the person explicitly presses "Start break" (App.startBreak). This means
   a single continuous sitting can run longer than the configured pomodoro length
   and all of it still counts as real study time, since the stopwatch accumulates
   every second the mode is 'work' regardless of the alarmed/overtime state.
   Breaks only end automatically (back into a fresh work interval); starting a
   break is always a manual action. */
/* Applies exactly one real second of pomodoro/stopwatch progress. Extracted
   from masterTick so a catch-up burst (see masterTick below) can replay
   several real seconds one at a time, preserving all mode-switch/chime/XP
   logic exactly as if each second had ticked normally in real time. */
function masterStepOnce(){
  const modeBefore = state.timer.mode;
  const wasAlarmed = state.timer.alarmed;
  if(modeBefore==='work' && wasAlarmed){
    state.timer.overtimeSeconds += 1;
  } else {
    state.timer.remaining -= 1;
  }
  let switched = false;
  if(modeBefore==='work' && !wasAlarmed && state.timer.remaining <= 0){
    const prevCycles = todayPomodoroCycles();
    // Cycle completion is tracked separately from focusLog on purpose: the
    // stopwatch already logs every real minute of this same interval as it
    // ticks (source:'stopwatch'), so adding another focusLog entry here would
    // double-count the interval's minutes (and XP) toward today's totals.
    // This only feeds cycle-count-based rewards/streaks, not the minute total.
    state.pomodoroCycles.push({id:uid(), date:sessionToday(), subjectId:state.timer.subjectId});
    checkRewardUnlocks(prevCycles, todayPomodoroCycles());
    state.timer.alarmed = true;
    state.timer.overtimeSeconds = 0;
    sfxPlayTransitionChime();
    switched = true;
  } else if(modeBefore==='break' && state.timer.remaining <= 0){
    state.timer.mode = 'work';
    state.timer.remaining = state.settings.pomodoroWork*60;
    state.timer.alarmed = false;
    state.timer.overtimeSeconds = 0;
    sfxPlayBreakEndChime();
    switched = true;
  }
  if(modeBefore==='work'){
    state.stopwatch.elapsedSeconds += 1;
    state.stopwatch.subElapsed += 1;
    commitStopwatch(false);
  }
  return switched;
}
/* ============ FOCUS DAY ROLLOVER ============
   Real study time (the stopwatch) and its stats need to be tallied per real
   calendar day, but sessionAnchorDate/sessionToday() is deliberately PINNED
   for the whole session (see its comment above) so Plan/Reward state never
   re-locks or resets mid-session just because the calendar flips. So the
   stopwatch gets its own, separate, LIVE-advancing day tracker instead:
   state.stopwatch.day. This function detects when the real calendar date has
   moved past state.stopwatch.day and, if so:
     - flushes any pending stopwatch time into focusLog/focusSessions tagged
       to the OLD day (so a sitting spanning midnight still splits correctly
       between the two days instead of all landing on whichever day the app
       happens to flush on),
     - zeroes the stopwatch, using the exact same fields App.resetStopwatch
       zeroes,
     - advances state.stopwatch.day to the new day, so every commit from this
       point on (including ones seconds later) tags itself with the new day
       instead of the stale one,
     - if the pomodoro was actively running (state.timer.running) at the
       moment of rollover, leaves it completely untouched — mode, remaining,
       alarmed, overtimeSeconds — only the stopwatch resets, and the function
       returns true so the caller knows to notify the person a reset just
       happened; if nothing was running, also gives the pomodoro a fresh work
       interval (a new day starting with nothing mid-session should look like
       a clean slate) and returns false, since there's no live session to
       interrupt or announce anything to.
   This is a pure state-mutation function with NO render/alert calls of its
   own, so it's safe to call defensively from init() and from renderFocus()
   (itself mid-render) as well as from masterTick() — exactly the same
   no-side-effects-inside-render pattern ensurePlanReset() already uses. Only
   masterTick's caller actually needs to react to a live rollover (popup +
   forced re-render); the other two call sites are silent backstops for when
   the tab was closed/idle across midnight. */
function checkFocusDayRollover(){
  const sw = state.stopwatch;
  const today = todayISO();
  if(!sw.day) sw.day = today;
  if(sw.day === today) return false;
  const oldDay = sw.day;
  const wasRunning = state.timer.running;
  if(state.timer.mode==='work') logSitting(oldDay);
  commitStopwatch(true, oldDay);
  sw.elapsedSeconds = 0;
  sw.committedSeconds = 0;
  sw.subElapsed = 0;
  sw.lastSittingSeconds = 0;
  sw.day = today;
  if(!wasRunning){
    state.timer.mode = 'work';
    state.timer.remaining = state.settings.pomodoroWork*60;
    state.timer.alarmed = false;
    state.timer.overtimeSeconds = 0;
  }
  saveState();
  return wasRunning;
}
App.notifyFocusDayReset = function(){
  showAlert(t('focus.dayRolloverAlert'));
};
/* Backgrounded/hidden browser tabs throttle setInterval (often to once a
   minute or slower), so a tick of this function does not mean exactly 1
   second really passed. Instead we measure real elapsed time against
   masterLastTs and replay masterStepOnce() that many times, so the timer
   and stopwatch stay accurate to the wall clock even after switching away
   to another tab/site and coming back — nothing runs slow or stalls. */
function masterTick(){
  // Guard against stale calls: masterHandle (used by the visibilitychange
  // listener to decide whether to force a catch-up tick) is only ever
  // cleared via clearInterval, never reset to null, so it stays a truthy
  // (but dead) id after a pause. Without this guard, waking the tab while
  // paused would still run a tick. Bailing out here (and nulling the handle
  // in App.linkedToggle) makes both checks agree with the real running state.
  if(!state.timer.running){ if(masterHandle){ clearInterval(masterHandle); masterHandle = null; } masterLastTs = null; return; }
  if(checkFocusDayRollover()){
    renderHeaderTimers();
    if(state.activeTab==='focus' || state.activeTab==='dashboard' || state.activeTab==='rewards' || state.activeTab==='plan') renderAll();
    App.notifyFocusDayReset();
  }
  const now = Date.now();
  if(masterLastTs==null) masterLastTs = now;
  let deltaSeconds = Math.floor((now - masterLastTs)/1000);
  if(deltaSeconds < 1) return;
  if(deltaSeconds > TIMER_CATCHUP_CAP_SECONDS) deltaSeconds = TIMER_CATCHUP_CAP_SECONDS;
  masterLastTs += deltaSeconds*1000;
  let switched = false;
  for(let i=0;i<deltaSeconds;i++){
    if(masterStepOnce()) switched = true;
  }
  renderHeaderTimers();
  if(switched && (state.activeTab==='focus' || state.activeTab==='dashboard' || state.activeTab==='rewards' || state.activeTab==='plan')) renderAll();
}
/* Deletes a single entry from the recent-sessions list on the Focus tab so
   the person can correct a mistaken/duplicate log without it polluting daily
   study time, goals, or other focusLog-based stats. Two kinds of rows appear
   there (see renderFocus): 'session' rows come from state.focusSessions,
   which is a separate per-sitting display/analysis record NOT stored 1:1
   with focusLog's minute-by-minute committed ledger — so removing a session
   row alone wouldn't change any stat. Instead we remove the session row and
   push a compensating negative 'adjustment' entry into focusLog for the same
   date/amount (same mechanism App.saveStopwatchEdit already uses for manual
   corrections), so today's total/goal/streak calculations - all of which sum
   focusLog - immediately exclude that time. 'adjustment' rows already live
   directly in focusLog, so those are just removed outright. XP is reversed
   in both cases at the same 2 XP/minute rate used when the time was first
   logged: a session's XP is always subtracted (stopwatch time never awarded
   negative XP), while an adjustment's XP reversal is symmetric — deleting a
   positive (upward) correction subtracts the XP it granted, deleting a
   negative (downward) correction gives back the XP it had removed — since
   App.saveStopwatchEdit now awards/deducts XP for adjustments the same way.
   This only applies to adjustment entries flagged xpApplied:true (created by
   App.saveStopwatchEdit from this point on); the compensating negative
   adjustment this same function creates for a deleted session, and any
   adjustment entry from an old backup made before this feature existed,
   carry no XP effect of their own, so deleting those never touches XP.
   XP is floored at 0 and badges are intentionally never revoked once earned.

   Deleting a 'session' row must also correct the header's LIVE "실제 공부시간"
   stopwatch display (state.stopwatch.elapsedSeconds), not just the historical
   focusLog total. elapsedSeconds accumulates continuously across every
   sitting since the stopwatch was last reset/rolled over (see masterStepOnce:
   it only ever goes up, pause/resume never zeroes it) — so a completed
   sitting's seconds normally stay baked into it forever. If we only adjusted
   focusLog, the prominent header number would keep counting a sitting that
   history no longer has any record of, which is exactly what looked like "the
   deletion isn't reflected" even though the list row and today's total were
   both already correct. We only subtract when the deleted sitting belongs to
   the CURRENT stopwatch day (state.stopwatch.day) — a sitting from a day the
   stopwatch has already rolled past (or that a manual reset already zeroed
   out) is no longer part of the live elapsedSeconds total at all, so touching
   it there would wrongly eat into an unrelated, newer accumulation. We reduce
   committedSeconds by the same amount so the "uncommitted remainder"
   (elapsedSeconds-committedSeconds) that drives the next per-minute focusLog
   credit is left exactly as it was — this only erases a fully-completed past
   sitting, never touches whatever partial minute is in progress right now. */
App.deleteFocusEntry = function(id, kind){
  showConfirm(t('confirm.deleteFocusEntry'), function(){
    if(kind==='session'){
      const idx = state.focusSessions.findIndex(f=>f.id===id);
      if(idx===-1) return;
      const item = state.focusSessions[idx];
      const minutes = Math.round((item.seconds||0)/60);
      // focusSessions is append-only (logSitting always pushes), so the last
      // array element is always the most recently completed sitting — the
      // one "방금 집중시간" (lastSittingSeconds) currently reflects. If that's
      // the entry being deleted, lastSittingSeconds must fall back to
      // whichever sitting is now the most recent one left (or 0 if none
      // remain) instead of continuing to show a just-deleted session's time.
      const wasMostRecent = idx === state.focusSessions.length - 1;
      state.focusSessions.splice(idx,1);
      if(minutes>0){
        state.focusLog.push({id:uid(), date:item.date, minutes:-minutes, subjectId:null, source:'adjustment', t:Date.now()});
        state.gamification.xp = Math.max(0, state.gamification.xp - minutes*2);
      }
      const sameStopwatchDay = item.date === state.stopwatch.day;
      if(sameStopwatchDay && item.seconds>0){
        state.stopwatch.elapsedSeconds = Math.max(0, state.stopwatch.elapsedSeconds - item.seconds);
        state.stopwatch.committedSeconds = Math.max(0, state.stopwatch.committedSeconds - item.seconds);
      }
      if(wasMostRecent){
        const prevSession = state.focusSessions[state.focusSessions.length - 1];
        // Only resurrect a fallback value from a sitting still on the current
        // stopwatch day — a leftover tail entry from before the last
        // reset/rollover isn't what "방금 집중시간" should show right now.
        state.stopwatch.lastSittingSeconds = (prevSession && prevSession.date === state.stopwatch.day) ? prevSession.seconds : 0;
      }
      if(sameStopwatchDay || wasMostRecent){
        // The header timer widget (pinned to every tab) shows both of these
        // values in its own separately-rendered #timerBar, which renderAll()
        // below does NOT touch — without this it would keep showing the
        // just-deleted session's time until some unrelated action happened to
        // refresh it.
        renderHeaderTimers();
      }
    } else if(kind==='adjustment'){
      const idx = state.focusLog.findIndex(f=>f.id===id);
      if(idx===-1) return;
      const item = state.focusLog[idx];
      state.focusLog.splice(idx,1);
      if(item.minutes && item.xpApplied){
        state.gamification.xp = Math.max(0, state.gamification.xp - item.minutes*2);
      }
    }
    saveState();
    renderAll();
  }, t('focus.deleteEntry'));
};
function logSitting(dateOverride){
  const sw = state.stopwatch;
  const seconds = sw.subElapsed;
  if(seconds>=3){
    state.focusSessions.push({id:uid(), date:dateOverride || sw.day || sessionToday(), seconds, subjectId:state.timer.subjectId||null, source:'stopwatch', t:Date.now()});
    /* Cap raised from the original 200 to 3000: this is now also the only
       source of per-subject, per-day study time for the dashboard calendar
       (focusLog's own entries are always subjectId:null — see commitStopwatch
       below), so trimming too aggressively would make older calendar days
       go blank even though the day was actually studied. 3000 sessions is
       still bounded (roughly a year of heavy multi-session days) and small
       enough for localStorage. */
    if(state.focusSessions.length>3000) state.focusSessions = state.focusSessions.slice(-3000);
    sw.lastSittingSeconds = seconds;
  }
  sw.subElapsed = 0;
}
function commitStopwatch(includePartialMinute, dateOverride){
  const sw = state.stopwatch;
  const deltaSec = sw.elapsedSeconds - sw.committedSeconds;
  let minutes = Math.floor(deltaSec/60);
  if(includePartialMinute && deltaSec % 60 >= 30) minutes += 1;
  if(minutes<=0) return false;
  state.focusLog.push({id:uid(), date:dateOverride || sw.day || sessionToday(), minutes, subjectId:null, source:'stopwatch'});
  sw.committedSeconds += Math.min(deltaSec, minutes*60);
  awardXp(minutes*2);
  maybeCreateCheckpoint(false);
  saveState();
  return true;
}

/* ============ STOPWATCH CHECKPOINTS ============
   Periodic "known-good" save points for the real-study-time stopwatch, so a
   gap-inflated stretch (see masterTick's wall-clock catch-up) can be undone
   by hand instead of the app silently deciding what counts as away time.
   Each checkpoint snapshots the stopwatch/timer fields plus a cutoff marker
   (the last id already in focusLog/focusSessions/pomodoroCycles at that
   moment) so reverting can precisely drop only what was added afterward. */
function splitAfterCheckpointId(arr, lastId){
  if(lastId==null) return { kept: [], removed: arr.slice() };
  const idx = arr.findIndex(x=>x.id===lastId);
  if(idx===-1) return { kept: arr.slice(), removed: [] }; // marker entry no longer exists (already edited away) — don't guess, remove nothing
  return { kept: arr.slice(0, idx+1), removed: arr.slice(idx+1) };
}
function maybeCreateCheckpoint(force){
  const sw = state.stopwatch;
  if(!Array.isArray(sw.checkpoints)) sw.checkpoints = [];
  const last = sw.checkpoints[sw.checkpoints.length-1];
  const lastCommitted = last ? last.stopwatch.committedSeconds : 0;
  if(!force && (sw.committedSeconds - lastCommitted) < CHECKPOINT_INTERVAL_SECONDS) return;
  if(last && last.stopwatch.committedSeconds===sw.committedSeconds && last.stopwatch.elapsedSeconds===sw.elapsedSeconds) return; // nothing new to save
  sw.checkpoints.push({
    id: uid(), t: Date.now(),
    stopwatch: { elapsedSeconds: sw.elapsedSeconds, committedSeconds: sw.committedSeconds, subElapsed: sw.subElapsed, lastSittingSeconds: sw.lastSittingSeconds },
    timer: { remaining: state.timer.remaining, mode: state.timer.mode, alarmed: state.timer.alarmed, overtimeSeconds: state.timer.overtimeSeconds },
    cutoff: {
      focusLogLastId: state.focusLog.length ? state.focusLog[state.focusLog.length-1].id : null,
      focusSessionsLastId: state.focusSessions.length ? state.focusSessions[state.focusSessions.length-1].id : null,
      pomodoroCyclesLastId: state.pomodoroCycles.length ? state.pomodoroCycles[state.pomodoroCycles.length-1].id : null
    }
  });
  if(sw.checkpoints.length>200) sw.checkpoints = sw.checkpoints.slice(-200);
}
/* Manual "save now" button — lets the person deliberately mark a point
   right before something risky (closing the lid, stepping away), on top of
   the automatic checkpoint every CHECKPOINT_INTERVAL_SECONDS. */
App.saveStopwatchCheckpoint = function(){
  maybeCreateCheckpoint(true);
  saveState();
  renderAll();
};
/* Rolls the stopwatch/pomodoro state, and everything derived from it, back
   to a prior checkpoint. Used when a long unattended gap caused the wall-
   clock catch-up to pile up study time/XP that shouldn't count. Manual
   'adjustment' focusLog entries made after the checkpoint are deliberate
   corrections, not auto-ticks, so they're preserved rather than discarded.
   Matching the app's existing delete/adjustment precedent, badges and any
   reward actually claimed during the discarded window are not revoked —
   only the minutes/XP/cycles that were auto-logged are undone. */
App.revertToStopwatchCheckpoint = function(checkpointId){
  const checkpoints = state.stopwatch.checkpoints || [];
  const idx = checkpoints.findIndex(c=>c.id===checkpointId);
  if(idx===-1) return;
  const cp = checkpoints[idx];
  showConfirm(t('confirm.revertCheckpoint'), function(){
    if(state.timer.running){
      if(masterHandle){ clearInterval(masterHandle); masterHandle = null; }
      masterLastTs = null;
      state.timer.running = false;
    }
    state.stopwatch.elapsedSeconds = cp.stopwatch.elapsedSeconds;
    state.stopwatch.committedSeconds = cp.stopwatch.committedSeconds;
    state.stopwatch.subElapsed = cp.stopwatch.subElapsed;
    state.stopwatch.lastSittingSeconds = cp.stopwatch.lastSittingSeconds;
    state.timer.remaining = cp.timer.remaining;
    state.timer.mode = cp.timer.mode;
    state.timer.alarmed = cp.timer.alarmed;
    state.timer.overtimeSeconds = cp.timer.overtimeSeconds;

    const flSplit = splitAfterCheckpointId(state.focusLog, cp.cutoff.focusLogLastId);
    const removedStopwatchLog = flSplit.removed.filter(e=>e.source==='stopwatch');
    const keptManualAdjustments = flSplit.removed.filter(e=>e.source!=='stopwatch');
    state.focusLog = flSplit.kept.concat(keptManualAdjustments);
    const minutesRemoved = removedStopwatchLog.reduce((a,e)=>a+(e.minutes||0),0);
    if(minutesRemoved>0) state.gamification.xp = Math.max(0, state.gamification.xp - minutesRemoved*2);

    state.focusSessions = splitAfterCheckpointId(state.focusSessions, cp.cutoff.focusSessionsLastId).kept;
    state.pomodoroCycles = splitAfterCheckpointId(state.pomodoroCycles, cp.cutoff.pomodoroCyclesLastId).kept;

    // Checkpoints newer than this one described states built on the data
    // just discarded, so they're no longer valid restore points.
    state.stopwatch.checkpoints = checkpoints.slice(0, idx+1);

    saveState();
    renderHeaderTimers();
    renderAll();
  }, t('focus.revertCheckpointBtn'), 'danger');
};

/* ============ POMODORO RECOMMENDATION ============ */
function analyzeFocus(){
  const sessions = state.focusSessions.filter(f=>f.source==='stopwatch' && f.seconds>0).slice(-15);
  const values = sessions.map(f=>f.seconds).sort((a,b)=>a-b);
  const medianSeconds = values.length ? values[Math.floor((values.length-1)/2)] : null;
  const avgSeconds = values.length ? Math.round(values.reduce((a,b)=>a+b,0)/values.length) : null;

  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = addDays(sessionToday(), -i);
    last7.push(state.focusLog.filter(f=>f.date===d).reduce((a,f)=>a+f.minutes,0));
  }
  const dailyAvg = Math.round(last7.reduce((a,b)=>a+b,0)/7);

  const last28 = [];
  for(let i=27;i>=0;i--){
    const d = addDays(sessionToday(), -i);
    last28.push(state.focusLog.filter(f=>f.date===d).reduce((a,f)=>a+f.minutes,0));
  }
  const weeklyAvg = Math.round(last28.reduce((a,b)=>a+b,0)/4);

  return { sessionCount: values.length, medianSeconds, avgSeconds, dailyAvg, weeklyAvg };
}
function recommendPomodoro(a){
  if(a.sessionCount < 3){
    return { work: null, brk: null, confidence: 'low' };
  }
  const baseMinutes = (a.medianSeconds || a.avgSeconds) / 60;
  let work = Math.round(baseMinutes*0.85);
  work = Math.max(1, work);
  let brk = Math.round(work*0.2);
  brk = Math.max(1, brk);
  return { work, brk, confidence: a.sessionCount>=8 ? 'high' : 'medium' };
}
App.applyRecommendation = function(work, brk){
  state.settings.pomodoroWork = work;
  state.settings.pomodoroBreak = brk;
  if(!state.timer.running){
    state.timer.remaining = (state.timer.mode==='work'?work:brk)*60;
  }
  saveState(); renderHeaderTimers(); renderAll();
};

/* ============ UTIL ============ */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* When the tab was hidden (another tab/site was active), any running timer's
   next setInterval fire may itself be delayed by browser throttling — so as
   soon as the tab is visible again, force an immediate catch-up tick on
   every active timer instead of waiting for that next fire. Combined with
   the wall-clock-based catch-up logic in masterTick/examTick/rewardTimerTick,
   this keeps the pomodoro, stopwatch, exam, and reward timers accurate no
   matter how long another tab/site was in the foreground. */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible'){
    if(masterHandle) masterTick();
    if(examTimerHandle) examTick();
    if(rewardTimerHandle) rewardTimerTick();
  }
});

/* ============ INIT ============ */
/* App startup is now driven by the onAuthStateChange listener above
   (see startAppAfterAuth) instead of an unconditional init() call, since
   we must wait for a signed-in user before loading any state. */
</script>
