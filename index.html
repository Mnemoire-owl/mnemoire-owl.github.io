/* Collapsible subject/topic management, embedded between the search box
   and the note content itself so a new subject or topic can be created
   without leaving the Notes tab — reuses the exact same body the standalone
   Subjects tab renders (see renderSubjectsManagementBody()'s comment).
   Collapsed by default so it doesn't push actual notes down on an ordinary
   day, but forced open while there are no subjects yet (nothing else to
   show), and stays open across the follow-up add-a-topic step via
   state.notesSubjectMgmtOpen, which App.addSubject()/the <details> ontoggle
   handler both keep in sync. */
function renderNotesSubjectMgmtSection(){
  const forceOpen = state.subjects.length===0 || state.notesSubjectMgmtOpen;
  return `
    <details class="cycle-topic" style="margin-bottom:16px;" ${forceOpen?'open':''} ontoggle="App.setNotesSubjectMgmtOpen(this.open)">
      <summary class="cycle-summary">
        <span style="display:flex;align-items:center;gap:6px;min-width:0;">
          <span class="cycle-chevron">▸</span>
          <span class="topic-name" style="font-size:13px;">${t('notes.subjectMgmtTitle')}</span>
        </span>
      </summary>
      <div style="padding:10px 2px 2px;">${renderSubjectsManagementBody()}</div>
    </details>
  `;
}
function renderNotes(){
  const searchBox = renderNotesSearchBox();
  const subjectMgmt = renderNotesSubjectMgmtSection();
  if(state.subjects.length===0){
    return `${searchBox}${subjectMgmt}`;
  }
  const sid = state.activeSubjectId || state.subjects[0].id;
  const s = state.subjects.find(x=>x.id===sid);
  if(!s){ state.activeSubjectId = state.subjects[0].id; return renderNotes(); }
  const subjectOptions = state.subjects.map(x=>`<option value="${x.id}" ${x.id===sid?'selected':''}>${escapeHtml(x.name)}</option>`).join('');

  if(s.topics.length===0){
    return `
      ${searchBox}
      ${subjectMgmt}
      <div class="card">
        <div class="row" style="margin-bottom:16px;">
          <div><label>${t('notes.subjectSelect')}</label><select onchange="App.setNotesSubject(this.value)">${subjectOptions}</select></div>
        </div>
        <div class="empty">${t('notes.noTopics')}</div>
      </div>
    `;
  }

  let tid = state.notesTopicId;
  if(!tid || !s.topics.find(x=>x.id===tid)) tid = s.topics[0].id;
  state.notesTopicId = tid;
  const tp = s.topics.find(x=>x.id===tid);
  const topicOptions = buildTopicOptions(s, tid);

  // Auto-detected subtopics (from a bold heading in the note above) are
  // deliberately left out of this manually-managed list — they have no
  // separate notes box to edit here since their content already lives in
  // the main note body itself. They still exist in tp.subtopics underneath,
  // so cards/랜덤뽑기 pick them up exactly like a manually-added subtopic.
  const manualSubtopics = tp.subtopics.filter(node=>!node.autoDetected);
  const subBlocks = manualSubtopics.map(node=>renderSubtopicNode(s, tp, node, 0)).join('') || `<div class="muted" style="font-size:12.5px;padding:6px 0;">${t('notes.noSubtopicsYet')}</div>`;
  const reviewBanner = renderReviewQueueBanner();

  return `
    ${searchBox}
    ${subjectMgmt}
    ${reviewBanner}
    <div class="card">
      <div class="row" style="margin-bottom:16px;">
        <div><label>${t('notes.subjectSelect')}</label><select onchange="App.setNotesSubject(this.value)">${subjectOptions}</select></div>
        <div><label>${t('notes.topicSelect')}</label><select onchange="App.setNotesTopic(this.value)">${topicOptions}</select></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
        <h2 class="section-title" style="margin-bottom:0;">${escapeHtml(tp.name)}</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn ghost small" onclick="App.seedCard('${s.id}','${escapeAttr(tp.name)}','${escapeAttr(tp.notes)}')">${t('notes.makeCard')}</button>
          <button class="btn ghost small" onclick="App.makeCardsFromSubtopics('${s.id}','${tp.id}')">${t('notes.makeSubtopicCards')}</button>
          <button class="btn ghost small" onclick="App.exportNotesPDF('topic')">${t('notes.exportTopicPdf')}</button>
          <button class="btn ghost small" onclick="App.exportNotesPDF('subject')">${t('notes.exportSubjectPdf')}</button>
        </div>
      </div>

      <label>${t('notes.topicNotesLabel')}</label>
      ${richIsEmpty(tp.notes) ? `
        <div class="card" style="background:var(--surface-2);margin-bottom:14px;">
          <label>${t('notes.pretestLabel')}</label>
          <div class="muted" style="font-size:11.5px;margin-bottom:8px;">${t('notes.pretestHint')}</div>
          ${richFieldHtml('pretestArea', tp.pretestText||'', t('notes.pretestPh'), 80)}
        </div>
      ` : (!richIsEmpty(tp.pretestText) ? `
        <details style="margin-bottom:14px;">
          <summary style="cursor:pointer;font-size:12.5px;color:var(--ink-dim);">${t('notes.pretestViewToggle')}</summary>
          <div class="muted" style="font-size:13px;margin-top:8px;">${tp.pretestText}</div>
        </details>
      ` : '')}
      ${richFieldHtml('topicNotesArea', tp.notes, t('notes.notesPh'), 140)}

      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <label style="margin-bottom:0;">${t('notes.confidenceLabel')}</label>
        <button class="btn ${tp.confidence==='low'?'teal':'ghost'} small" onclick="App.setTopicConfidence('${s.id}','${tp.id}','low')">${t('notes.confidenceLow')}</button>
        <button class="btn ${tp.confidence==='mid'?'teal':'ghost'} small" onclick="App.setTopicConfidence('${s.id}','${tp.id}','mid')">${t('notes.confidenceMid')}</button>
        <button class="btn ${tp.confidence==='high'?'teal':'ghost'} small" onclick="App.setTopicConfidence('${s.id}','${tp.id}','high')">${t('notes.confidenceHigh')}</button>
      </div>

      <hr class="divider">
      <label>${t('notes.subtopicsLabel')}</label>

      <div class="row" style="margin-top:10px;">
        <div><input type="text" id="newSub-${tp.id}" placeholder="${t('notes.addSubtopicPh')}" onkeypress="if(event.key==='Enter'){App.addSubtopic('${s.id}','${tp.id}','')}"></div>
        <button class="btn ghost small" onclick="App.addSubtopic('${s.id}','${tp.id}','')">${t('notes.addSubtopic')}</button>
      </div>

      <hr class="divider">
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;">
        <span id="notesSaveStatus" class="muted mono" style="font-size:11.5px;opacity:0;transition:opacity .3s;">${t('notes.saved')}</span>
        <button class="btn" onclick="App.saveAllNotes()">${t('notes.saveAll')}</button>
        <button class="btn ghost" onclick="App.nextNotesTopic()">${t('notes.nextTopicBtn')} →</button>
      </div>
    </div>
  `;
}
function renderSubtopicNode(s, tp, node, depth){
  const childrenHtml = (node.subtopics||[]).map(child=>renderSubtopicNode(s, tp, child, depth+1)).join('');
  const headerHtml = state.editingSubtopicId===node.id
    ? `<div class="edit-row" style="margin-bottom:6px;">
        <div><label>${t('notes.editSubtopicNameLabel')}</label><input type="text" id="editSubtopicName_${node.id}" value="${escapeHtml(node.name)}" onkeypress="if(event.key==='Enter'){App.saveSubtopicEdit('${s.id}','${tp.id}','${node.id}')}"></div>
        <button class="btn small" onclick="App.saveSubtopicEdit('${s.id}','${tp.id}','${node.id}')">${t('notes.save')}</button>
        <button class="btn ghost small" onclick="App.cancelEditSubtopic()">${t('notes.cancel')}</button>
      </div>`
    : `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;">
        <strong style="font-size:13px;">${escapeHtml(node.name)}</strong>
        <div style="display:flex;gap:6px;">
          <button class="btn ghost small" onclick="App.startEditSubtopic('${node.id}')">${t('notes.edit')}</button>
          <button class="btn ghost small" onclick="App.seedCard('${s.id}','${escapeAttr(node.name)}','${escapeAttr(node.notes)}')">${t('notes.makeCard')}</button>
          <button class="btn danger small" onclick="App.deleteSubtopic('${s.id}','${tp.id}','${node.id}')">${t('notes.delete')}</button>
        </div>
      </div>`;
  return `
    <div style="margin:10px 0 10px ${depth*16}px;padding:12px;border-left:2px solid var(--line);background:var(--surface-2);border-radius:0 8px 8px 0;">
      ${headerHtml}
      ${richFieldHtml('subNotesArea-'+node.id, node.notes, t('notes.subtopicNotesPh'), 70)}
      ${childrenHtml}
      <div class="row" style="margin-top:10px;">
        <div><input type="text" id="newSub-${node.id}" placeholder="${t('notes.addSubSubtopicPh')}" onkeypress="if(event.key==='Enter'){App.addSubtopic('${s.id}','${tp.id}','${node.id}')}"></div>
        <button class="btn ghost small" onclick="App.addSubtopic('${s.id}','${tp.id}','${node.id}')">${t('notes.addSubtopic')}</button>
      </div>
    </div>
  `;
}
function buildTopicOptions(s, selectedId){
  const byCat = {};
  s.topics.forEach(tp=>{
    const key = tp.categoryId || 'none';
    (byCat[key] = byCat[key]||[]).push(tp);
  });
  return Object.keys(byCat).map(key=>{
    const cat = s.categories.find(c=>c.id===key);
    const label = cat ? cat.name : t('notes.uncategorized');
    const opts = byCat[key].map(tp=>`<option value="${tp.id}" ${tp.id===selectedId?'selected':''}>${escapeHtml(tp.name)}</option>`).join('');
    return `<optgroup label="${escapeHtml(label)}">${opts}</optgroup>`;
  }).join('');
}
function flashStatus(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.opacity = '1';
  clearTimeout(el._flashTimeout);
  el._flashTimeout = setTimeout(()=>{ el.style.opacity = '0'; }, 1600);
}
function buildSnippet(text, query){
  const src = text || '';
  const lower = src.toLowerCase();
  const idx = lower.indexOf(query);
  if(idx===-1) return src.slice(0,80);
  const start = Math.max(0, idx-30);
  const end = Math.min(src.length, idx+query.length+50);
  return (start>0?'…':'') + src.slice(start,end).replace(/\n/g,' ') + (end<src.length?'…':'');
}
App.runNotesSearch = function(q){
  state.notesSearchQuery = q;
  const box = document.getElementById('notesSearchResults');
  if(!box) return;
  const query = (q||'').trim().toLowerCase();
  if(!query){ box.innerHTML = ''; return; }
  const results = [];
  state.subjects.forEach(s=>{
    s.topics.forEach(tp=>{
      const tpPlain = richTextToPlain(tp.notes);
      if((tp.name||'').toLowerCase().includes(query) || tpPlain.toLowerCase().includes(query)){
        results.push({
          sid:s.id, tid:tp.id, subid:null,
          path: escapeHtml(s.name)+' › '+escapeHtml(tp.name),
          snippet: escapeHtml(buildSnippet(tpPlain, query))
        });
      }
      flattenSubtopics(tp.subtopics).forEach(({node:st})=>{
        const stPlain = richTextToPlain(st.notes);
        if((st.name||'').toLowerCase().includes(query) || stPlain.toLowerCase().includes(query)){
          results.push({
            sid:s.id, tid:tp.id, subid:st.id,
            path: escapeHtml(s.name)+' › '+escapeHtml(tp.name)+' › '+escapeHtml(st.name),
            snippet: escapeHtml(buildSnippet(stPlain, query))
          });
        }
      });
    });
  });
  if(results.length===0){
    box.innerHTML = `<div class="empty" style="padding:10px 0;">${t('notes.searchNoResults')}</div>`;
    return;
  }
  box.innerHTML = results.slice(0,30).map(r=>`
    <div class="search-result-item" onclick="App.jumpToNote('${r.sid}','${r.tid}',${r.subid?`'${r.subid}'`:'null'})">
      <strong style="font-size:12.5px;">${r.path}</strong>
      <div class="muted" style="font-size:12px;margin-top:2px;">${r.snippet}</div>
    </div>
  `).join('');
};
App.jumpToNote = function(sid, tid, subid){
  state.activeSubjectId = sid;
  state.notesTopicId = tid;
  state.notesSearchQuery = '';
  saveState(); renderAll();
};

  saveState(); renderAll();
};
App.setNotesTopic = function(id){

App.nextNotesTopic = function(){
  saveAllNotes();
  const s = state.subjects.find(x=>x.id===state.activeSubjectId);
  if(!s || s.topics.length===0) return;
  const idx = s.topics.findIndex(x=>x.id===state.notesTopicId);
  const next = s.topics[(idx+1) % s.topics.length];
  const changed = next.id !== state.notesTopicId;
  state.notesTopicId = next.id;
  saveState(); renderAll();
  window.scrollTo({top:0, behavior:'smooth'});
  if(!changed) flashStatus('notesSaveStatus'); // only one topic exists — nothing to cycle to, but confirm the click registered
};
/* ---- Auto-detected subtopics from bold headings in the main topic note ----
   Writing a whole line in **bold** in the topic notes area (topicNotesArea)
   marks it as a subtopic title; everything after it — up to two fully-blank
   lines in a row, or the next bold heading, whichever comes first — becomes
   that subtopic's content. This is a second, automatic way to get a
   subtopic (alongside, never instead of, manually clicking "소주제 추가" below
   — see syncAutoSubtopicsFromNotes()), so the same subtopic list that
   already feeds card-creation's subtopic autocomplete and 랜덤뽑기's subtopic
   filter also gets populated just by writing normally in the main note. */

/* Splits a contenteditable's DOM into one element per visual "line", matching
   how Chrome actually structures typed content: the first line is loose
   top-level content, every Enter after that wraps its line in its own <div>
   (an empty line is a lone <div><br></div>), and Shift+Enter inserts a <br>
   without starting a new top-level node. Returns an array of elements whose
   .textContent/.innerHTML represent one line each, in document order. */
function getNotesTopLevelLines(container){
  const lines = [];
  let bucket = [];
  function flushBucket(){
    if(bucket.length){
      const wrapper = document.createElement('div');
      bucket.forEach(n=>wrapper.appendChild(n));
      lines.push(wrapper);
      bucket = [];
    }
  }
  Array.from(container.childNodes).forEach(node=>{
    if(node.nodeType===1 && (node.tagName==='DIV'||node.tagName==='P')){
      flushBucket();
      lines.push(node);
    } else if(node.nodeType===1 && node.tagName==='BR'){
      flushBucket();
      lines.push(document.createElement('div')); // explicit blank line
    } else {
      bucket.push(node);
    }
  });
  flushBucket();
  return lines;
}
/* True only when EVERY non-whitespace character on the line sits inside a
   <b>/<strong> — bolding one word in an otherwise-plain sentence (ordinary
   emphasis) must never be mistaken for a subtopic heading. */
function lineIsFullyBold(lineEl){
  const normalize = str=>(str||'').replace(/\s+/g,' ').trim();
  const fullText = normalize(lineEl.textContent);
  if(!fullText) return false;
  let boldText = '';
  lineEl.querySelectorAll('b,strong').forEach(el=>{ boldText += el.textContent; });
  return normalize(boldText)===fullText;
}
/* Parses sanitized notes HTML into {name, html} sections — one per detected
   bold heading, with `html` holding everything below it (as real HTML, so
   colors/bold/etc. inside the body survive) up to the terminating gap. Text
   before the first heading (or after a heading with no content) belongs to
   no subtopic and is ignored here — it's already part of tp.notes itself. */
function parseAutoSubtopicSections(notesHtml){
  const container = document.createElement('div');
  container.innerHTML = notesHtml || '';
  const lineEls = getNotesTopLevelLines(container);
  const sections = [];
  let current = null;
  let blankStreak = 0;
  lineEls.forEach(lineEl=>{
    const text = (lineEl.textContent||'').trim();
    if(text!=='' && lineIsFullyBold(lineEl)){
      current = { name: text, lines: [] };
      sections.push(current);
      blankStreak = 0;
      return;
    }
    if(!current) return;
    if(text===''){
      blankStreak++;
      if(blankStreak>=2){ current = null; blankStreak = 0; return; }
    } else {
      blankStreak = 0;
    }
    current.lines.push(lineEl);
  });
  return sections.map(sec=>({
    name: sec.name,
    html: sec.lines.map(l=>l.outerHTML).join('')
  }));
}
/* Upserts one auto-detected subtopic node per heading found in tp.notes right
   now, and removes any auto-detected node from an EARLIER save whose heading
   no longer appears (so renaming/deleting a bold heading cleans up after
   itself). A name that already belongs to a manually-created subtopic
   (added via the separate "소주제 추가" box) is left completely alone — that
   person-authored subtopic and its own notes are never overwritten by this. */
function syncAutoSubtopicsFromNotes(tp){
  const sections = parseAutoSubtopicSections(tp.notes);
  const seenNames = new Set();
  sections.forEach(sec=>{
    if(seenNames.has(sec.name)) return; // duplicate heading name in one note — keep the first
    seenNames.add(sec.name);
    let node = tp.subtopics.find(n=>n.name===sec.name);
    if(node && !node.autoDetected) return; // a manual subtopic owns this name — don't touch it
    if(!node){
      node = {id:uid(), name:sec.name, notes:'', subtopics:[], autoDetected:true};
      tp.subtopics.push(node);
    }
    node.notes = sanitizeRichHtml(sec.html);
  });
  tp.subtopics = tp.subtopics.filter(n=> !n.autoDetected || seenNames.has(n.name));
}
function saveAllNotes(){
  const s = state.subjects.find(x=>x.id===state.activeSubjectId);
  if(!s) return;
  const tp = s.topics.find(x=>x.id===state.notesTopicId);
  if(!tp) return;
  const wasEmpty = richIsEmpty(tp.notes);
  const topicArea = document.getElementById('topicNotesArea');
  if(topicArea){
    tp.notes = sanitizeRichHtml(topicArea.innerHTML);
    syncAutoSubtopicsFromNotes(tp);
  }
  const pretestArea = document.getElementById('pretestArea');
  if(pretestArea) tp.pretestText = sanitizeRichHtml(pretestArea.innerHTML);
  (function walk(list){
    list.forEach(node=>{
      const area = document.getElementById('subNotesArea-'+node.id);
      if(area) node.notes = sanitizeRichHtml(area.innerHTML);
      walk(node.subtopics||[]);
    });
  })(tp.subtopics);
  saveState();
  const isEmptyNow = richIsEmpty(tp.notes);
  if(wasEmpty !== isEmptyNow) renderAll();
  markTopicReviewed(tp);
}
App.saveAllNotes = function(){
  saveAllNotes();
  const s = state.subjects.find(x=>x.id===state.activeSubjectId);
  const tp = s && s.topics.find(x=>x.id===state.notesTopicId);
  const hasContent = tp && (!richIsEmpty(tp.notes) || flattenSubtopics(tp.subtopics).some(({node})=>!richIsEmpty(node.notes)));
  if(hasContent){
    state.stats.notesSaved++;
    awardXp(3);
  }
  flashStatus('notesSaveStatus');
};
function openPrintableDoc(title, bodyHtml){
  const doc = `<!DOCTYPE html>
<html lang="${state.settings.language}">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{background:#fff;color:#1a1712;font-family:'Work Sans',sans-serif;max-width:720px;margin:40px auto;padding:0 24px 60px;}
  h1{font-family:'Fraunces',serif;font-size:24px;margin:0 0 22px;border-bottom:2px solid #1a1712;padding-bottom:10px;}
  h2{font-family:'Fraunces',serif;font-size:17px;margin:0 0 2px;}
  h3{font-size:14px;margin:0 0 3px;}
  .pdf-topic{page-break-inside:avoid;margin-bottom:26px;}
  .pdf-meta{font-size:11px;color:#6b6152;margin-bottom:10px;font-family:'IBM Plex Mono',monospace;}
  .pdf-body{font-size:13.5px;line-height:1.7;margin-bottom:10px;}
  .pdf-empty{color:#9a917f;font-style:italic;}
  .pdf-subtopic{margin:12px 0 12px 16px;padding-left:12px;border-left:2px solid #ddd4bf;}
  .print-bar{display:flex;justify-content:flex-end;margin-bottom:16px;}
  .print-bar button{font-family:'Work Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 16px;border-radius:7px;border:1px solid #1a1712;background:#1a1712;color:#fff;cursor:pointer;}
  @media print{ .print-bar{display:none;} body{margin:0;padding:0 8mm;} }
</style>
</head>
<body>
<div class="print-bar"><button onclick="window.print()">🖨 ${state.settings.language==='ko'?'인쇄 / PDF로 저장':state.settings.language==='de'?'Drucken / Als PDF':'Print / Save as PDF'}</button></div>
<h1>${escapeHtml(title)}</h1>
${bodyHtml}
</body>
</html>`;
  const blob = new Blob([doc], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
App.exportNotesPDF = function(scope){
  // saveAllNotes() flushes whatever's currently live in the notes/pretest/
  // subtopic contenteditable fields into state — without this, exporting
  // right after typing or changing a color (without first switching topics
  // or clicking the explicit "저장" button, both of which happen to call
  // saveAllNotes() themselves) would build the PDF from whatever was last
  // explicitly saved, silently ignoring the most recent edit.
  saveAllNotes();
  const s = state.subjects.find(x=>x.id===state.activeSubjectId);
  if(!s) return;
  let topics;
  if(scope==='topic'){
    const tp = s.topics.find(x=>x.id===state.notesTopicId);
    topics = tp ? [tp] : [];
  } else {
    topics = s.topics;
  }
  if(topics.length===0) return;
  const body = topics.map(tp=>`
    <div class="pdf-topic">
      <h2>${escapeHtml(tp.name)}</h2>
      <div class="pdf-meta">${escapeHtml(s.name)}${tp.createdAt ? ' · '+tp.createdAt : ''}</div>
      <div class="pdf-body">${!richIsEmpty(tp.notes) ? tp.notes : `<span class="pdf-empty">${t('notes.exportEmpty')}</span>`}</div>
      ${flattenSubtopics(tp.subtopics||[])
        // Auto-detected subtopics (from a bold heading up above) are skipped
        // here on purpose — their content is that bold heading's own text,
        // already printed once as part of the topic body just above, so
        // repeating it as a separate section would just duplicate it.
        // Manually-added subtopics (their own separate notes, never part of
        // the topic body) still get their own section exactly as before.
        .filter(({node:st})=>!st.autoDetected)
        .map(({node:st, depth})=>`
        <div class="pdf-subtopic" style="margin-left:${depth*14}px;">
          <h3>${escapeHtml(st.name)}</h3>
          <div class="pdf-body">${!richIsEmpty(st.notes) ? st.notes : `<span class="pdf-empty">${t('notes.exportEmpty')}</span>`}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
  const title = s.name + (scope==='topic' ? ' · '+topics[0].name : '');
  openPrintableDoc(title, body);
};
function escapeAttr(str){
  return String(str||'')
    .replace(/&/g,'&amp;')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/"/g,'&quot;')
    .replace(/\r?\n/g,' ');
}
App.addSubtopic = function(sid, tid, parentId){
  const inputKey = parentId || tid;
  const input = document.getElementById('newSub-'+inputKey);
  const name = input ? input.value.trim() : '';
  if(!name) return;
  const s = state.subjects.find(x=>x.id===sid);
  const tp = s.topics.find(x=>x.id===tid);
  let targetList;
  if(!parentId){
    targetList = tp.subtopics;
  } else {
    const parentNode = findSubtopicNode(tp.subtopics, parentId);
    if(!parentNode) return;
    if(!Array.isArray(parentNode.subtopics)) parentNode.subtopics = [];
    targetList = parentNode.subtopics;
  }
  targetList.push({id:uid(), name, notes:'', subtopics:[]});
  saveState(); renderAll();
  focusInput('newSub-'+inputKey);
};
App.deleteSubtopic = function(sid, tid, subid){
  const s = state.subjects.find(x=>x.id===sid);
  const tp = s.topics.find(x=>x.id===tid);
  const target = findSubtopicNode(tp.subtopics, subid);
  const doDelete = function(){
    removeSubtopicNode(tp.subtopics, subid);
    if(state.editingSubtopicId===subid) state.editingSubtopicId = null;
    saveState(); renderAll();
  };
  if(target){
    showConfirm(tf('confirm.deleteSubtopic', {name: target.name}), doDelete);
  } else {
    doDelete();
  }
};

App.cancelEditSubtopic = function(){ state.editingSubtopicId = null; renderAll(); };

App.seedCard = function(sid, name, notes){
  if(state.activeTab==='notes') saveAllNotes();
  // An explicit draft from this shortcut should always win over any leftover
  // unsaved-form snapshot from an earlier, unrelated cards-tab visit.
  unsavedCardFormSnapshot = null;
  state.cardDraft = { subjectId: sid, front: name, back: notes || '' };
  state.activeTab = 'cards';
  saveState(); renderAll();
  scrollActiveTabIntoView();
};
/* Bulk "소주제로 카드 만들기" — one flashcard per subtopic in this topic
   (front = the subtopic's name, back = its notes), covering BOTH
   manually-added subtopics and the ones auto-detected from a bold heading
   in the main note (see syncAutoSubtopicsFromNotes()) — exactly the "note
   written in the bold-heading format" the person asked to turn into cards,
   without having to open each subtopic and click "카드로 만들기" one at a
   time. Unlike seedCard() this commits the cards directly instead of
   dropping a single draft into the create form, since there can be many.
   Re-running it after editing the note updates each card's back to match
   the latest notes instead of piling up duplicates, while keeping that
   card's own review progress (interval/ease/reps/dueDate) untouched. Each
   card is tagged with subtopic = that subtopic's name, same as typing it
   into the subtopic field by hand, so it's immediately reachable through
   the existing subtopic filters everywhere else in the app. */
App.makeCardsFromSubtopics = function(sid, tid){
  if(state.activeTab==='notes') saveAllNotes();
  const s = state.subjects.find(x=>x.id===sid);
  const tp = s && s.topics.find(x=>x.id===tid);
  if(!tp) return;
  const nodes = flattenSubtopics(tp.subtopics||[])
    .map(({node})=>node)
    .filter(node=>!richIsEmpty(node.notes));
  if(nodes.length===0){
    showAlert(t('notes.noSubtopicContentForCards'));
    return;
  }
  let created = 0, updated = 0;
  nodes.forEach(node=>{
    const existing = state.cards.find(c=>
      c.subjectId===sid && c.type==='basic' && c.subtopic===node.name &&
      richTextToPlain(c.front).trim()===node.name.trim()
    );
    if(existing){
      existing.back = node.notes;
      updated++;
    } else {
      state.cards.push({
        id: uid(), subjectId: sid, type:'basic', subtopic: node.name,
        interval:1, ease:2.5, reps:0, dueDate: todayISO(),
        front: escapeHtml(node.name), back: node.notes
      });
      created++;
    }
  });
  state.lastCardSubjectId = sid;
  saveState(); renderAll();
  showAlert(tf('notes.subtopicCardsResult', {created, updated}));
};

/* ============ CYCLE (reading passes) ============ */
function renderCycle(){
  if(state.subjects.length===0){
    return `<div class="card">${needSubjectsBlock(t('cycle.needSubjects'))}</div>`;
  }
  const sid = state.activeSubjectId || state.subjects[0].id;
  const s = state.subjects.find(x=>x.id===sid);
  if(!s){ state.activeSubjectId = state.subjects[0].id; return renderCycle(); }
  const options = state.subjects.map(x=>`<option value="${x.id}" ${x.id===sid?'selected':''}>${escapeHtml(x.name)}</option>`).join('');

  const byCat = {};
  s.topics.forEach(tp=>{
    const key = tp.categoryId || 'none';
    (byCat[key] = byCat[key]||[]).push(tp);
  });

  const sections = Object.keys(byCat).map(key=>{
    const cat = s.categories.find(c=>c.id===key);
    const label = cat ? cat.name : t('cycle.uncategorized');
    const rows = byCat[key].map(tp=>{
      const holes = tp.passes.map((done,i)=>`
        <div class="punch-hole ${done?'done':''}" onclick="event.stopPropagation();event.preventDefault();App.togglePass('${s.id}','${tp.id}',${i})" title="${i+1}">${done?'✓':i+1}</div>
      `).join('');
      const subList = flattenSubtopics(tp.subtopics).map(({node:st, depth})=>`
        <div style="margin:6px 0 6px ${14+depth*16}px;padding-left:10px;border-left:2px solid var(--line);">
          <strong style="font-size:12.5px;">${escapeHtml(st.name)}</strong>
          <div class="muted" style="font-size:12px;margin-top:2px;line-height:1.5;">${!richIsEmpty(st.notes)?st.notes:t('draw.noNotes')}</div>
        </div>
      `).join('');
      return `<details class="cycle-topic">
        <summary class="cycle-summary">
          <span style="display:flex;align-items:center;gap:6px;min-width:0;">
            <span class="cycle-chevron">▸</span>
            <span class="topic-name">${escapeHtml(tp.name)}</span>
            ${isTopicStale(tp) ? `<span title="${t('cycle.staleTooltip')}" style="font-size:12px;">⏰</span>` : ''}
          </span>
          <div class="punch">${holes}</div>
        </summary>
        <div style="padding:2px 4px 12px 24px;">
          <div class="muted" style="font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;">${t('notes.topicNotesLabel')}</div>
          <div style="font-size:13px;line-height:1.6;">${!richIsEmpty(tp.notes)?tp.notes:'<span class="muted">'+t('draw.noNotes')+'</span>'}</div>
          ${subList ? `<div class="muted" style="font-size:11px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em;">${t('notes.subtopicsLabel')}</div>${subList}` : ''}
        </div>
      </details>`;
    }).join('');
    return `<div style="margin-bottom:18px;">
      <div class="muted" style="font-size:12px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;">${escapeHtml(label)}</div>
      ${rows}
    </div>`;
  }).join('') || `<div class="empty">${t('cycle.noTopics')}</div>`;

  return `
    <div class="card">
      <div class="row" style="margin-bottom:16px;">
        <div><label>${t('cycle.subjectSelect')}</label><select onchange="App.selectSubject(this.value)">${options}</select></div>
      </div>
      <h2 class="section-title">${t('cycle.title')}</h2>
      ${sections}
    </div>
  `;
}
App.togglePass = function(sid,tid,idx){
  const s = state.subjects.find(x=>x.id===sid);
  const tp = s.topics.find(x=>x.id===tid);
  const turningOn = !tp.passes[idx];
  tp.passes[idx] = turningOn;
  if(turningOn){ state.passLog.push({date:todayISO()}); if(state.passLog.length>500) state.passLog=state.passLog.slice(-500); awardXp(15); markTopicReviewed(tp); }
  saveState(); renderAll();
};

/* ============ CONFIDENCE + STALENESS ============ */
function markTopicReviewed(tp){
  if(tp) tp.lastReviewedAt = todayISO();
}
App.setTopicConfidence = function(sid, tid, level){
  const s = state.subjects.find(x=>x.id===sid);
  const tp = s && s.topics.find(x=>x.id===tid);
  if(!tp) return;
  tp.confidence = (tp.confidence===level) ? null : level;
  saveState(); renderAll();
};
/* Staleness schedule grows as more reading passes are completed, echoing the
   spaced-repetition idea already used for flashcards: a fresh topic needs
   re-checking sooner (3 days) than one that's already been read several times (30 days). */
const REVIEW_SCHEDULE_DAYS = [3, 7, 14, 30];
function isTopicStale(tp){
  if(!tp.lastReviewedAt) return true;
  const passesDone = tp.passes.filter(Boolean).length;
  const idx = Math.min(passesDone, REVIEW_SCHEDULE_DAYS.length-1);
  const days = REVIEW_SCHEDULE_DAYS[idx];
  return daysBetween(tp.lastReviewedAt, todayISO()) >= days;
}
function collectStaleTopics(){
  const out = [];
  state.subjects.forEach(s=>{
    s.topics.forEach(tp=>{
      if(isTopicStale(tp)){
        out.push({subjectId:s.id, subjectName:s.name, topicId:tp.id, topicName:tp.name});
      }
    });
  });
  return out;
}

/* ---- Guided sequential review queue for stale topics ---- */
App.startTopicReview = function(){
  if(state.activeTab==='notes') saveAllNotes();
  const items = collectStaleTopics();
  if(items.length===0) return;
  state.reviewQueue = { active:true, items, index:0 };
  state.activeTab = 'notes';
  state.activeSubjectId = items[0].subjectId;
  state.notesTopicId = items[0].topicId;
  saveState(); renderAll();
  scrollActiveTabIntoView();
};
App.reviewQueueNext = function(){
  const q = state.reviewQueue;
  if(!q.active) return;
  saveAllNotes();
  if(q.index+1 < q.items.length){
    q.index += 1;
    const next = q.items[q.index];
    state.activeSubjectId = next.subjectId;
    state.notesTopicId = next.topicId;
  } else {
    q.active = false;
  }
  saveState(); renderAll();
};
App.endTopicReview = function(){
  state.reviewQueue.active = false;
  saveState(); renderAll();
};
App.startGapReview = function(){
  if(state.activeTab==='notes') saveAllNotes();
  state.gapsStatusFilter = 'unresolved';
  state.activeTab = 'gaps';
  saveState(); renderAll();
  scrollActiveTabIntoView();
};
function renderReviewQueueBanner(){

}

/* ============ RANDOM DRAW ============ */
function renderDraw(){
  if(state.subjects.length===0){
    return `<div class="card">${needSubjectsBlock(t('draw.needSubjects'))}</div>`;
  }
  // The tab's own toggle between drawing a random NOTE topic (original
  // behavior) and drawing a random FLASHCARD (added so this tab can double
  // as flashcard practice, per the user's own suggestion to reuse the
  // existing random-draw tab rather than build a separate one) — kept
  // separate from the equal/weighted mode-toggle inside the topic body,
  // which only applies to topic drawing.
  const itemType = state.draw.itemType==='card' ? 'card' : 'topic';
  return `
    <div class="card">
      <div class="mode-toggle" style="margin-bottom:12px;">

/* Flashcard version of the random-draw tab: picks one random CARD (instead
   of a note topic) from the cards matching the chosen subject/subtopic
   filter, shows its front, and reveals the back on click — the same
   idle -> drawn -> reveal flow as the topic body above, just over
   state.cards instead of state.subjects[].topics. */
function renderDrawCardBody(){
  const csid = state.draw.cardSubjectId || 'all';
  state.draw.cardSubjectId = csid;
  const subOptions = `<option value="all" ${csid==='all'?'selected':''}>${t('cards.allSubjectsOpt')}</option>` +
    state.subjects.map(x=>`<option value="${x.id}" ${x.id===csid?'selected':''}>${escapeHtml(x.name)}</option>`).join('');

  const subtopicPool = state.cards.filter(c=> csid==='all' || c.subjectId===csid);
  const hasNoSubtopicCard = subtopicPool.some(c=>!c.subtopic);
  const subtopicNames = Array.from(new Set(subtopicPool.map(c=>c.subtopic).filter(Boolean))).sort();
  const subtopicOptions = `<option value="all" ${state.draw.cardSubtopic==='all'?'selected':''}>${t('cards.allSubtopicsOpt')}</option>` +
    (hasNoSubtopicCard ? `<option value="__none__" ${state.draw.cardSubtopic==='__none__'?'selected':''}>${t('cards.noSubtopicOpt')}</option>` : '') +
    subtopicNames.map(x=>`<option value="${escapeAttr(x)}" ${state.draw.cardSubtopic===x?'selected':''}>${escapeHtml(x)}</option>`).join('');

  let resultBlock = `<div class="draw-result muted">${t('draw.cardIdle')}</div>`;
  if(state.draw.currentCardId){
    const c = state.cards.find(x=>x.id===state.draw.currentCardId);
    if(c){
      const s = state.subjects.find(x=>x.id===c.subjectId);
      let frontHtml, backHtml;
      if(c.type==='cloze'){ frontHtml = clozeRender(c.clozeText,false); backHtml = clozeRender(c.clozeText,true); }
      else { frontHtml = c.front; backHtml = c.back; }
      resultBlock = `
        <div class="draw-result">
          <div class="muted mono" style="font-size:12px;">${t('draw.drawnCardLabel')}${s?' · '+escapeHtml(s.name):''}${c.subtopic?' · '+escapeHtml(c.subtopic):''}</div>
          <div class="flash" id="drawFlashCard" onclick="App.flipDrawCard()">${state.draw.cardRevealed?backHtml:frontHtml}</div>
          <div class="muted" style="font-size:11px;margin-top:8px;">${t('cards.flipHint')}</div>
        </div>`;
    }
  }

  return `
    <div class="row" style="margin-bottom:6px;">
      <div><label>${t('cards.subjectLabel')}</label><select onchange="App.setDrawCardSubject(this.value)">${subOptions}</select></div>
      <div><label>${t('cards.subtopicFilterLabel')}</label><select onchange="App.setDrawCardSubtopic(this.value)">${subtopicOptions}</select></div>
    </div>
    ${resultBlock}
    <div style="text-align:center;margin-top:10px;">
      <button class="btn" onclick="App.drawCard()">${t('draw.drawCardBtn')}</button>
    </div>
  `;
}
App.setDrawSubject = function(v){ state.draw.subjectId=v; state.draw.categoryId='all'; state.draw.current=null; state.draw.currentSubId=null; state.draw.revealed=false; saveState(); renderAll(); };
App.setDrawCategory = function(v){ state.draw.categoryId=v; saveState(); renderAll(); };
App.setIncludeSubtopics = function(v){ state.draw.includeSubtopics=v; saveState(); renderAll(); };
App.setDrawMode = function(v){ state.draw.mode=v; saveState(); renderAll(); };
App.setDrawItemType = function(v){ state.draw.itemType = (v==='card') ? 'card' : 'topic'; saveState(); renderAll(); };
App.setDrawCardSubject = function(v){
  state.draw.cardSubjectId = v || 'all';
  // Subtopics are scoped to a subject, same reasoning as the card browse
  // filter — switching subjects resets the subtopic filter.
  state.draw.cardSubtopic = 'all';
  state.draw.currentCardId = null;
  state.draw.cardRevealed = false;
  saveState(); renderAll();
};
App.setDrawCardSubtopic = function(v){
  state.draw.cardSubtopic = v || 'all';
  state.draw.currentCardId = null;
  state.draw.cardRevealed = false;
  saveState(); renderAll();
};
App.drawCard = function(){
  const pool = state.cards.filter(c=>
    (state.draw.cardSubjectId==='all' || c.subjectId===state.draw.cardSubjectId) &&
    (state.draw.cardSubtopic==='all' || (state.draw.cardSubtopic==='__none__' ? !c.subtopic : c.subtopic===state.draw.cardSubtopic))
  );
  if(pool.length===0){ showAlert(t('draw.emptyCardPool')); return; }
  const pick = pool[Math.floor(Math.random()*pool.length)];
  state.draw.currentCardId = pick.id;
  state.draw.cardRevealed = false;
  state.stats.drawsUsed++;
  awardXp(2);
  saveState(); renderAll();
};
App.flipDrawCard = function(){
  state.draw.cardRevealed = !state.draw.cardRevealed;
  renderAll();
};
function drawItemWeight(s, item){
  let weight = 1;
  const tp = s.topics.find(x=>x.id===item.topicId);
  if(!tp) return weight;
  const gapCount = state.gaps.filter(g=>
    !g.resolved && g.subjectId===s.id && g.topicId===item.topicId &&
    (item.subId ? g.subtopicId===item.subId : !g.subtopicId)
  ).length;
  weight += gapCount * 3;
  if(!item.subId){
    weight += tp.passes.filter(p=>!p).length;
    if(isTopicStale(tp)) weight += 2;
    if(tp.confidence==='low') weight += 3;
    else if(tp.confidence==='mid') weight += 1;
  }
  return weight;
}
App.drawTopic = function(){
  const s = state.subjects.find(x=>x.id===state.draw.subjectId);
  if(!s) return;
  let topicPool = s.topics;
  if(state.draw.categoryId && state.draw.categoryId!=='all'){
    topicPool = topicPool.filter(tp=>tp.categoryId===state.draw.categoryId);
  }
  const pool = [];
  topicPool.forEach(tp=>{
    pool.push({topicId:tp.id, subId:null});
    if(state.draw.includeSubtopics){
      flattenSubtopics(tp.subtopics).forEach(({node:st})=> pool.push({topicId:tp.id, subId:st.id}));
    }
  });
  if(pool.length===0){ showAlert(t('draw.emptyPool')); return; }
  let pick;
  if(state.draw.mode==='weighted'){
    const weights = pool.map(item=>drawItemWeight(s, item));
    const total = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    let idx = 0;
    for(let i=0;i<weights.length;i++){
      r -= weights[i];
      if(r<=0){ idx = i; break; }
    }
    pick = pool[idx];
  } else {
    pick = pool[Math.floor(Math.random()*pool.length)];
  }
  state.draw.current = pick.topicId;
  state.draw.currentSubId = pick.subId;
  state.draw.revealed = false;
  state.stats.drawsUsed++;
  awardXp(2);
  saveState(); renderAll();
};
App.revealDraw = function(){
  state.draw.revealed = true;
  const s = state.subjects.find(x=>x.id===state.draw.subjectId);
  const tp = s && s.topics.find(x=>x.id===state.draw.current);
  if(tp) markTopicReviewed(tp);
  saveState(); renderAll();
};

function renderExamSetup(){

function renderExamQuestion(){
  const ex = state.output.exam;
  const s = state.subjects.find(x=>x.id===ex.subjectId);
  const item = ex.queue[ex.index];
  if(!s || !item){ ex.active=false; return renderExamSetup(); }
  const tp = s.topics.find(x=>x.id===item.topicId);
  if(!tp){ ex.active=false; return renderExamSetup(); }
  const target = item.subId ? findSubtopicNode(tp.subtopics, item.subId) : tp;
  if(!target){ ex.active=false; return renderExamSetup(); }
  const targetName = target.name;
  const referenceHtml = item.subId
    ? (!richIsEmpty(target.notes) ? target.notes : `<span class="muted">${t('output.noReference')}</span>`)
    : (!richIsEmpty(tp.notes) || flattenSubtopics(tp.subtopics).some(({node})=>!richIsEmpty(node.notes)) ? buildFullTopicNotesHtml(tp) : `<span class="muted">${t('output.noReference')}</span>`);

    flattenSubtopics(tp.subtopics).forEach(({node:st})=> flat.push({ topicId: tp.id, targetId: st.id }));
  });
  if(flat.length===0) return;
  const curIndex = flat.findIndex(f=>f.topicId===state.output.topicId && f.targetId===(state.output.targetId||''));

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
App.startExam = function(){
  const ex = state.output.exam;
  const s = state.subjects.find(x=>x.id===ex.subjectId);
  if(!s) return;
  let topicPool = s.topics;
  if(ex.categoryId && ex.categoryId!=='all'){
    topicPool = topicPool.filter(tp=>tp.categoryId===ex.categoryId);
  }
  const pool = [];
  topicPool.forEach(tp=>{
    pool.push({topicId:tp.id, subId:null});
    if(ex.includeSubtopics){
      flattenSubtopics(tp.subtopics).forEach(({node:st})=> pool.push({topicId:tp.id, subId:st.id}));
    }
  });
  if(pool.length===0){ showAlert(t('output.exam.emptyPool')); return; }
  ex.queue = shuffleArray(pool);
  ex.index = 0;
  ex.active = true;
  ex.finished = false;
  ex.revealed = false;
  ex.recallText = '';
  ex.remaining = ex.timeLimit;
  ex.running = ex.timeLimit>0;
  saveState(); renderAll();
  if(ex.running && state.activeTab==='output') resumeExamTimer();
};

let examTimerHandle = null;
function pauseExamTimer(){
  if(examTimerHandle){ clearInterval(examTimerHandle); examTimerHandle = null; }
  examLastTs = null;
}
function resumeExamTimer(){
  pauseExamTimer();
  examLastTs = Date.now();
  examTimerHandle = setInterval(examTick, 1000);
}
/* See masterTick's comment: browsers throttle background-tab intervals, so
   we measure real elapsed time rather than assuming 1 tick = 1 second. */
function examTick(){
  const ex = state.output.exam;
  if(!ex.active || !ex.running){ pauseExamTimer(); return; }
  const now = Date.now();
  if(examLastTs==null) examLastTs = now;
  let deltaSeconds = Math.floor((now - examLastTs)/1000);
  if(deltaSeconds < 1) return;
  if(deltaSeconds > TIMER_CATCHUP_CAP_SECONDS) deltaSeconds = TIMER_CATCHUP_CAP_SECONDS;
  examLastTs += deltaSeconds*1000;
  ex.remaining -= deltaSeconds;
  if(ex.remaining<=0){
    ex.remaining = 0;
    ex.revealed = true;
    ex.running = false;
    pauseExamTimer();
    saveState();
  }
  if(state.activeTab==='output') renderAll();
}

/* ============ FLASHCARDS ============ */
function refreshCardReviewQueue(){
  const cr = state.cardReview;
  let pool;
  if(cr.mode==='all'){
    pool = state.cards.filter(c=>
      (cr.browseSubjectId==='all' || c.subjectId===cr.browseSubjectId) &&
      (cr.browseSubtopic==='all' || (cr.browseSubtopic==='__none__' ? !c.subtopic : c.subtopic===cr.browseSubtopic))
    );
  } else {
    pool = state.cards.filter(c=>c.dueDate<=todayISO());
  }
  const ids = pool.map(c=>c.id);
  const currentId = cr.queue[cr.index];
  let newIndex = 0;
  if(currentId){
    const idx = ids.indexOf(currentId);
    if(idx>=0) newIndex = idx;
  }
  cr.queue = ids;
  cr.index = ids.length ? Math.min(newIndex, ids.length-1) : 0;
}
/* Builds the "study" side of the Cards tab — the mode toggle (due/browse),
   the subject+subtopic filters (browse mode only), and the flip-review
   card itself. Shared verbatim between the normal split layout in
   renderCards() and the fullscreen memorize overlay, so the filtering
   logic and review UI never has to be kept in sync across two copies. */
function renderCardStudyPanel(){
  refreshCardReviewQueue();
  const cr = state.cardReview;
  const queue = cr.queue;
  const browseMode = cr.mode==='all';

  const browseSubOptions = `<option value="all" ${cr.browseSubjectId==='all'?'selected':''}>${t('cards.allSubjectsOpt')}</option>` +
    state.subjects.map(s=>`<option value="${s.id}" ${cr.browseSubjectId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');

  // Subtopic filter options are scoped to whichever subject is currently
  // selected (or all cards, if the subject filter is 'all') so the
  // dropdown never lists subtopics that don't apply to the current view.
  const subtopicPool = state.cards.filter(c=> cr.browseSubjectId==='all' || c.subjectId===cr.browseSubjectId);
  const hasNoSubtopicCard = subtopicPool.some(c=>!c.subtopic);
  const subtopicNames = Array.from(new Set(subtopicPool.map(c=>c.subtopic).filter(Boolean))).sort();
  const browseSubtopicOptions = `<option value="all" ${cr.browseSubtopic==='all'?'selected':''}>${t('cards.allSubtopicsOpt')}</option>` +
    (hasNoSubtopicCard ? `<option value="__none__" ${cr.browseSubtopic==='__none__'?'selected':''}>${t('cards.noSubtopicOpt')}</option>` : '') +
    subtopicNames.map(x=>`<option value="${escapeAttr(x)}" ${cr.browseSubtopic===x?'selected':''}>${escapeHtml(x)}</option>`).join('');

  let reviewBlock = `<div class="empty">${browseMode ? t('cards.noneAll') : t('cards.noneToday')}</div>`;
  if(queue.length>0){
    const idx = cr.index;
    const c = state.cards.find(x=>x.id===queue[idx]);
    const s = c ? state.subjects.find(x=>x.id===c.subjectId) : null;
    let frontHtml, backHtml;
    if(c.type==='cloze'){
      frontHtml = clozeRender(c.clozeText,false);
      backHtml = clozeRender(c.clozeText,true);
    } else {
      frontHtml = c.front;
      backHtml = c.back;
    }
    reviewBlock = `
      <div class="row" style="margin-bottom:8px;justify-content:space-between;align-items:center;flex-wrap:nowrap;">
        <div class="muted mono" style="font-size:11px;">${tf('cards.progressLabel',{current:idx+1,total:queue.length})} · ${s?escapeHtml(s.name):''}${c.subtopic?' · '+escapeHtml(c.subtopic):''}</div>
        <div style="display:flex;gap:2px;flex-shrink:0;">
          <button class="btn ghost small" style="padding:1px 5px;font-size:11px;opacity:.55;" onclick="App.startEditCardFromBrowse('${c.id}')" title="${t('cards.edit')}">✏️</button>
          <button class="btn ghost small" style="padding:1px 5px;font-size:11px;opacity:.55;" onclick="App.deleteCard('${c.id}')" title="${t('cards.delete')}">🗑️</button>
        </div>
      </div>
      <div class="flash" id="flashCard" onclick="App.flipCard()">
        ${cr.flipped ? backHtml : frontHtml}

function renderCards(){
  const draft = state.cardDraft || null;
  state.cardDraft = null;

  // Whatever the person had typed into the new-card form but hadn't
  // submitted yet, captured just before this render replaced the DOM (see
  // captureUnsavedCardFormSnapshot()) — e.g. from flipping/paging through
  // cards in the 카드 둘러보기 panel right next to it. A one-shot seedCard()
  // draft is a more explicit, intentional prefill (from a notes/pretest
  // "make card" shortcut) and always wins over a leftover snapshot; editing
  // an existing card always shows that card's own data regardless of either.
  const snapshot = (!editingCard && !draft) ? unsavedCardFormSnapshot : null;
  const snapshotSubjectValid = snapshot && state.subjects.some(s=>s.id===snapshot.subjectId);

  const fallbackSubjectId = state.subjects.some(s=>s.id===state.lastCardSubjectId) ? state.lastCardSubjectId : (state.subjects[0] && state.subjects[0].id);
  const selectedSubjectId = editingCard ? editingCard.subjectId : (draft ? draft.subjectId : (snapshotSubjectValid ? snapshot.subjectId : fallbackSubjectId));
  const subOptions = state.subjects.map(s=>`<option value="${s.id}" ${selectedSubjectId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  // A freshly-seeded draft (from the notes/pretest "make card" shortcut) is
  // always the basic front/back shape, so it overrides lastCardType — but
  // otherwise remember whichever type was last added (mirrors
  // lastCardSubjectId) so adding several cloze cards in a row doesn't force
  // re-selecting "cloze" from the dropdown after every single add.
  const initialType = editingCard ? editingCard.type : (draft ? 'basic' : (snapshot ? snapshot.type : state.lastCardType));
  // Same idea for the subtopic text field: remembered per-subject (not
  // globally) so switching subjects doesn't carry over an unrelated
  // subtopic, but adding several cards under the same subtopic in a row
  // (the whole point of the field) doesn't require retyping it each time.
  const subtopicValue = editingCard ? (editingCard.subtopic||'') : (draft ? '' : (snapshot ? snapshot.subtopic : (state.lastCardSubtopicBySubject[selectedSubjectId]||'')));
  // Suggestion list is a union of two sources — the real 소주제 list already
  // defined for this subject in Subject Management (so an existing subtopic
  // can be searched and picked instead of retyped, keeping wording
  // consistent with the notes side of the app), plus any subtopic strings
  // already used on this subject's flashcards (in case one was typed here
  // before ever being added in Subject Management). The suggestion box
  // still lets the field be typed into freely, so creating a brand-new
  // subtopic name stays just as easy as before.
  //
  // This used to be a native <input list="..."><datalist> pairing, but
  // Safari doesn't reliably pop up datalist suggestions at all (a
  // long-standing WebKit limitation) — the person testing on a Mac just
  // saw a plain text field with no hint anything was suggested. Rendering
  // our own dropdown (App.showSubtopicSuggestions/pickSubtopicSuggestion
  // below) works the same in every browser. cardSubtopicSuggestionPool is
  // a plain module-level array (not app state) refreshed on every render,
  // read directly by those handlers — same pattern as
  // cardFieldLastKeyWasEnter's module-level tracking elsewhere in this file.
  const subtopicChoices = Array.from(new Set([
    ...getSubjectSubtopicNames(selectedSubjectId),
    ...state.cards.filter(c=>c.subjectId===selectedSubjectId && c.subtopic).map(c=>c.subtopic)
  ])).sort();
  cardSubtopicSuggestionPool = subtopicChoices;

  const browseMode = state.cardReview.mode==='all';
  // The raw "every card, most-recent-first" list that used to live under
  // the create/edit form was removed per the user's own request — it only
  // ever showed a partial slice (most recent 50) and felt incomplete
  // ("전체 리스트가 안보이고 파트로 보이는" — looks partial, not the full list).
  // Editing/deleting now happens from the study panel on the left instead
  // (see the edit/delete row added to renderCardStudyPanel()'s reviewBlock),
  // which already lets you page through — and, in browse-all mode,
  // subject/subtopic-filter down to — every card, one at a time.
  const studyPanelHtml = renderCardStudyPanel();

  return `
    <div class="grid grid-2">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <h2 class="section-title" style="margin-bottom:0;">${browseMode ? t('cards.browseTitle') : t('cards.todayTitle')}</h2>
          <button class="btn ghost small" onclick="App.openCardMemorize()">${t('cards.memorizeBtn')}</button>
        </div>
        <div style="margin-top:10px;">${studyPanelHtml}</div>
      </div>
      <div class="card">
        <h2 class="section-title">${editingCard ? t('cards.editTitle') : t('cards.createTitle')}</h2>
        <div class="field"><label>${t('cards.subjectLabel')}</label><select id="cardSubject" onchange="App.setCardSubject(this.value)">${subOptions}</select></div>
        <div class="field" style="position:relative;">
          <label>${t('cards.subtopicLabel')}</label>
          <input type="text" id="cardSubtopic" autocomplete="off" placeholder="${t('cards.subtopicPh')}" value="${escapeAttr(subtopicValue)}"
            oninput="App.showSubtopicSuggestions()" onfocus="App.showSubtopicSuggestions()" onblur="App.hideSubtopicSuggestionsDelayed()"
            onkeydown="App.handleSubtopicFieldEnterKey(event)">
          <div id="cardSubtopicSuggestions" class="subtopic-suggestions" style="display:none;"></div>
        </div>
        <div class="field"><label>${t('cards.typeLabel')}</label>
          <select id="cardType" onchange="App.toggleCardType()">
            <option value="basic" ${initialType==='basic'?'selected':''}>${t('cards.basicOpt')}</option>
            <option value="cloze" ${initialType==='cloze'?'selected':''}>${t('cards.clozeOpt')}</option>
          </select>
        </div>
        <div id="basicFields" style="display:${initialType==='basic'?'block':'none'};">
          <div class="field"><label>${t('cards.frontLabel')}</label>${richFieldHtml('cardFront', editingCard&&editingCard.type==='basic'?editingCard.front:(draft?plainToRichHtml(draft.front):(snapshot?snapshot.frontHtml:'')), '', 60, 'onkeydown="App.handleCardFieldEnterKey(event,\'cardFront\')"')}</div>
          <div class="field"><label>${t('cards.backLabel')}</label>${richFieldHtml('cardBack', editingCard&&editingCard.type==='basic'?editingCard.back:(draft?draft.back:(snapshot?snapshot.backHtml:'')), '', 60, 'onkeydown="App.handleCardFieldEnterKey(event,\'cardBack\')"')}</div>
        </div>
        <div id="clozeFields" style="display:${initialType==='cloze'?'block':'none'};">
          <div class="field"><label>${t('cards.clozeBodyLabel')}</label>
            <textarea id="cardCloze" placeholder="${t('cards.clozePh')}" onkeydown="App.handleCardFieldEnterKey(event,'cardCloze')">${editingCard&&editingCard.type==='cloze'?escapeHtml(editingCard.clozeText):(snapshot?escapeHtml(snapshot.clozeText):'')}</textarea>
          </div>
        </div>
        ${editingCard
          ? `<div class="row"><button class="btn" onclick="App.saveCardEdit()">${t('cards.saveEdit')}</button><button class="btn ghost" onclick="App.cancelCardEdit()">${t('cards.cancelEdit')}</button></div>`
          : `<button class="btn" onclick="App.addCard()">${t('cards.addCard')}</button>`
        }
      </div>
    </div>
  `;
}
/* Fullscreen "카드 암기" (memorize) mode — a distraction-free version of

   as the tutorial overlay below) rather than into #panel, so it covers the

   Rebuilt from scratch on every renderAll() call, mirroring the tutorial
   overlay's own reasoning: cheap to do, and avoids ever holding a stale

function clozeRender(text, revealed){

}
function stripCloze(text){

App.toggleCardType = function(){

App.setCardSubject = function(v){ state.lastCardSubjectId = v || null; saveState(); };
/* Custom dropdown for the #cardSubtopic field — see the comment above its
   render call in renderCards() for why this isn't a native <datalist>
   (Safari doesn't show datalist suggestions at all). cardSubtopicSuggestionPool
   is refreshed by renderCards() on every render; these handlers just filter
   it against the input's current text and paint a small absolutely-
   positioned list under the field, entirely outside renderAll()/innerHTML
   churn so typing doesn't lose focus or re-render the rest of the form. */
let cardSubtopicSuggestionPool = [];

/* Whatever's currently typed into the NEW-card form (not yet submitted) used
   to get silently thrown away by any unrelated renderAll() call — most
   noticeably, flipping/paging through cards in the "카드 둘러보기" panel right
   next to it, since renderCards() only ever pre-fills the form from an
   explicit editingCard or a one-shot seedCard() draft, and blanks it
   otherwise. captureUnsavedCardFormSnapshot() is called at the top of every
   renderAll(), right before the DOM it would read gets replaced, and stashes
   the live field values here so renderCards() can restore them on the next
   paint. skipCardFormCapture is set (briefly, synchronously) around the
   handful of actions that legitimately WANT the form to go blank — adding
   the card, cancelling/saving an edit, or starting to edit a different card —
   so those don't re-capture the very content they're clearing. */
let unsavedCardFormSnapshot = null;
let skipCardFormCapture = false;
function captureUnsavedCardFormSnapshot(){
  if(skipCardFormCapture) return;
  if(!state || state.activeTab!=='cards' || state.cardEditingId) return;
  const subjectEl = document.getElementById('cardSubject');
  const frontEl = document.getElementById('cardFront');
  const clozeEl = document.getElementById('cardCloze');
  if(!subjectEl && !frontEl && !clozeEl) return; // create form isn't on screen right now
  const subtopicEl = document.getElementById('cardSubtopic');
  const typeEl = document.getElementById('cardType');
  const backEl = document.getElementById('cardBack');
  unsavedCardFormSnapshot = {
    subjectId: subjectEl ? subjectEl.value : null,
    subtopic: subtopicEl ? subtopicEl.value : '',
    type: typeEl ? typeEl.value : 'basic',
    frontHtml: frontEl ? frontEl.innerHTML : '',
    backHtml: backEl ? backEl.innerHTML : '',
    clozeText: clozeEl ? clozeEl.value : ''
  };
}
App.showSubtopicSuggestions = function(){
  const input = document.getElementById('cardSubtopic');
  const box = document.getElementById('cardSubtopicSuggestions');
  if(!input || !box) return;
  const q = input.value.trim().toLowerCase();
  const matches = cardSubtopicSuggestionPool.filter(x => (!q || x.toLowerCase().includes(q)) && x.toLowerCase()!==q);
  if(matches.length===0){ box.style.display = 'none'; box.innerHTML = ''; return; }
  box.innerHTML = matches.slice(0,20).map(x=>
    `<div class="subtopic-suggestion-item" onmousedown="event.preventDefault();App.pickSubtopicSuggestion('${escapeAttr(x)}')">${escapeHtml(x)}</div>`
  ).join('');

};
App.pickSubtopicSuggestion = function(value){

App.hideSubtopicSuggestions = function(){

};
// onmousedown above already calls preventDefault() so picking a suggestion
// never blurs the field in the first place — this delayed hide only

App.hideSubtopicSuggestionsDelayed = function(){

};
/* Pressing Enter in the subtopic field used to do nothing (it's a plain
   text input, not a form, so Enter just sat there) — jump straight to
   whichever body field is next (front for a basic card, the cloze textarea
   for a cloze card) so typing a subtopic then Enter then the card content
   flows as one uninterrupted sequence, same as Tab would but without
   requiring the person to know that. */
App.handleSubtopicFieldEnterKey = function(event){
  if(event.isComposing) return; // don't hijack an IME's own Enter (confirming composition)
  if(event.key !== 'Enter') return;
  event.preventDefault();
  App.hideSubtopicSuggestions();
  const typeEl = document.getElementById('cardType');
  const targetId = (typeEl && typeEl.value==='cloze') ? 'cardCloze' : 'cardFront';
  focusInput(targetId);
};
/* Places the caret at the very end of a contenteditable field's content —
   used when double-Enter jumps focus from front to back, so continuing to
   type (or reviewing existing text while editing a card) starts after
   whatever's already there instead of before it. */
function placeCaretAtEnd(el){
  el.focus();
  if(window.getSelection && document.createRange){
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}
/* Front/back (rich text) and the cloze body (textarea) are all multi-line
   fields — a single Enter has to keep inserting a normal newline, since a
   card's answer or a cloze passage can legitimately span multiple lines.
   But pressing Enter twice in a row (an empty line) is a handy shortcut so
   people don't have to reach for the mouse for every single card: on the
   FRONT field it jumps straight to the back field (front, Enter Enter,
   back — like filling out a paper flashcard front-then-back in one motion),
   and on the back field or the cloze body it submits (adds the card, or
   saves the edit if one is in progress). Only the SECOND consecutive Enter
   is special; any other keypress in between resets the count back to zero
   so this only fires for two Enters back to back with nothing else typed
   (including switching fields). Also removes the now-unwanted empty line
   the first Enter left behind in a rich-text field, so neither the saved
   card nor the field you just jumped away from ends with a stray blank
   line (the cloze textarea already gets .trim()'d when read, so no
   cleanup needed there). */
let cardFieldLastKeyWasEnter = {};
App.handleCardFieldEnterKey = function(event, fieldId){
  if(event.isComposing) return; // don't hijack an IME's own Enter (confirming composition)
  if(event.key !== 'Enter'){
    cardFieldLastKeyWasEnter[fieldId] = false;
    return;
  }
  if(!cardFieldLastKeyWasEnter[fieldId]){
    cardFieldLastKeyWasEnter[fieldId] = true;
    return; // first Enter — let it insert a normal newline
  }
  // second consecutive Enter — act instead of inserting another newline
  event.preventDefault();
  cardFieldLastKeyWasEnter[fieldId] = false;
  const el = document.getElementById(fieldId);
  if(el && el.isContentEditable){
    const last = el.lastChild;
    if(last){
      if(last.nodeName==='BR'){ el.removeChild(last); }
      else if(last.nodeName==='DIV' && richIsEmpty(last.innerHTML)){ el.removeChild(last); }
    }
  }
  if(fieldId==='cardFront'){
    const backEl = document.getElementById('cardBack');
    if(backEl) placeCaretAtEnd(backEl);
    return;
  }
  if(state.cardEditingId){ App.saveCardEdit(); } else { App.addCard(); }
};
App.addCard = function(){
  const subjectId = document.getElementById('cardSubject').value;
  const type = document.getElementById('cardType').value;
  if(!subjectId){ showAlert(t('cards.chooseSubjectFirst')); return; }
  const subtopicEl = document.getElementById('cardSubtopic');
  const subtopic = subtopicEl ? subtopicEl.value.trim() : '';
  let card = {id:uid(), subjectId, type, subtopic, interval:1, ease:2.5, reps:0, dueDate:todayISO()};
  if(type==='basic'){
    const frontEl = document.getElementById('cardFront');
    const backEl = document.getElementById('cardBack');
    const front = sanitizeRichHtml(frontEl.innerHTML);
    const back = sanitizeRichHtml(backEl.innerHTML);
    if(richIsEmpty(front)||richIsEmpty(back)) return;
    card.front = front; card.back = back;
  } else {
    const text = document.getElementById('cardCloze').value.trim();
    if(!text || !/\[\[.+?\]\]/.test(text)){ showAlert(t('cards.clozeRequired')); return; }
    card.clozeText = text;
  }
  state.cards.push(card);
  state.stats.cardsCreated++;
  state.lastCardSubjectId = subjectId;
  state.lastCardType = type;
  state.lastCardSubtopicBySubject[subjectId] = subtopic;
  awardXp(3);
  // The card just got saved, so the form SHOULD go blank now — without this,
  // captureUnsavedCardFormSnapshot() would re-capture the very text this
  // render is trying to clear, from the same DOM elements it's about to
  // replace, and the "empty" front/back fields would just come right back.
  unsavedCardFormSnapshot = null;
  skipCardFormCapture = true;
  saveState(); renderAll();
  skipCardFormCapture = false;
  focusInput(type==='cloze' ? 'cardCloze' : 'cardFront');
};
App.startEditCard = function(id){

  // was in the new-card form with that card's own data — see the note above
  // addCard() for why skipCardFormCapture is needed here too.
  unsavedCardFormSnapshot = null;
  skipCardFormCapture = true;
  renderAll();
  skipCardFormCapture = false;
  const c = state.cards.find(x=>x.id===id);
  focusInput(c && c.type==='cloze' ? 'cardCloze' : 'cardFront');

App.cancelCardEdit = function(){

  // of) as if it were unsaved new-card text and resurrect it as the new-card

App.saveCardEdit = function(){
  const id = state.cardEditingId;

  if(!c) return;
  const subjectId = document.getElementById('cardSubject').value;
  const type = document.getElementById('cardType').value;
  if(!subjectId){ showAlert(t('cards.chooseSubjectFirst')); return; }
  const subtopicEl = document.getElementById('cardSubtopic');
  const subtopic = subtopicEl ? subtopicEl.value.trim() : '';

    const frontEl = document.getElementById('cardFront');
    const backEl = document.getElementById('cardBack');
    const front = sanitizeRichHtml(frontEl.innerHTML);
    const back = sanitizeRichHtml(backEl.innerHTML);
    if(richIsEmpty(front)||richIsEmpty(back)) return;

App.rateCard = function(id, quality){
  const c = state.cards.find(x=>x.id===id);
  if(!c) return;
  if(quality===0){
    c.interval = 1;
    c.ease = Math.max(1.3, c.ease - 0.2);
  } else {
    if(c.reps===0){ c.interval = 1; }
    else { c.interval = Math.max(1, Math.round(c.interval * c.ease * (quality===2?1.3:1))); }
    if(quality===2) c.ease += 0.15;
  }
  c.reps += 1;
  c.dueDate = addDays(todayISO(), c.interval);
  const q = state.cardReview.queue;
  const idx = q.indexOf(id);
  if(idx>=0){
    q.splice(idx,1);
    if(state.cardReview.index>=q.length) state.cardReview.index = Math.max(0,q.length-1);
  }
  state.cardReview.flipped = false;
  state.reviewLog.push({date:todayISO()});
  if(state.reviewLog.length>500) state.reviewLog = state.reviewLog.slice(-500);
  awardXp(5);
  saveState(); renderAll();
};
document.addEventListener('keydown', function(e){
  if(!state || state.activeTab!=='cards') return;
  // Bug fix: this used to only skip INPUT/TEXTAREA/SELECT, but the card
  // add/edit form's front/back fields are rich-text areas — contenteditable
  // DIVs (see richFieldHtml), not any of those tags. Space or arrow keys
  // typed while writing a card front/back were getting swallowed here and
  // firing flip/prev/next (which calls renderAll(), wiping the not-yet-saved
  // text the person had just typed). Match the same typing-target check the
  // global space-toggle listener uses so contenteditable fields are covered.
  const target = e.target;
  const isTypingTarget = target && target.closest && target.closest('input, textarea, select, button, [contenteditable="true"]');
  if(isTypingTarget) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); App.cardReviewPrev(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); App.cardReviewNext(); }
  // Flipping used to be bound to Space, but the study timer's start/pause
  // shortcut is ALSO Space (see the separate global keydown listener above
  // that calls App.linkedToggle()) — since that listener isn't scoped to any
  // tab, every space press while reviewing cards both flipped the card AND
  // toggled the timer on/off. Moved the flip shortcut to Enter so checking
  // an answer no longer fights with the timer shortcut.
  else if(e.key==='Enter'){ e.preventDefault(); App.flipCard(); }
  else if(e.key==='Escape' && state.cardReview.fullscreen){ e.preventDefault(); App.closeCardMemorize(); }
});

    if(state.editingRewardId===r.id){
      return `
        <div class="edit-row">
          <div><label>${t('rewards.titlePh')}</label><input type="text" id="editRewardTitle_${r.id}" value="${escapeHtml(r.title)}" onkeypress="if(event.key==='Enter'){App.saveRewardEdit('${r.id}')}"></div>
          <div><label>${t('rewards.urlPh')}</label><input type="text" id="editRewardUrl_${r.id}" value="${escapeHtml(r.url||'')}" onkeypress="if(event.key==='Enter'){App.saveRewardEdit('${r.id}')}"></div>
          <div style="max-width:110px;"><label>${t('rewards.cyclesLabel')}</label><input type="number" id="editRewardCycles_${r.id}" value="${r.cyclesRequired}" min="1" max="20" onkeypress="if(event.key==='Enter'){App.saveRewardEdit('${r.id}')}"></div>
          <div style="max-width:110px;"><label>${t('rewards.restMinutesLabel')}</label><input type="number" id="editRewardRestMin_${r.id}" value="${r.restMinutes}" min="1" max="180" onkeypress="if(event.key==='Enter'){App.saveRewardEdit('${r.id}')}"></div>
          <button class="btn small" onclick="App.saveRewardEdit('${r.id}')">${t('subjects.save')}</button>
          <button class="btn ghost small" onclick="App.cancelEditReward()">${t('subjects.cancel')}</button>
        </div>
      `;
    }
    const claimed = isRewardClaimedToday(r.id);
    const unlocked = cycles >= r.cyclesRequired;
    let statusHtml;
    if(claimed){
      statusHtml = `<span class="pill" style="background:var(--surface-2);">${t('rewards.claimedLabel')}</span>`;
    } else if(unlocked){
      statusHtml = `<button class="btn teal small" onclick="App.claimReward('${r.id}')">${r.url ? t('rewards.watchBtn') : t('rewards.claimBtn')}</button>`;
    } else {
      const remaining = r.cyclesRequired - cycles;
      statusHtml = `<span class="muted mono" style="font-size:11.5px;">🔒 ${t('rewards.lockedHint').replace('{n}', remaining)}</span>`;
    }
    return `
      <div class="topic-row">
        <span class="topic-name">${escapeHtml(r.title)}</span>
        <span class="pill">🍅 ${r.cyclesRequired}</span>
        <span class="pill">⏱ ${r.restMinutes}${t('dash.minutesUnit')}</span>
        ${statusHtml}
        <button class="btn ghost small" onclick="App.startEditReward('${r.id}')">${t('subjects.edit')}</button>
        <button class="btn danger small" onclick="App.deleteReward('${r.id}')">${t('rewards.deleteLabel')}</button>
      </div>
    `;
  }).join('') || `<div class="empty">${t('rewards.noRewards')}</div>`;

  return `
    <div class="card">
      <h2 class="section-title">${t('rewards.title')}</h2>
      <div class="muted" style="font-size:12.5px;margin-bottom:14px;">${t('rewards.subtitle')}</div>
      <div style="display:flex;align-items:baseline;gap:10px;background:var(--surface-2);border-radius:8px;padding:12px 16px;margin-bottom:18px;">
        <div style="font-family:'Fraunces',serif;font-size:26px;font-weight:600;">🍅 ${cycles}</div>
        <div class="muted" style="font-size:12px;">${t('rewards.cyclesToday')}</div>
      </div>
      <div class="row" style="margin-bottom:16px;">
        <div><label>${t('rewards.titlePh')}</label><input type="text" id="rewardTitle" placeholder="${t('rewards.titlePh')}" onkeypress="if(event.key==='Enter'){App.addReward()}"></div>
        <div><label>${t('rewards.urlPh')}</label><input type="text" id="rewardUrl" placeholder="${t('rewards.urlPh')}" onkeypress="if(event.key==='Enter'){App.addReward()}"></div>
        <div style="max-width:110px;"><label>${t('rewards.cyclesLabel')}</label><input type="number" id="rewardCycles" value="2" min="1" max="20" onkeypress="if(event.key==='Enter'){App.addReward()}"></div>
        <div style="max-width:110px;"><label>${t('rewards.restMinutesLabel')}</label><input type="number" id="rewardRestMin" value="10" min="1" max="180" onkeypress="if(event.key==='Enter'){App.addReward()}"></div>
      </div>
      <div class="muted" style="font-size:11.5px;margin:-8px 0 12px;">${t('rewards.restMinutesHint')}</div>
      <button class="btn" onclick="App.addReward()">${t('rewards.addBtn')}</button>
      <hr class="divider">

  `;

App.addReward = function(){
  const titleEl = document.getElementById('rewardTitle');
  const urlEl = document.getElementById('rewardUrl');
  const cyclesEl = document.getElementById('rewardCycles');
  const restMinEl = document.getElementById('rewardRestMin');
  const title = titleEl.value.trim();
  const url = urlEl.value.trim();
  const cycles = Math.max(1, parseInt(cyclesEl.value)||1);
  const restMinutes = Math.max(1, parseInt(restMinEl.value)||10);
  if(!title && !url) return;
  state.rewards.push({id:uid(), title: title || url, url, cyclesRequired: cycles, restMinutes});
  titleEl.value=''; urlEl.value=''; cyclesEl.value='2'; restMinEl.value='10';
  saveState(); renderAll();
  focusInput('rewardTitle');
};
App.deleteReward = function(id){
  const target = state.rewards.find(r=>r.id===id);
  const doDelete = function(){
    state.rewards = state.rewards.filter(r=>r.id!==id);
    state.rewardClaims = state.rewardClaims.filter(c=>c.rewardId!==id);
    if(state.editingRewardId===id) state.editingRewardId = null;
    saveState(); renderAll();
  };
  if(target){
    showConfirm(tf('confirm.deleteReward', {name: target.title}), doDelete);
  } else {
    doDelete();
  }
};
