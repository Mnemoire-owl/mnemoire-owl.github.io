<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mnemoire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1428;
    --surface:#241C36;
    --surface-2:#2E2444;
    --ink:#EAE3F5;
    --ink-dim:#9C8FB8;
    --line:#3D3155;
    --amber:#A78BFA;
    --amber-rgb:167,139,250;
    --teal:#E3B23C;
    --berry:#E05C82;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* CLASSIC_THEME: when the person toggles off the wizard theme, this class
     on <body> reinstates the original cream/parchment palette by overriding
     the same custom properties the wizard theme sets on :root above. */
  body.classic-theme{
    --bg:#F5F1E7;
    --surface:#FCFAF4;
    --surface-2:#ECE4D2;
    --ink:#2C2720;
    --ink-dim:#7C7364;
    --line:#DFD5BE;
    --amber:#A17538;
    --amber-rgb:161,117,56;
    --teal:#5D7758;
    --berry:#8A4A46;
  }
  body.classic-theme .mascot-owl{display:none;}
  /* HOSPITAL_THEME: clinical white + mint/teal, calm and orderly. */
  body.hospital-theme{
    --bg:#F0F7F5;
    --surface:#FFFFFF;
    --surface-2:#E3F2EF;
    --ink:#1B3A3A;
    --ink-dim:#5C7D7D;
    --line:#CBE5E0;
    --amber:#0E8C7C;
    --amber-rgb:14,140,124;
    --teal:#2D6CDF;
    --berry:#D64550;
  }
  body.hospital-theme .mascot-owl{display:none;}
  /* LAW_THEME: legal-pad cream + navy/burgundy, formal and composed. */
  body.law-theme{
    --bg:#F4F1EC;
    --surface:#FFFFFF;
    --surface-2:#E8E3D8;
    --ink:#1E2A44;
    --ink-dim:#5C6478;
    --line:#D9D2C2;
    --amber:#1E3A5F;
    --amber-rgb:30,58,95;
    --teal:#7A1F2B;
    --berry:#B8452F;
  }
  body.law-theme .mascot-owl{display:none;}
  /* LAB_THEME: cool cyan-blue + amber-orange, precise and analytical. */
  body.lab-theme{
    --bg:#EEF3F5;
    --surface:#FFFFFF;
    --surface-2:#DCE8EC;
    --ink:#16232B;
    --ink-dim:#57707A;
    --line:#C7DBE0;
    --amber:#0E7490;
    --amber-rgb:14,116,144;
    --teal:#EA8600;
    --berry:#B91C1C;
  }
  body.lab-theme .mascot-owl{display:none;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:var(--bg);}
  a{color:inherit;}
  button, input, select, textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  header.top h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:32px;
    letter-spacing:-0.01em;
    margin:0;
  }
  header.top .tagline{font-size:13px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .header-io{display:flex;gap:6px;}
  .search-result-item{
    padding:9px 10px;margin-top:6px;border:1px solid var(--line);border-radius:8px;
    background:var(--surface-2);cursor:pointer;transition:border-color .15s;
  }
  .search-result-item:hover{border-color:var(--amber);}
  .mode-toggle{display:flex;gap:6px;}
  .mode-toggle .btn{flex:1;}
  .exam-timer{margin:10px 0 4px;}
  .exam-timer-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden;}
  .exam-timer-fill{height:100%;background:var(--teal);transition:width 1s linear;}
  .exam-timer.urgent .exam-timer-fill{background:var(--berry);}
  select#langSelect{
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:5px 8px;font-size:12px;
  }

  nav.tabs{
    display:flex;
    gap:2px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    display:flex;align-items:center;gap:7px;
    background:transparent;
    border:1px solid transparent;
    border-bottom:none;
    color:var(--ink-dim);
    padding:10px 14px;
    font-size:13.5px;
    font-weight:500;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
    top:1px;
    transition:color .15s ease;
  }
  nav.tabs button svg{width:15px;height:15px;flex:none;}
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{
    color:var(--ink);
    background:var(--surface);
    border-color:var(--line);
    border-bottom:1px solid var(--surface);
  }
  nav.tabs button.active::after{
    content:"";
    position:absolute;
    left:14px;right:14px;bottom:-1px;
    height:2px;
    background:var(--amber);
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 1px 2px rgba(43,39,31,.05), 0 8px 20px -14px rgba(43,39,31,.15);
  }
  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;} .soundscape-grid{grid-template-columns:repeat(3,1fr)!important;}}

  h2.section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 14px;
  }
  .muted{color:var(--ink-dim);font-size:13px;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px;font-weight:500;}
  input[type=text], input[type=number], select, textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:7px;
    padding:9px 10px;
    font-size:14px;
  }
  textarea{resize:vertical;min-height:60px;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .row > *{flex:1;min-width:120px;}

  .rich-field{width:100%;}
  .rich-colorbar{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
  .rich-swatch{
    width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.15);
    cursor:pointer;padding:0;flex:none;transition:transform .1s;
  }
  .rich-swatch:hover{transform:scale(1.15);}
  .rich-swatch-clear{
    background:var(--surface-2);color:var(--ink-dim);font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  }
  .rich-toolbar-sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px;}
  .rich-format-btn{
    min-width:24px;height:22px;border-radius:5px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);font-size:12px;line-height:1;
    cursor:pointer;padding:0 6px;flex:none;font-family:inherit;
  }
  .rich-format-btn:hover{border-color:var(--amber);}
  .rich-format-btn.bold{font-weight:700;}
  .rich-format-btn.italic{font-style:italic;}
  .rich-format-btn.underline{text-decoration:underline;}
  .rich-body{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:9px 10px;font-size:14px;line-height:1.55;
    outline:none;overflow-wrap:break-word;white-space:pre-wrap;
  }
  .rich-body ul{margin:4px 0 4px 20px;padding:0;}
  .rich-body:focus{border-color:var(--amber);}
  .rich-body:empty::before{content:attr(data-placeholder);color:var(--ink-dim);}
  .output-pane .rich-body{flex:1;min-height:220px;font-size:14px;line-height:1.6;}

  button.btn{
    background:var(--amber);
    color:var(--bg);
    border:none;
    padding:9px 16px;
    border-radius:7px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:transform .1s ease, filter .15s ease;
  }
  button.btn:hover{filter:brightness(1.08);}
  button.btn:active{transform:scale(.97);}
  button.btn.ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
  }
  button.btn.ghost:hover{border-color:var(--amber);}
  button.btn.danger{background:transparent;border:1px solid var(--berry);color:var(--berry);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  button.btn.teal{background:var(--teal);}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  .pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-family:'IBM Plex Mono',monospace;
    padding:2px 8px;border-radius:20px;
    border:1px solid var(--line);color:var(--ink-dim);
  }
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .dot.amber{background:var(--amber);}
  .dot.teal{background:var(--teal);}
  .dot.berry{background:var(--berry);}

  /* Free-color dots/swatches for per-subject calendar colors (an arbitrary
     hex, unlike .dot's fixed 3-class palette above). */
  .color-dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;margin-right:6px;vertical-align:middle;}
  .color-swatch{
    width:22px;height:22px;border-radius:50%;display:inline-block;cursor:pointer;
    border:2px solid transparent;margin:2px 5px 2px 0;box-sizing:border-box;
  }
  .color-swatch.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface);}
  .swatch-row{display:flex;flex-wrap:wrap;align-items:center;padding:2px 0;}

  /* ---- Recurring ("resident") plan weekday picker ---- */
  .weekday-picker{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px;}
  .weekday-chip{
    display:inline-flex;align-items:center;gap:4px;font-size:11.5px;
    padding:4px 8px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);cursor:pointer;user-select:none;
  }
  .weekday-chip:has(input:checked){border-color:var(--amber);color:var(--amber);}

  hr.divider{border:none;border-top:1px solid var(--line);margin:18px 0;}

  /* ---- Dashboard calendar ---- */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-weekday{text-align:center;font-size:10.5px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;padding-bottom:4px;}
  .cal-cell{
    position:relative;min-height:52px;border-radius:8px;border:1px solid transparent;
    padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
  }
  .cal-cell:hover{border-color:var(--line);}
  .cal-cell.out-month{opacity:.32;}
  .cal-cell.is-today .cal-daynum{color:var(--amber);font-weight:700;}
  .cal-cell.is-selected{background:var(--surface-2);border-color:var(--amber);}
  .cal-daynum{font-size:11.5px;font-family:'IBM Plex Mono',monospace;}
  .cal-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--surface-2);}
  .cal-bar span{display:block;height:100%;}
  .cal-total{font-size:8.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink-dim);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-event-dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--berry);}

  .subject-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;
    cursor:pointer;
  }
  .subject-row:hover{border-color:var(--amber);}
  .subject-row.selected{border-color:var(--amber);background:var(--surface-2);}
  .topic-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 4px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .topic-row:last-child{border-bottom:none;}
  .plan-item-row.plan-item-dragging{opacity:.4;}
  .plan-item-row.plan-item-dragover{background:var(--surface-2);outline:2px dashed var(--amber);outline-offset:-2px;}
  .plan-drag-handle:active{cursor:grabbing;}

  .cycle-topic{border-bottom:1px solid var(--line);}
  .cycle-topic:last-child{border-bottom:none;}
  .cycle-summary{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 4px;cursor:pointer;list-style:none;flex-wrap:wrap;
  }
  .cycle-summary::-webkit-details-marker{display:none;}
  .cycle-summary::marker{content:'';}
  .cycle-chevron{display:inline-block;color:var(--ink-dim);transition:transform .15s ease;font-size:10px;flex:none;}
  .cycle-topic[open] .cycle-chevron{transform:rotate(90deg);}
  .topic-name{font-size:14px;font-weight:500;flex:1;min-width:140px;}

  .punch{display:flex;gap:6px;}
  .punch-hole{
    width:22px;height:22px;border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--ink-dim);
    transition:background .12s ease, border-color .12s ease;
    flex:none;
  }
  .punch-hole:hover{border-color:var(--amber);}
  .punch-hole.done{background:var(--amber);border-color:var(--amber);color:var(--bg);font-weight:700;}

  .progress-track{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--teal);}

  .stat{padding:16px;}
  .stat .num{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;}
  .stat .label{font-size:12px;color:var(--ink-dim);margin-top:6px;}

  .flash{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:34px 22px;
    min-height:150px;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-size:17px;
    cursor:pointer;
    line-height:1.5;
  }
  .flash .blank{
    display:inline-block;border-bottom:2px solid var(--amber);
    width:70px;
  }
  .flash .cloze-answer{color:var(--amber);font-weight:600;}

  .draw-result{
    text-align:center;padding:40px 20px;
  }
  .draw-result .name{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:10px 0;}

  .output-split{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:720px){.output-split{grid-template-columns:1fr;}}
  .output-pane{display:flex;flex-direction:column;}
  .output-pane textarea{flex:1;min-height:220px;font-size:14px;line-height:1.6;}
  .reference-box{
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:14px;min-height:220px;font-size:14px;line-height:1.6;overflow-y:auto;
  }
  .gap-card{
    border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--surface-2);
  }

  .timer-display{
    font-family:'IBM Plex Mono',monospace;
    font-size:56px;font-weight:600;
    text-align:center;letter-spacing:0.02em;
    margin:10px 0 6px;
  }
  .timer-mode{text-align:center;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);}

  .timer-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .timer-widget{
    display:flex;align-items:center;gap:14px;flex:1;min-width:320px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;
  }
  .timer-widget.running{border-color:var(--amber);}
  .timer-widget.overtime{border-color:var(--amber);box-shadow:0 0 0 2px rgba(var(--amber-rgb),.18);animation:overtimePulse 2s ease-in-out infinite;}
  @keyframes overtimePulse{0%,100%{box-shadow:0 0 0 2px rgba(var(--amber-rgb),.12);}50%{box-shadow:0 0 0 4px rgba(var(--amber-rgb),.28);}}
  .tw-info{flex:1;min-width:120px;}
  .tw-divider{width:1px;align-self:stretch;background:var(--line);flex:none;}
  .tw-label{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;}
  .tw-time{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;line-height:1.3;}
  .tw-controls{display:flex;gap:5px;flex:none;align-items:center;margin-left:auto;flex-wrap:wrap;}
  button.btn.icon{padding:6px 9px;font-size:11px;line-height:1;}

  .soundscape-bar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;margin-bottom:20px;
  }
  .soundscape-bar .ss-label{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;flex:none;}
  .soundscape-bar button.btn{padding:5px 9px;font-size:14px;line-height:1;}
  .soundscape-bar input[type=range]{width:90px;flex:none;}

  .reward-timer-bar{
    display:none;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--teal);border-radius:10px;
    padding:10px 16px;margin-bottom:12px;
  }
  .reward-timer-bar.finished{border-color:var(--amber);}
  .rtb-info{flex:1;min-width:160px;}
  .rtb-label{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;}
  .rtb-title{font-size:12.5px;font-weight:600;margin-top:1px;}
  .rtb-time{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;line-height:1.3;}
  .rtb-controls{display:flex;gap:5px;flex:none;align-items:center;margin-left:auto;flex-wrap:wrap;}
  .edit-row{
    display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;
    padding:10px;border:1px solid var(--amber);border-radius:8px;margin-bottom:8px;background:var(--surface-2);
  }
  .edit-row > *{flex:1;min-width:100px;}

  .empty{
    text-align:center;padding:34px 20px;color:var(--ink-dim);font-size:13.5px;
  }

  /* ---- Gamification ---- */
  .game-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;}
  .level-chip{
    display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;flex:1;min-width:220px;
  }
  .level-badge{
    width:38px;height:38px;border-radius:50%;background:var(--amber);color:var(--bg);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:16px;flex:none;
  }
  .xp-track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:5px;}
  .xp-fill{height:100%;background:var(--amber);transition:width .3s ease;}
  .streak-chip{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;
  }
  .streak-num{font-family:'Fraunces',serif;font-size:20px;font-weight:700;}
  .badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .badge-chip{
    display:flex;align-items:center;gap:6px;font-size:11px;font-family:'IBM Plex Mono',monospace;
    padding:5px 10px;border-radius:20px;border:1px solid var(--amber);color:var(--amber);background:rgba(var(--amber-rgb),.10);
  }
  .badge-chip.locked{border-color:var(--line);color:var(--ink-dim);background:transparent;}

  .celebrate-overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:999;
  }
  .celebrate-toast{
    background:var(--surface);border:1px solid var(--amber);border-radius:12px;
    padding:20px 30px;text-align:center;box-shadow:0 10px 30px rgba(43,39,31,.18);
    animation:toastPop .35s ease;
  }
  .celebrate-toast .ct-title{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--amber);}
  .celebrate-toast .ct-sub{font-size:13px;color:var(--ink-dim);margin-top:4px;}
  @keyframes toastPop{
    0%{transform:scale(.7);opacity:0;}
    60%{transform:scale(1.05);opacity:1;}
    100%{transform:scale(1);}
  }
  .confetto{
    position:fixed;top:-20px;width:8px;height:14px;opacity:.9;
    animation-name:confettiFall;animation-timing-function:ease-in;animation-fill-mode:forwards;
    z-index:998;
  }
  @keyframes confettiFall{
    to{ transform:translateY(105vh) rotate(360deg); opacity:0; }
  }

  .confirm-overlay{
    position:fixed;inset:0;background:rgba(43,39,31,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;padding:20px;
  }
  .confirm-box{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:22px 24px;max-width:380px;width:100%;
    box-shadow:0 10px 30px rgba(43,39,31,.22);
    animation:toastPop .2s ease;
  }
  .confirm-box p{margin:0 0 18px;font-size:14px;line-height:1.6;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:8px;}

  /* ---- Fullscreen flashcard "카드 암기" (memorize) mode ----
     A fixed full-viewport overlay (covers the sidebar/header too, not just
     #panel) so the review card gets the whole screen instead of sharing
     half of it with the create-card form. margin:auto on the inner box
     inside a flex column centers short content vertically while still
     scrolling normally once it's taller than the viewport. */
  .memorize-overlay{
    position:fixed;inset:0;background:var(--bg);z-index:1200;
    display:flex;flex-direction:column;align-items:center;
    overflow-y:auto;padding:40px 20px;
  }
  .memorize-overlay-inner{width:100%;max-width:720px;margin:auto;}

  /* ---- Custom subtopic-suggestion dropdown (#cardSubtopic) ----
     A hand-rolled replacement for <input list="..."><datalist>: Safari
     doesn't reliably show datalist suggestions at all, so that native
     approach silently did nothing there. Positioned relative to the
     .field wrapper (see the inline position:relative on that div). */
  .subtopic-suggestions{
    position:absolute;top:100%;left:0;right:0;z-index:50;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    margin-top:4px;max-height:180px;overflow-y:auto;
    box-shadow:0 6px 18px rgba(43,39,31,.18);
  }
  .subtopic-suggestion-item{padding:8px 12px;font-size:13px;cursor:pointer;}
  .subtopic-suggestion-item:hover{background:var(--surface-2);}

  /* ---- Interactive tutorial overlay ----
     Deliberately non-blocking: the dim layer and highlight box are both
     pointer-events:none, so the real UI underneath stays fully clickable
     while the tour is up — the person can genuinely try each feature as
     the tooltip explains it, not just watch a spotlight move around. */
  .tutorial-dim{position:fixed;inset:0;z-index:9000;pointer-events:none;transition:background .2s;}
  .tutorial-dim.centered{background:rgba(30,26,20,.5);}
  .tutorial-highlight{
    position:fixed;z-index:9001;pointer-events:none;border-radius:10px;
    border:2px solid var(--amber);box-shadow:0 0 0 9999px rgba(30,26,20,.5);
    transition:top .25s ease,left .25s ease,width .25s ease,height .25s ease;
  }
  .tutorial-tooltip{
    position:fixed;z-index:9002;max-width:320px;width:calc(100% - 20px);
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 30px rgba(43,39,31,.28);padding:16px 18px;pointer-events:auto;
    animation:toastPop .18s ease;
  }
  .tutorial-tooltip .tt-title{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;margin-bottom:7px;}
  .tutorial-tooltip .tt-body{font-size:13px;line-height:1.55;margin-bottom:14px;color:var(--ink);}
  .tutorial-tooltip .tt-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .tutorial-tooltip .tt-counter{font-size:11px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
    .celebrate-toast{animation:none;}
    .confetto{display:none;}
  }

  /* ============ SIDENOTE (persistent side memo) ============ */
  .sidenote-panel{
    position:fixed;top:0;right:0;bottom:0;
    background:var(--surface);border-left:1px solid var(--line);
    display:flex;flex-direction:column;
    z-index:500;
    transition:width .18s ease;
    overflow:hidden;
  }
  .sidenote-panel.collapsed{width:0 !important;border-left:none;}
  .sidenote-resizer{
    position:absolute;left:0;top:0;bottom:0;width:7px;
    cursor:ew-resize;z-index:2;touch-action:none;
  }
  .sidenote-resizer:hover, .sidenote-resizer.dragging{background:rgba(var(--amber-rgb),.25);}
  .sidenote-header{display:flex;align-items:center;gap:6px;padding:12px 12px 8px;flex:none;}
  .sidenote-titlelabel{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--ink-dim);text-transform:uppercase;flex:1;white-space:nowrap;}
  .sidenote-saved{font-size:10.5px;color:var(--teal);opacity:0;transition:opacity .3s;white-space:nowrap;}
  .sidenote-collapsebtn{
    background:transparent;border:1px solid var(--line);border-radius:6px;
    width:24px;height:24px;flex:none;cursor:pointer;color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;padding:0;
  }
  .sidenote-collapsebtn:hover{border-color:var(--amber);color:var(--ink);}
  .sidenote-colorbar{display:flex;gap:7px;padding:0 12px 8px;flex:none;}
  .sidenote-swatch{
    width:17px;height:17px;border-radius:50%;border:1px solid var(--line);
    cursor:pointer;padding:0;flex:none;
  }
  .sidenote-swatch.active{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--amber);}
  .sidenote-body{
    flex:1;overflow-y:auto;margin:0 12px 12px;padding:10px 11px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    font-size:13px;line-height:1.65;outline:none;word-break:break-word;
  }
  .sidenote-body:empty::before{content:attr(data-placeholder);color:var(--ink-dim);}
  .sidenote-edgebtn{
    display:none;align-items:center;justify-content:center;
    position:fixed;right:0;top:50%;transform:translateY(-50%);
    background:var(--surface-2);border:1px solid var(--line);border-right:none;
    border-radius:8px 0 0 8px;width:22px;height:56px;cursor:pointer;
    color:var(--ink-dim);z-index:499;font-size:13px;padding:0;
  }
  .sidenote-edgebtn:hover{color:var(--ink);border-color:var(--amber);}
  .sidenote-edgebtn.show{display:flex;}

  .sidenote-panel.side-left{left:0;right:auto;border-left:none;border-right:1px solid var(--line);}
  .sidenote-panel.side-left .sidenote-resizer{left:auto;right:0;}
  .sidenote-edgebtn.side-left{left:0;right:auto;border-radius:0 8px 8px 0;border-left:none;border-right:1px solid var(--line);}

  @media (max-width:720px){
    .sidenote-panel{
      top:auto;left:0;right:0;bottom:0;width:auto !important;
      border-left:none;border-top:1px solid var(--line);
      border-radius:14px 14px 0 0;box-shadow:0 -6px 20px rgba(43,39,31,.15);
      transition:transform .2s ease;transform:translateY(0);
    }
    .sidenote-panel.collapsed{
      width:auto !important;border-left:none;border-top:1px solid var(--line);
      transform:translateY(100%);
    }
    .sidenote-resizer{
      left:0;right:0;top:0;bottom:auto;height:16px;width:auto;
      cursor:ns-resize;display:flex;align-items:center;justify-content:center;
    }
    .sidenote-resizer::before{content:'';width:34px;height:4px;border-radius:3px;background:var(--line);}
    .sidenote-header{padding-top:6px;}
    .sidenote-edgebtn{
      top:auto;bottom:0;left:50%;right:auto;transform:translateX(-50%);
      border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:none;border-right:1px solid var(--line);
      width:auto;height:30px;padding:0 16px;
    }
    .sidenote-panel.side-left{border-right:none;border-left:none;}
    .sidenote-edgebtn.side-left{left:16px;transform:none;}
  }
  /* ============ AUTH SCREEN (login/signup gate) ============ */
  /* Global safety net: `hidden` must always win over any `display`
     an author rule sets on the same element, or a class like
     `.auth-input{display:block}` silently un-hides a field the app
     just set `hidden` on (hit this bug twice already -- once with
     .auth-screen, once with .auth-input showing the signup-only
     "confirm password" field during sign-in). !important here is
     intentional and should not be removed. */
  [hidden]{display:none !important;}
  .auth-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
  .auth-box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px;text-align:center;}
  .auth-title{font-family:'Fraunces',serif;font-size:22px;margin:0 0 18px;color:var(--ink);}
  .auth-input{display:block;width:100%;margin:0 0 10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:'Work Sans',sans-serif;font-size:14px;}
  .auth-box .btn{width:100%;margin-top:4px;}
  .auth-linkbtn{display:block;width:100%;margin-top:14px;background:none;border:none;color:var(--amber);font-size:12.5px;cursor:pointer;text-decoration:underline;font-family:'Work Sans',sans-serif;}
  .auth-error{background:rgba(224,92,130,0.12);color:var(--berry);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:12px;}
  .auth-status{margin-top:10px;font-size:12px;color:var(--ink-dim);min-height:14px;}
  .auth-checkbox-row{display:flex;align-items:center;gap:6px;margin:2px 0 12px;font-size:12.5px;color:var(--ink-dim);cursor:pointer;text-align:left;}
  .auth-checkbox-row input{margin:0;}

<body>
<div id="authScreen" class="auth-screen" hidden>
  <div class="auth-box">
    <svg class="mascot-owl" width="34" height="34" viewBox="0 0 40 40" aria-hidden="true" style="margin:0 auto 6px;display:block;">
      <ellipse cx="20" cy="22" rx="14" ry="15" fill="var(--surface-2)" stroke="var(--amber)" stroke-width="1.6"/>
      <path d="M8 12 L14 18 L10 20 Z" fill="var(--amber)"/>
      <path d="M32 12 L26 18 L30 20 Z" fill="var(--amber)"/>
      <circle cx="14.5" cy="20" r="5.2" fill="var(--surface)" stroke="var(--teal)" stroke-width="1.4"/>
      <circle cx="25.5" cy="20" r="5.2" fill="var(--surface)" stroke="var(--teal)" stroke-width="1.4"/>
      <circle cx="14.5" cy="20" r="2" fill="var(--ink)"/>
      <circle cx="25.5" cy="20" r="2" fill="var(--ink)"/>
      <path d="M18.5 24 L20 27 L21.5 24 Z" fill="var(--amber)"/>
    </svg>
    <h1 class="auth-title">Mnemoire</h1>
    <div id="authError" class="auth-error" hidden></div>
    <input id="authEmail" class="auth-input" type="email" placeholder="이메일" autocomplete="email" onkeydown="if(event.key==='Enter'){App.authSubmit();}">
    <input id="authPassword" class="auth-input" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" onkeydown="if(event.key==='Enter'){App.authSubmit();}">
    <input id="authPasswordConfirm" class="auth-input" type="password" placeholder="비밀번호 확인" autocomplete="new-password" hidden onkeydown="if(event.key==='Enter'){App.authSubmit();}">
    <label class="auth-checkbox-row">
      <input type="checkbox" id="authShowPassword" onchange="App.authToggleShowPassword()">
      <span>비밀번호 표시</span>
    </label>
    <button class="btn" id="authSubmitBtn" onclick="App.authSubmit()">로그인</button>
    <button class="auth-linkbtn" id="authToggleBtn" onclick="App.authToggleMode()">계정이 없으신가요? 회원가입</button>
    <div id="authStatus" class="auth-status"></div>
  </div>
</div>
<div class="wrap" id="appWrap" hidden>
  <header class="top">
    <div style="display:flex;align-items:flex-start;gap:10px;">
      <svg class="mascot-owl" width="34" height="34" viewBox="0 0 40 40" aria-hidden="true" style="flex:none;margin-top:2px;">
        <ellipse cx="20" cy="22" rx="14" ry="15" fill="var(--surface-2)" stroke="var(--amber)" stroke-width="1.6"/>
        <path d="M8 12 L14 18 L10 20 Z" fill="var(--amber)"/>
        <path d="M32 12 L26 18 L30 20 Z" fill="var(--amber)"/>
        <circle cx="14.5" cy="20" r="5.2" fill="var(--surface)" stroke="var(--teal)" stroke-width="1.4"/>
        <circle cx="25.5" cy="20" r="5.2" fill="var(--surface)" stroke="var(--teal)" stroke-width="1.4"/>
        <circle cx="14.5" cy="20" r="2" fill="var(--ink)"/>
        <circle cx="25.5" cy="20" r="2" fill="var(--ink)"/>
        <path d="M18.5 24 L20 27 L21.5 24 Z" fill="var(--amber)"/>
        <path d="M12 30 Q20 35 28 30 Q20 33 12 30 Z" fill="var(--teal)" opacity="0.55"/>
      </svg>
      <div>
        <h1 id="appTitle">Mnemoire</h1>
        <div class="tagline" id="tagline"></div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn small" id="tutorialBtn" onclick="App.startTutorial()"></button>
      <select onchange="App.setTheme(this.value)" id="themeSelect"></select>
      <select id="langSelect" onchange="App.setLanguage(this.value)">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
      <div class="header-io" id="headerIo">
        <button class="btn ghost small" onclick="App.exportData()" id="exportBtn"></button>
        <button class="btn ghost small" onclick="document.getElementById('importFileInput').click()" id="importBtn"></button>
        <input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="App.handleImportFile(event)">
      </div>
      <div id="headerStatus" class="muted mono"></div>
      <button class="btn ghost small" id="logoutBtn" onclick="App.authLogout()">로그아웃</button>
    </div>
  </header>

  <div class="timer-bar" id="timerBar"></div>
  <div class="reward-timer-bar" id="rewardTimerBar"></div>
  <div class="soundscape-bar" id="soundscapeBar"></div>

  <nav class="tabs" id="tabs"></nav>
  <main id="panel"></main>
</div>
<div id="celebrateLayer"></div>
<div id="confirmModalRoot"></div>

<div class="sidenote-panel" id="sidenotePanel">
  <div class="sidenote-resizer" id="sidenoteResizer"></div>
  <div class="sidenote-header">
    <span class="sidenote-titlelabel" id="sidenoteTitleLabel"></span>
    <span class="sidenote-saved" id="sidenoteSaved"></span>
    <button class="sidenote-collapsebtn" id="sidenoteCollapseBtn" onclick="App.toggleSidenote()">✕</button>
  </div>
  <div class="sidenote-colorbar" id="sidenoteColorbar"></div>
  <div class="sidenote-body" id="sidenoteBody" contenteditable="true"></div>
</div>
<button class="sidenote-edgebtn" id="sidenoteEdgeBtn" onclick="App.toggleSidenote()">📝</button>

<div class="sidenote-panel side-left" id="sidenotePanelLeft">
  <div class="sidenote-resizer" id="sidenoteResizerLeft"></div>
  <div class="sidenote-header">
    <span class="sidenote-titlelabel" id="sidenoteTitleLabelLeft"></span>
    <span class="sidenote-saved" id="sidenoteSavedLeft"></span>
    <button class="sidenote-collapsebtn" id="sidenoteCollapseBtnLeft" onclick="App.toggleSidenote('left')">✕</button>
  </div>
  <div class="sidenote-colorbar" id="sidenoteColorbarLeft"></div>
  <div class="sidenote-body" id="sidenoteBodyLeft" contenteditable="true"></div>
</div>
<button class="sidenote-edgebtn side-left" id="sidenoteEdgeBtnLeft" onclick="App.toggleSidenote('left')">📝</button>

<script>
/* ============ I18N ============ */
const LANG = {

      drawHint:'무작위로 주제를 뽑아 스스로 테스트해요', outputHint:'백지에서 배운 내용을 직접 떠올려 써봐요', gapsHint:'놓치거나 틀린 부분을 따로 모아둬요',

    guide: {
      title:'사용법',
      intro:'Mnemoire는 어떤 과목이든 스스로 정리하고, 반복하고, 테스트하며 공부할 수 있게 도와주는 범용 학습 앱이에요. 아래에서 항목을 눌러 펼쳐보세요. 처음이시라면 위에서부터 순서대로 읽어보시는 걸 추천해요. 읽는 대신 직접 눌러보면서 배우고 싶다면, 화면 맨 위의 "🎓 튜토리얼" 버튼으로 실제 화면을 하나씩 짚어주는 안내를 시작할 수도 있어요.',
      sections:[
        {title:'0. 시작하기 전에 — 데이터 저장', body:'이 사이트에서 입력한 내용(과목, 노트, 카드, 진도 등)은 <strong>이 브라우저에 자동으로 저장</strong>돼요(localStorage 사용). 새로고침하거나 다시 들어와도 데이터가 그대로 남아있지만, <strong>다른 브라우저나 기기, 시크릿 모드에서는 보이지 않고</strong>, 브라우저 데이터를 지우면 함께 사라질 수 있어요. 걱정되면 헤더의 "내보내기" 버튼으로 언제든 백업을 받아둘 수 있어요 (12번 참고).'},
        {title:'1. 과목 관리 — 뼈대 만들기', body:'가장 먼저 할 일이에요. <br>① 과목 이름을 입력하고(예: 생리학, 토익, 자격증 시험) 회독 횟수를 정한 뒤 "+ 과목 추가"를 눌러요 (회독 횟수는 나중에 "회독 진행" 탭에서 몇 번 반복해서 읽을지를 정하는 숫자예요, 기본 4). 바로 아래 "복습 주기" 칸에서는 대시보드의 "오늘의 노트 복습" 알림이 며칠 뒤에 뜰지 과목별로 직접 정할 수 있어요(예: 0,3,7 — 비워두면 기본값인 1,4,7,14,28일).<br>② 과목을 클릭하면 오른쪽에 상세 화면이 떠요. 여기서 카테고리(색상 있는 분류표)를 추가할 수 있어요.<br>③ 주제 이름을 입력하고 카테고리를 지정한 뒤 "추가"를 누르면 그 과목의 주제 목록에 들어가요.<br>이 탭에서는 구조(이름, 분류)만 만들고, 실제 내용은 "노트" 탭에서 채워요.'},
        {title:'2. 노트 — 내용 정리하기', body:'① 과목과 주제를 드롭다운에서 선택해요.<br>② 처음 이 주제를 열었을 때 노트가 비어있으면 <strong>사전테스트</strong> 상자가 먼저 떠요 — 아직 배우기 전에 아는 대로 먼저 적어보는 칸인데, 틀려도 괜찮고 오히려 먼저 인출을 시도한 뒤 학습하면 나중에 더 오래 기억에 남는다는 연구(사전테스트 효과)에 기반한 기능이에요. 나중에 노트가 채워지면 이 사전테스트 답안은 "내가 처음 썼던 사전테스트 답안 보기"로 접어서 다시 볼 수 있어요.<br>③ "주제 메모" 칸에 자유롭게 정리해서 저장하세요. 칸 위의 색상 버튼(빨강·파랑·초록·보라·주황)으로 원하는 부분에 색을 입힐 수 있고, "A" 버튼으로 기본색으로 되돌릴 수 있어요 — 아웃풋 리콜, 오답노트, 암기카드(Basic)에서도 똑같이 쓸 수 있어요.<br>④ 노트 아래에 😰🤔😎 <strong>자신감</strong> 버튼으로 이 주제를 얼마나 잘 아는지 스스로 표시할 수 있어요 (이 값은 4번 랜덤 뽑기의 "약점 우선" 모드에서 활용돼요).<br>⑤ "소주제"를 추가해서 더 잘게 쪼갤 수 있어요. 소주제 안에 또 소주제를 넣는 것도 가능해서, 원하는 만큼 깊게 나눠서 정리할 수 있어요.<br>⑥ 다 쓰셨으면 맨 아래 <strong>"전체 저장"</strong> 버튼 하나로 주제 메모 + 모든 소주제 메모가 한 번에 저장돼요.<br>⑦ "카드로 만들기"를 누르면 그 내용 그대로 암기카드 초안이 만들어지고, "PDF로" 버튼으로 인쇄용 문서를 만들 수도 있어요.<br>⑧ 상단의 <strong>노트 검색창</strong>으로 모든 과목의 노트를 한 번에 검색할 수 있어요 — 결과를 누르면 바로 그 노트로 이동해요.<br>⑨ 검색창 바로 아래 "📚 과목 · 주제 관리"를 펼치면, 탭을 옮기지 않고도 이 자리에서 바로 새 과목·주제를 추가할 수 있어요 (과목 관리 탭과 완전히 같은 기능이에요 — 평소엔 접혀있다가 필요할 때만 펼쳐서 써요).'},
        {title:'3. 회독 진행 — 반복해서 읽기', body:'과목 관리에서 만든 주제들이 카테고리별로 나열돼요. 각 주제 옆에 회독 횟수만큼 원이 있는데, 한 번 읽고 나면 원을 눌러 통과 표시를 남기세요. 주제 이름을 누르면 펼쳐지면서 노트 탭에 적어둔 내용(소주제 포함)이 그대로 나와서, 읽으면서 바로 체크할 수 있어요. 주제 이름 옆에 ⏰가 보이면 복습이 시급하다는 뜻이에요 (13번 참고). 회독 체크는 <strong>주제 단위로만</strong> 되고, 소주제는 별도 체크가 없어요 (메모만 같이 보여요).'},
        {title:'4. 랜덤 뽑기 — 무작위로 테스트', body:'상단에서 <strong>균등 확률</strong>과 <strong>약점 우선</strong> 두 방식 중 고를 수 있어요. 균등 확률은 모든 주제가 똑같은 확률로 뽑히고, 약점 우선은 오답노트가 많거나, 회독이 덜 끝났거나, 복습이 시급하거나, 자신감이 낮게 표시된 주제일수록 더 자주 뽑혀요 — 시간이 지날수록 앱이 알아서 약한 부분을 더 노출시켜줘요. 과목과(선택적으로) 카테고리를 고르고 "주제 뽑기"를 누르면 그 안에서 하나가 나와요. "소주제도 포함해서 뽑기"를 켜면 소주제(중첩된 것까지)도 뽑기 대상이 돼요. 뽑힌 이름을 보고 스스로 떠올려본 다음 "확인하기"를 눌러 적어둔 메모가 맞는지 확인하세요.'},
        {title:'5. 아웃풋 — 백지 복습(액티브 리콜)', body:'상단에서 <strong>순서대로</strong>와 <strong>모의고사</strong> 두 모드 중 고를 수 있어요.<br><strong>순서대로</strong>: ① 과목 → 주제 → 연습 대상(주제 전체 또는 특정 소주제)을 선택해요.<br>② 왼쪽 빈 칸에 아는 대로 자유롭게 적어보세요 — 보지 않고 먼저 써보는 게 기억에 훨씬 오래 남아요.<br>③ 오른쪽 "정답 보기"를 누르면 그 주제에 적어둔 모든 노트가 나와요.<br>④ 놓치거나 헷갈린 부분을 아래 칸에 적은 뒤 "오답노트에 저장"을 누르고, "다음 문제로"로 계속 연습하세요.<br><strong>모의고사</strong>: 과목·카테고리·소주제 포함 여부·문항당 제한 시간(30/60/90/120초 또는 무제한)을 정하고 시작하면, 해당 범위의 주제·소주제가 한 번 무작위로 섞여서 순서대로 출제돼요. 문항마다 타이머 바가 줄어들고, 시간이 다 되면 자동으로 정답이 열려요. 오답노트 저장도 그대로 가능하고, 다 풀면 완료 화면에서 다시 시작하거나 설정으로 돌아갈 수 있어요. 탭을 벗어나면 타이머가 자동으로 멈췄다가 돌아오면 이어져요.'},
        {title:'6. 오답노트 — 약점만 따로 관리', body:'아웃풋(순서대로·모의고사 둘 다)에서 저장한 항목들이 여기 쌓여요. 과목별·해결상태별로 필터링해서 볼 수 있고, 다 이해했다 싶으면 "해결로 표시"를 눌러 목록에서 정리하세요 (완전히 사라지는 게 아니라 접힌 목록으로 옮겨가고, 필요하면 다시 되돌릴 수 있어요). "카드로 만들기"로 암기카드로 전환하거나, "PDF로 저장"으로 인쇄해서 볼 수도 있어요. 삭제 버튼을 누르면 확인 창이 한 번 더 떠서 실수로 지워지는 걸 막아줘요.'},
        {title:'7. 암기카드 — 간격반복 복습', body:'두 가지 형식이 있어요: <strong>Basic</strong>(앞면 질문 / 뒷면 답), <strong>Cloze</strong>(문장 중 가릴 부분을 [[ ]]로 감싸면 빈칸 문제가 돼요). 카드를 만들면 오늘부터 복습 대기열에 들어가고, 매일 이 탭을 열면 오늘 복습할 카드가 자동으로 떠요. 카드를 눌러 답을 확인한 뒤 "다시/좋음/쉬움"으로 평가하면, 평가에 따라 다음 복습일이 자동으로 계산돼요. 이 복습 기록은 대시보드의 <strong>예상 기억 유지율</strong>(9번) 계산에도 그대로 쓰여요.'},
        {title:'8. 집중 세션 — 뽀모도로 + 실제 공부시간', body:'화면 상단에 항상 떠있는 타이머 바에서 <strong>시작 버튼 하나로 뽀모도로(집중/휴식 반복 타이머)와 실제 공부시간 스톱워치가 동시에 시작</strong>돼요. 설정한 집중 시간이 다 되면 알람이 울리지만 자동으로 휴식으로 넘어가지 않고, 타이머는 <strong>초과 집중</strong> 상태로 계속 흘러요 — 이 시간도 전부 실제 공부시간으로 기록돼요. 직접 <strong>"휴식 시작"</strong> 버튼을 누르면 그때 설정한 휴식 시간이 시작되고, 휴식이 끝나면 다시 자동으로 다음 집중 구간으로 돌아가요. 일시정지·초기화도 하나의 버튼으로 둘 다 같이 조작돼요. "집중 세션" 탭에서는 집중/휴식 분 설정, 오늘·최근 7일 통계, 그리고 스톱워치로 실제 집중했던 시간 데이터를 바탕으로 한 <strong>맞춤 뽀모도로 시간 추천</strong>을 볼 수 있어요 (스톱워치를 3번 이상 써야 추천이 나와요). 날짜가 바뀌는 순간 실제 공부시간 스톱워치는 자동으로 0으로 초기화되고, 그 시점까지 쌓인 시간은 어제 날짜로 정확히 기록돼요. 만약 그 순간 타이머를 사용 중이었다면 초기화 알림 창이 뜨고, <strong>뽀모도로는 멈추지 않고 그대로 이어서</strong> 진행돼요.'},
        {title:'9. 대시보드 — 한눈에 보기', body:'맨 위엔 레벨·XP·연속학습일수가 있어요 (RPG 스타일로 레벨이 오를수록 필요 경험치가 늘어나고, 최대 300레벨이에요). "🧠 예상 기억 유지율" 카드는 에빙하우스 망각곡선과 카드별 간격반복 기록을 바탕으로 지금 얼마나 기억하고 있을지 추정해서 보여주고, 유지율이 낮은 카드부터 순서대로 정리해줘요. "오늘의 노트 복습"은 주제를 만든 날로부터 정해진 날짜(기본 1·4·7·14·28일 뒤, 과목 관리에서 과목별로 직접 바꿀 수 있어요) 뒤 자동으로 복습을 알려주는 알림이고, "오늘의 퀘스트"는 매일 똑같은 3가지를 다 채우면 보너스를 주는 코너예요. "다음 보상까지" 위젯은 11번 보상 기능과 연결돼요. 노트 저장, 회독 통과, 카드 복습, 뽑기, 아웃풋 연습, 오답 해결 등 거의 모든 활동에 경험치가 붙어요.'},
        {title:'10. 언어 바꾸기', body:'화면 오른쪽 위 드롭다운에서 한국어/English/Deutsch 중 골라 앱 전체(탭 이름, 버튼, 안내 문구)의 언어를 바로 바꿀 수 있어요. 직접 입력한 과목명·노트·카드 내용은 번역되지 않고 입력하신 그대로 남아요.'},
        {title:'11. 보상 — 공부하며 조금씩 즐기기', body:'공부를 시작하기 전에 보고 싶은 유튜브 영상이나 원하는 보상(간식, 게임 한 판 등)을 미리 등록해두세요. 각 보상마다 "몇 뽀모도로 사이클을 채워야 열리는지"를 직접 정할 수 있어요 (예: 2사이클 후 열림). 뽀모도로 집중 구간을 하나 마칠 때마다 오늘의 사이클 수가 올라가고, 조건을 채운 보상은 자동으로 잠금이 풀려서 알림이 떠요. 사이클 수는 매일 자정에 초기화되지만, 등록해둔 보상 목록 자체는 계속 남아있어요.'},
        {title:'12. 백업 — 내보내기 / 가져오기', body:'화면 상단 헤더에 "내보내기" / "가져오기" 버튼이 있어요. <strong>내보내기</strong>를 누르면 지금까지의 모든 데이터(과목·노트·카드·오답노트·레벨 등)를 JSON 파일로 다운로드할 수 있어요. <strong>가져오기</strong>로 그 파일을 다시 불러오면 지금 저장된 데이터를 그 파일 내용으로 통째로 교체해요 (되돌릴 수 없으니 확인 메시지가 한 번 더 떠요). 정기적으로 내보내기 해두면 실수로 데이터를 잃어버릴 걱정이 줄어들어요.'},
        {title:'13. 신뢰도 · 복습 시급도 · 복습 모드', body:'노트 탭에서 표시한 자신감(😰🤔😎)과 별개로, 앱이 자동으로 "복습이 얼마나 급한지"도 추적해요 — 노트를 저장하거나, 랜덤 뽑기·아웃풋에서 정답을 확인할 때마다 "마지막으로 복습한 날"이 갱신되고, 회독을 많이 마칠수록 다음 복습까지 여유 기간이 늘어나요(3→7→14→30일). 이 기간이 지나면 회독 진행 탭에 ⏰ 표시가 뜨고, 계획 탭의 "오늘 복습할 것"에 개수로 집계돼요. "지금 복습하기" 버튼을 누르면 복습이 시급한 주제들을 순서대로 하나씩 보여주는 <strong>복습 모드</strong>가 시작돼요 — 노트 탭 상단에 진행 상황(예: 1/3)이 뜨고, "다음 복습 주제로" 버튼으로 이어서 진행하거나 "복습 종료"로 언제든 빠져나올 수 있어요.'},
        {title:'14. 장기 목표 — 오래 걸리는 목표 정하기', body:'계획 탭 위쪽에서 장기 목표를 하나 만들 수 있어요. 목표 이름과 "이 날짜까지 이루겠다"는 목표 날짜를 함께 정하면, 그 날짜가 되기 전까지는 내용을 바꿀 수 없어요 (오타를 냈거나 마음이 바뀌었다면 "포기"로 지우고 새로 만들 수는 있어요). 목표한 날짜가 되면 "달성했어요" / "아직 못 했어요" 버튼이 나타나서 스스로 체크할 수 있고, 달성으로 표시하면 보너스 경험치와 함께 지금 켜둔 테마에 어울리는 아이콘(🔮/🏅/🎗️/⚖️/🧪)이 붙은 성취 표시가 남아요.'},
        {title:'15. 달력 — 공부 기록과 일정 한눈에 보기', body:'대시보드에 달력이 추가됐어요. 각 날짜 칸에는 그날 스톱워치로 집중한 시간이 과목별 색깔 막대로 표시돼서, 하루에 어떤 과목을 얼마나 공부했는지 비율로 한눈에 볼 수 있어요 (과목 색상은 "과목 관리"에서 과목을 추가·수정할 때 원하는 색으로 바꿀 수 있어요). 날짜를 클릭하면 그날의 과목별 공부 시간과 등록된 일정이 아래에 자세히 나와요. 시험이나 약속처럼 날짜(선택적으로 시간까지)가 정해진 일정을 등록해두면, 달력 위 "다가오는 일정" 카드에 D-day로 표시돼요 — 시간을 함께 등록했다면 하루 앞으로 다가왔을 때부터는 "n시간 m분 남음"처럼 시간 단위로 바뀌어서 보여줘요.'},
        {title:'16. 상주 계획 — 매일 반복하는 계획 만들기', body:'계획 탭의 "오늘의 계획" 아래에 "상주 계획" 카드가 있어요. 여기 등록한 항목은 그날 완료 체크를 해도 사라지지 않고, 다음에 해당 요일이 돌아오면 다시 미완료 상태로 나타나요 (완료 기록은 날짜별로 따로 저장돼요). 등록할 때 월화수목금토일 중 반복할 요일을 골라두면, 그 요일에만 계획 목록에 보여요 — 예를 들어 월화수목금만 체크해두면 평일에만 보이고 토·일에는 안 보여요. 요일을 하나도 안 고르면 매일 보이는 걸로 처리돼요. 오늘 해당하지 않는 상주 계획도 "전체 상주 계획 관리"를 펼치면 계속 볼 수 있어서, 언제든 요일을 바꾸거나 삭제할 수 있어요.'}
      ]
    },

    guide: {
      title:'Guide',
      intro:'Mnemoire is a subject-agnostic study app that helps you organize, repeat, and test yourself on anything. Tap a section below to expand it. If this is your first time, read from the top down. Prefer to learn by doing instead of reading? The "🎓 Tutorial" button at the top of the screen walks you through the real UI step by step.',
      sections:[
        {title:'0. Before you start — data storage', body:'Everything you enter (subjects, notes, cards, progress) <strong>saves automatically in this browser</strong> (using localStorage). It persists across reloads and future visits, but <strong>it is not visible in a different browser, device, or private/incognito window</strong>, and it can be lost if you clear this browser\'s data. If that worries you, you can always grab a backup with the "Export" button in the header (see #12).'},
        {title:'1. Subjects — build the structure', body:'Start here. <br>① Enter a subject name (e.g. Physiology, an exam) and set how many reading passes you want, then hit "+ Add subject" (this pass count controls the Reading Cycle tab). Right below that, the "Review schedule" field lets you set, per subject, how many days after creation the dashboard\'s "Today\'s note reviews" reminders fire (e.g. 0,3,7 — leave blank for the default 1,4,7,14,28).<br>② Click a subject to open its detail panel, where you can add color-coded categories.<br>③ Type a topic name, pick a category, and add it to that subject topic list.<br>This tab is just for structure — the actual content goes in the Notes tab.'},
        {title:'2. Notes — write the content', body:'① Pick a subject and topic from the dropdowns.<br>② The first time you open a topic with empty notes, a <strong>pretest</strong> box appears — write what you already know before you learn it. It is fine to get it wrong; attempting recall before studying leads to better long-term retention. Once notes are filled in, it collapses into a "View my original pretest answer" toggle.<br>③ Write freely in the topic notes box and save. The color buttons above the box (red, blue, green, purple, orange) let you highlight any part of the text, and the "A" button resets it to the default color — the same palette works in output recall, the gap notebook, and Basic flashcards.<br>④ Below the notes, use the 😰🤔😎 <strong>confidence</strong> buttons to mark how well you know this topic (used by the "Weak spots first" draw mode in #4).<br>⑤ Add "subtopics" to break things down further — nested as deep as you like.<br>⑥ One <strong>"Save all"</strong> button at the bottom saves the topic notes and every subtopic at once.<br>⑦ "Make a card" turns that content into a flashcard draft, and "Export as PDF" produces a print-ready document.<br>⑧ The <strong>search box</strong> at the top searches every subject\'s notes at once — click a result to jump straight to it.<br>⑨ Right below the search box, expand "📚 Subjects & topics" to add a new subject or topic right here without switching tabs (it\'s the exact same Subject Management UI — collapsed by default, expand it only when you need it).'},
        {title:'3. Reading Cycle — repeat readings', body:'Your topics appear grouped by category, each with a row of circles matching its pass count. Tap a circle after each read-through to mark it done. Tap the topic name to expand it and read the same content from Notes right there. A ⏰ next to a topic name means it is overdue for review (see #13). Pass tracking is <strong>topic-level only</strong> — subtopics show their notes but have no separate checkmarks.'},
        {title:'4. Random Draw — quiz yourself at random', body:'Choose between <strong>Equal probability</strong> and <strong>Weak spots first</strong> at the top. Equal probability draws every topic with the same odds; Weak spots first weights topics with more gap-notebook entries, unfinished passes, overdue review, or low confidence — so the app naturally surfaces what needs attention most. Pick a subject and (optionally) a category, then hit "Draw a topic." Turn on "Include subtopics" to pull from subtopics too. Try to recall it, then hit "Reveal" to check your notes.'},
        {title:'5. Output — active recall practice', body:'Choose between <strong>Sequential</strong> and <strong>Mock exam</strong> at the top.<br><strong>Sequential</strong>: ① Choose subject → topic → practice target.<br>② Write what you remember on the left — recalling before checking builds much stronger memory.<br>③ Hit "Reveal reference" to compare.<br>④ Note anything you missed below and save it to the gap notebook, then "Next item" to keep going.<br><strong>Mock exam</strong>: pick a subject, category, whether to include subtopics, and a per-question time limit (30/60/90/120s or none), then start — the matching topics/subtopics are shuffled once and presented in order. A timer bar counts down each question and auto-reveals the answer when time runs out. You can still save gaps, and a finish screen lets you restart or go back to setup. The timer pauses automatically if you switch tabs and resumes when you come back.'},
        {title:'6. Gap Notebook — track your weak spots', body:'Everything you save from Output (both modes) lands here. Filter by subject and status, and once something is mastered, click "Mark resolved" to move it out of the active list (it collapses into a section that can be reopened or undone). Entries can also become flashcards or be exported as a PDF. Deleting asks for confirmation first, so nothing gets removed by accident.'},
        {title:'7. Flashcards — spaced repetition', body:'Two formats: <strong>Basic</strong> (front question / back answer) and <strong>Cloze</strong> (wrap the hidden part of a sentence in [[ ]] to make a fill-in-the-blank). New cards enter the review queue starting today, and this tab automatically shows whatever is due each day. Flip a card, check the answer, then rate it Again/Good/Easy — the next review date is calculated automatically. This review history also feeds the Dashboard\'s <strong>predicted retention</strong> section (#9).'},
        {title:'8. Focus — pomodoro + real study-time stopwatch', body:'The timer bar pinned to the top has <strong>one start button that runs both a pomodoro cycle and a real study-time stopwatch together</strong>. When your set focus length is up, an alarm chime plays but the timer keeps running in <strong>overtime</strong> — every extra second still counts as real study time — until you press <strong>"Start break"</strong> yourself. Once you do, the break runs for the set length and then automatically returns to a fresh focus interval. Pause and reset control both timers at once. The Focus tab itself has work/break length settings, daily and weekly stats, and a <strong>personalized pomodoro recommendation</strong> based on actual logged stopwatch sessions (needs at least 3 sessions first). The real study-time stopwatch automatically resets to 0 the moment the calendar date changes, and the time accumulated up to that point is correctly logged under the previous day. If a timer was actively running at that moment, a popup lets you know it just reset, and the <strong>pomodoro keeps running without interruption</strong> — only the stopwatch resets.'},
        {title:'9. Dashboard — everything at a glance', body:'At the top sit level, XP, and study streak — leveling follows an RPG-style curve where each level needs more XP than the last, up to a maximum of level 300. The "🧠 Predicted retention" card uses the Ebbinghaus forgetting curve together with each card\'s spaced-repetition history to estimate how much you currently remember, listing the lowest-scoring cards first. "Today\'s note reviews" reminds you on a schedule of days-after-creation (1, 4, 7, 14, and 28 by default — customizable per subject in Subject Management). "Today\'s Quests" gives a bonus once three daily targets are hit. The "Next reward" widget connects to #11. Nearly every activity earns XP.'},
        {title:'10. Switching languages', body:'Use the dropdown in the top-right to switch the whole app — tab names, buttons, and instructions — between Korean, English, and German instantly. Anything typed in manually (subject names, notes, card content) stays exactly as written, in whichever language it was entered.'},
        {title:'11. Rewards — small wins along the way', body:'Before you start studying, register anything you want as a reward — a YouTube video, a snack, a short game break, whatever motivates you — and pick how many pomodoro cycles it should take to unlock (e.g. unlocked after 2 cycles). Every time you finish a pomodoro focus interval, today\'s cycle count goes up, and any reward whose requirement is met unlocks automatically with a notification. The cycle count resets each night, but your saved reward list stays.'},
        {title:'12. Backup — export / import', body:'The header has "Export" and "Import" buttons. <strong>Export</strong> downloads everything (subjects, notes, cards, gaps, level, etc.) as a JSON file. <strong>Import</strong> lets you load that file back in, replacing all currently saved data (a confirmation dialog appears first since this can\'t be undone). Exporting regularly is a good habit — it protects you from accidentally losing data.'},
        {title:'13. Confidence · review urgency · review mode', body:'Separately from the confidence rating you set in Notes, the app automatically tracks how overdue each topic is for review — saving notes, or revealing an answer in Random Draw or Output, all refresh its "last reviewed" date, and the gap before the next check-in grows as you complete more reading passes (3→7→14→30 days). Once that window passes, a ⏰ appears in Reading Cycle and the topic is counted in the Plan tab\'s "What to review today." Clicking "Review now" starts a <strong>review mode</strong> that walks you through overdue topics one at a time — the Notes tab shows your progress (e.g. 1/3), with "Next review topic" to continue or "End review" to stop anytime.'},
        {title:'14. Long-term Goals — Setting a goal for the long haul', body:'At the top of the Plan tab you can set a long-term goal: a title plus the date by which you\'ll achieve it. Once set, neither can be changed until that date arrives (if you made a mistake or changed your mind, "Give up" removes it so you can start over). On or after the target date, "Achieved it" / "Not yet" buttons appear so you can check it off yourself — marking it achieved grants bonus XP and leaves behind an achievement mark with an icon matching your current theme (🔮/🏅/🎗️/⚖️/🧪).'},
        {title:'15. Calendar — study log and events at a glance', body:'The Dashboard now includes a calendar. Each day\'s cell shows a color bar for the stopwatch focus time logged that day, split by subject, so you can see at a glance which subjects you studied and in what proportion (pick each subject\'s color when adding or editing it in Subject Management). Click a date to see that day\'s subject breakdown and any events recorded, in detail, below. Record events like exams or appointments with a date (and optionally a time), and they\'ll show as a D-day countdown in the "Upcoming events" card above the calendar — once one is within a day and has a time set, the countdown switches to showing "Nh Nm left" instead.'},
        {title:'16. Recurring Plans — set up plans that repeat every day', body:'Below "Today\'s plan" in the Plan tab is a "Recurring plans" card. Anything you add there doesn\'t disappear when you check it off that day — it comes back unchecked the next time its scheduled weekday rolls around (each day\'s completion is tracked separately). When adding one, pick which days of the week it repeats on; it only shows in the plan list on those days — for example, checking only Mon-Fri means it appears on weekdays and stays hidden on Sat/Sun. Leaving every day unchecked means it shows every day. Recurring plans not scheduled for today still stay reachable by expanding "Manage all recurring plans," so you can change their days or delete them anytime.'}
      ]
    },

    guide: {
      title:'Anleitung',
      intro:'Mnemoire ist eine fachunabhängige Lern-App, mit der du alles ordnen, wiederholen und dich selbst abfragen kannst. Tippe unten auf einen Abschnitt, um ihn aufzuklappen. Beim ersten Mal am besten von oben nach unten lesen. Lieber ausprobieren statt lesen? Der Button „🎓 Tutorial" oben führt dich Schritt für Schritt durch die echte Oberfläche.',
      sections:[
        {title:'0. Bevor es losgeht — Datenspeicherung', body:'Alles, was du eingibst (Fächer, Notizen, Karten, Fortschritt), wird <strong>automatisch in diesem Browser gespeichert</strong> (mittels localStorage). Die Daten bleiben auch nach dem Neuladen und bei künftigen Besuchen erhalten, sind aber <strong>in einem anderen Browser, Gerät oder privaten Fenster nicht sichtbar</strong> und können verloren gehen, wenn du die Browserdaten löschst. Hol dir bei Bedarf jederzeit ein Backup über den "Exportieren"-Button im Header (siehe #12).'},
        {title:'1. Fächer — die Struktur aufbauen', body:'Hier fängst du an. <br>① Gib einen Fachnamen ein (z. B. Physiologie, eine Prüfung) und lege fest, wie viele Lesedurchgänge du machen willst, dann auf "+ Fach hinzufügen" klicken (diese Zahl steuert den Tab Lesezyklus). Direkt darunter legst du im Feld "Wiederholungsplan" pro Fach fest, nach wie vielen Tagen die "Heutige Notiz-Wiederholungen"-Erinnerung im Dashboard ausgelöst wird (z. B. 0,3,7 — leer lassen für den Standard 1,4,7,14,28).<br>② Klicke auf ein Fach, um rechts das Detailfenster zu öffnen — dort können farbige Kategorien angelegt werden.<br>③ Gib einen Themennamen ein, wähle eine Kategorie und füge ihn zur Themenliste des Fachs hinzu.<br>Dieser Tab ist nur für die Struktur da — die eigentlichen Inhalte kommen in den Tab Notizen.'},
        {title:'2. Notizen — Inhalte schreiben', body:'① Fach und Thema in den Dropdowns auswählen.<br>② Beim ersten Öffnen eines Themas mit leeren Notizen erscheint ein <strong>Vortest</strong>-Feld — schreibe auf, was du schon weißt, bevor du lernst. Fehler sind völlig in Ordnung; ein Abrufversuch vor dem Lernen verbessert die langfristige Merkfähigkeit. Sobald die Notizen gefüllt sind, klappt es in „Meine ursprüngliche Vortest-Antwort ansehen" ein.<br>③ Frei im Notizfeld des Themas schreiben und speichern. Mit den Farbknöpfen über dem Feld (Rot, Blau, Grün, Lila, Orange) kannst du beliebige Textstellen farbig hervorheben, der Knopf „A" setzt die Standardfarbe zurück — dieselbe Palette gibt es auch beim Abruf, in den Fehlernotizen und bei Basic-Karteikarten.<br>④ Unter den Notizen kannst du mit den 😰🤔😎 <strong>Sicherheits</strong>-Buttons markieren, wie gut du dieses Thema kennst (wird im Modus „Schwachstellen zuerst" bei #4 genutzt).<br>⑤ Mit "Unterthemen" weiter aufgliedern — beliebig tief verschachtelt.<br>⑥ Ein einziger Button <strong>"Alles speichern"</strong> speichert die Themen-Notiz und alle Unterthemen auf einmal.<br>⑦ "Karte erstellen" macht daraus einen Karteikarten-Entwurf, "Als PDF" erzeugt ein druckfertiges Dokument.<br>⑧ Das <strong>Suchfeld</strong> oben durchsucht die Notizen aller Fächer auf einmal — ein Treffer bringt dich direkt dorthin.<br>⑨ Direkt unter dem Suchfeld kannst du "📚 Fächer & Themen" aufklappen, um hier direkt ein neues Fach oder Thema hinzuzufügen, ohne den Tab zu wechseln (genau dieselbe Fächerverwaltung — standardmäßig eingeklappt, nur bei Bedarf öffnen).'},
        {title:'3. Lesezyklus — wiederholtes Lesen', body:'Die Themen erscheinen nach Kategorie gruppiert, jeweils mit so vielen Kreisen wie Durchgängen. Nach jedem Lesedurchgang einen Kreis antippen, um ihn abzuhaken. Der Themenname lässt sich aufklappen und zeigt dabei den gleichen Inhalt wie im Tab Notizen. Ein ⏰ neben dem Themennamen bedeutet, dass eine Wiederholung überfällig ist (siehe #13). Die Durchgangs-Markierung gilt <strong>nur auf Themenebene</strong>.'},
        {title:'4. Zufallsauswahl — sich selbst zufällig abfragen', body:'Oben zwischen <strong>Gleiche Wahrscheinlichkeit</strong> und <strong>Schwachstellen zuerst</strong> wählen. Bei Gleicher Wahrscheinlichkeit hat jedes Thema die gleiche Chance; bei Schwachstellen zuerst kommen Themen mit mehr Fehlernotizen, unvollständigen Durchgängen, überfälliger Wiederholung oder geringer Sicherheit häufiger dran. Fach und optional eine Kategorie wählen, dann auf "Thema ziehen" klicken. Mit "Unterthemen einbeziehen" werden auch Unterthemen mit einbezogen. Erst versuchen, sich zu erinnern, dann mit "Aufdecken" die Notiz prüfen.'},
        {title:'5. Abruf — freies Wiedergeben (Active Recall)', body:'Oben zwischen <strong>Der Reihe nach</strong> und <strong>Prüfungssimulation</strong> wählen.<br><strong>Der Reihe nach</strong>: ① Fach → Thema → Übungsziel wählen.<br>② Links frei aufschreiben, was noch bekannt ist.<br>③ Mit "Referenz aufdecken" vergleichen.<br>④ Was fehlte, unten eintragen und in den Fehlernotizen speichern, dann mit "Nächstes Thema" weiter.<br><strong>Prüfungssimulation</strong>: Fach, Kategorie, ob Unterthemen einbezogen werden, und ein Zeitlimit pro Frage (30/60/90/120 Sek. oder kein Limit) wählen und starten — die passenden Themen/Unterthemen werden einmal gemischt und der Reihe nach abgefragt. Ein Zeitbalken läuft pro Frage herunter und deckt die Antwort bei Zeitablauf automatisch auf. Fehlernotizen lassen sich weiterhin speichern, am Ende gibt es einen Abschlussbildschirm zum Neustarten oder Zurückgehen. Beim Tab-Wechsel pausiert der Timer automatisch.'},
        {title:'6. Fehlernotizen — Wissenslücken im Blick behalten', body:'Alles, was im Abruf-Tab (beide Modi) gespeichert wird, landet hier. Nach Fach und Status filterbar, und sobald etwas sicher sitzt, mit "Als gelöst markieren" aus der aktiven Liste nehmen (wandert in einen einklappbaren Bereich, der jederzeit wieder geöffnet werden kann). Einträge lassen sich auch in Karteikarten umwandeln oder als PDF exportieren. Beim Löschen wird vorher nachgefragt.'},
        {title:'7. Karteikarten — Spaced Repetition', body:'Zwei Formate: <strong>Basic</strong> (Vorderseite Frage / Rückseite Antwort) und <strong>Lückentext</strong> (den zu versteckenden Teil eines Satzes in [[ ]] einschließen). Neue Karten kommen ab sofort in die Wiederholungs-Warteschlange, dieser Tab zeigt jeden Tag automatisch, was fällig ist. Karte umdrehen, Antwort prüfen, dann mit Nochmal/Gut/Leicht bewerten. Dieser Verlauf fließt auch in die <strong>voraussichtliche Merkfähigkeit</strong> der Übersicht (#9) ein.'},
        {title:'8. Fokuszeit — Pomodoro + echte Lernzeit-Stoppuhr', body:'Die oben angeheftete Timer-Leiste hat <strong>einen einzigen Start-Button, der Pomodoro-Zyklus und echte Lernzeit-Stoppuhr gemeinsam startet</strong>. Sobald deine eingestellte Fokuszeit erreicht ist, ertönt ein Alarm, aber es wird nicht automatisch in die Pause gewechselt — der Timer läuft im <strong>Überstunden</strong>-Modus weiter, und diese Zeit zählt vollständig als echte Lernzeit. Erst ein Klick auf <strong>„Pause starten"</strong> startet die eingestellte Pause; danach kehrt der Timer automatisch in eine neue Fokusphase zurück. Pause und Zurücksetzen steuern beide Timer gleichzeitig. Im Tab Fokuszeit gibt es Einstellungen für Fokus-/Pausenlänge, Statistiken für heute und die Woche sowie eine <strong>persönliche Pomodoro-Empfehlung</strong> (mindestens 3 Sitzungen nötig). Die Stoppuhr für die reale Lernzeit setzt sich automatisch auf 0 zurück, sobald sich das Kalenderdatum ändert, und die bis dahin erfasste Zeit wird korrekt dem Vortag zugeordnet. War in diesem Moment ein Timer aktiv, informiert dich ein Popup über den Reset, und der <strong>Pomodoro-Timer läuft ohne Unterbrechung weiter</strong> — nur die Stoppuhr wird zurückgesetzt.'},
        {title:'9. Übersicht — alles auf einen Blick', body:'Oben stehen Level, XP und Lernserie — das Level folgt einer RPG-Kurve, bei der jedes Level mehr XP braucht als das vorherige, bis maximal Level 300. Die Karte "🧠 Erwartete Behaltensrate" nutzt die Ebbinghaus-Vergessenskurve zusammen mit dem Wiederholungsverlauf jeder Karte, um zu schätzen, wie viel du dir gerade merkst, und listet die niedrigsten Karten zuerst. "Heutige Notiz-Wiederholungen" erinnert nach einem Tage-Plan seit Themenerstellung (standardmäßig 1, 4, 7, 14 und 28 Tage — pro Fach in der Fachverwaltung anpassbar). "Heutige Quests" gibt einen Bonus bei drei erreichten Tageszielen. Das Widget "Nächste Belohnung" verbindet sich mit #11. Fast jede Aktivität bringt XP.'},
        {title:'10. Sprache wechseln', body:'Mit dem Dropdown oben rechts lässt sich die gesamte App — Tab-Namen, Buttons, Hinweistexte — sofort zwischen Koreanisch, Englisch und Deutsch umschalten. Selbst eingegebene Inhalte (Fachnamen, Notizen, Karteninhalte) bleiben unverändert in der Sprache, in der sie geschrieben wurden.'},
        {title:'11. Belohnungen — kleine Erfolge zwischendurch', body:'Lege vor dem Lernen fest, was du dir als Belohnung gönnen möchtest — ein YouTube-Video, einen Snack, eine kurze Spielpause, was auch immer motiviert — und bestimme, nach wie vielen Pomodoro-Zyklen sie sich freischaltet (z. B. nach 2 Zyklen). Jedes Mal, wenn eine Pomodoro-Fokusphase abgeschlossen wird, steigt der heutige Zyklenzähler, und jede Belohnung, deren Bedingung erfüllt ist, schaltet sich automatisch mit einer Benachrichtigung frei. Der Zykluszähler wird jede Nacht zurückgesetzt, die gespeicherte Liste der Belohnungen bleibt aber erhalten.'},
        {title:'12. Backup — Exportieren / Importieren', body:'Im Header gibt es "Exportieren"- und "Importieren"-Buttons. <strong>Exportieren</strong> lädt alle Daten (Fächer, Notizen, Karten, Fehlernotizen, Level usw.) als JSON-Datei herunter. <strong>Importieren</strong> lädt diese Datei wieder — dabei werden alle aktuell gespeicherten Daten ersetzt (eine Bestätigung erscheint vorher, da dies nicht rückgängig gemacht werden kann). Regelmäßiges Exportieren schützt vor versehentlichem Datenverlust.'},
        {title:'13. Sicherheit · Wiederholungsdringlichkeit · Wiederholungsmodus', body:'Unabhängig von der Sicherheits-Einstellung in den Notizen verfolgt die App automatisch, wie überfällig jedes Thema für eine Wiederholung ist — Notizen speichern oder eine Antwort in Zufallsauswahl/Abruf aufdecken aktualisiert jeweils das „zuletzt wiederholt"-Datum, und der Abstand bis zur nächsten Prüfung wächst mit jedem abgeschlossenen Lesedurchgang (3→7→14→30 Tage). Ist dieses Fenster abgelaufen, erscheint ein ⏰ im Lesezyklus, und das Thema zählt im Plan-Tab unter „Was heute zu wiederholen ist". Ein Klick auf "Jetzt wiederholen" startet einen <strong>Wiederholungsmodus</strong>, der überfällige Themen nacheinander zeigt — der Notizen-Tab zeigt den Fortschritt (z. B. 1/3), mit "Nächstes Wiederholungsthema" zum Weitermachen oder "Wiederholung beenden" zum jederzeitigen Ausstieg.'},
        {title:'14. Langfristige Ziele — Ein Ziel für die lange Strecke setzen', body:'Oben im Plan-Tab kannst du ein langfristiges Ziel setzen: einen Titel und das Datum, bis zu dem du es erreichen willst. Einmal gesetzt, kann keins von beidem bis zu diesem Datum geändert werden (bei einem Tippfehler oder wenn du es dir anders überlegst, entfernt "Aufgeben" das Ziel, sodass du neu anfangen kannst). Am oder nach dem Zieldatum erscheinen die Buttons "Geschafft" / "Noch nicht", mit denen du selbst einträgst, ob du es erreicht hast — als geschafft markiert bringt Bonus-XP und hinterlässt ein Erfolgszeichen mit einem Symbol passend zu deinem aktuellen Design (🔮/🏅/🎗️/⚖️/🧪).'},
        {title:'15. Kalender — Lernprotokoll und Termine auf einen Blick', body:'Die Übersicht enthält jetzt einen Kalender. Jede Tageszelle zeigt einen Farbbalken für die an diesem Tag erfasste Stoppuhr-Fokuszeit, aufgeteilt nach Fach, damit du auf einen Blick siehst, welche Fächer du gelernt hast und in welchem Verhältnis (die Farbe jedes Fachs legst du beim Hinzufügen oder Bearbeiten in der Fächerverwaltung fest). Klicke auf ein Datum, um die Aufteilung nach Fach sowie alle erfassten Termine dieses Tages im Detail unten zu sehen. Erfasse Termine wie Prüfungen oder Verabredungen mit einem Datum (und optional einer Uhrzeit) — sie erscheinen als D-Day-Countdown in der Karte "Bevorstehende Termine" über dem Kalender; sobald ein Termin innerhalb eines Tages liegt und eine Uhrzeit hat, wechselt der Countdown zu "noch NStd NMin".'},
        {title:'16. Feste Pläne — täglich wiederkehrende Pläne anlegen', body:'Unter "Heutiger Plan" im Plan-Tab gibt es eine Karte "Feste Pläne". Was du dort hinzufügst, verschwindet nicht, wenn du es an diesem Tag abhakst — es erscheint bei der nächsten festgelegten Wochentag-Wiederkehr wieder ungehakt (die Erledigung wird für jeden Tag separat gespeichert). Beim Hinzufügen wählst du, an welchen Wochentagen es wiederkehrt; es erscheint nur an diesen Tagen im Plan — wählst du z. B. nur Mo-Fr, taucht es werktags auf und bleibt Sa/So verborgen. Wählst du keinen Tag aus, erscheint es jeden Tag. Feste Pläne, die heute nicht vorgesehen sind, bleiben trotzdem über "Alle festen Pläne verwalten" erreichbar, sodass du ihre Tage jederzeit ändern oder sie löschen kannst.'}

/* Registry of theme override tables. 'wizard' has no entry here because its
   terms live directly in LANG (the baseline default); every other theme
   overrides a subset of paths on top of that baseline, same shape as
   CLASSIC_TERMS. Adding a new theme is just adding a table here plus a
   body.<name>-theme CSS block and an entry in THEME_IDS below. */
const THEME_TABLES = { classic: CLASSIC_TERMS, hospital: HOSPITAL_TERMS, law: LAW_TERMS, lab: LAB_TERMS };
const THEME_IDS = ['wizard','classic','hospital','law','lab'];
function t(path){
  const lang = (state && state.settings && state.settings.language) || 'ko';
  const parts = path.split('.');
  const theme = state && state.settings && state.settings.theme;
  const table = theme && theme!=='wizard' ? THEME_TABLES[theme] : null;
  if(table){
    let cnode = table[lang];
    for(const p of parts){ cnode = cnode && cnode[p]; }
    if(cnode!==undefined) return cnode;
  }
  let node = LANG[lang];
  for(const p of parts){ node = node && node[p]; }
  if(node===undefined){
    let fallback = LANG.ko;
    for(const p of parts){ fallback = fallback && fallback[p]; }
    return fallback!==undefined ? fallback : path;
  }
  return node;
}
function tf(path, params){
  let str = t(path);
  if(params){
    Object.keys(params).forEach(k=>{ str = str.replace('{'+k+'}', params[k]); });
  }
  return str;
}

   Replaces the old localStorage-only polyfill. Each signed-in user's
   entire `state` object is stored as one row in the `user_state` table
   (columns: id = auth user id, state = jsonb, updated_at), gated by
   Row Level Security so a user can only read/write their own row.
   window.storage keeps the exact get/set/delete/list(key, isShared)
   signature the rest of the app already expects, so nothing else in
   the app needed to change. `currentUserId` is set by the auth layer
   below once a session is confirmed; calls made before that safely
   no-op instead of throwing. */
const SUPABASE_URL = 'https://jlpiqppgchlgqljehtan.supabase.co';

window.storage = {
  async get(key /*, isShared */){
    if(!currentUserId) return { value: undefined };
    try{
      const { data, error } = await sbClient
        .from('user_state')
        .select('state')
        .eq('id', currentUserId)
        .maybeSingle();
      if(error || !data) return { value: undefined };
      return { value: JSON.stringify(data.state) };
    }catch(e){
      return { value: undefined };
    }
  },
  async set(key, value /*, isShared */){
    if(!currentUserId) return { success: false };
    try{

        .from('user_state')

      return { success: !error };
    }catch(e){
      return { success: false };
    }
  },
  async delete(key /*, isShared */){
    if(!currentUserId) return { success: false };
    try{
      const { error } = await sbClient.from('user_state').delete().eq('id', currentUserId);
      return { success: !error };
    }catch(e){
      return { success: false };
    }
  },
  async list(prefix /*, isShared */){
    if(!currentUserId) return { keys: [] };
    try{
      const { data, error } = await sbClient
        .from('user_state')
        .select('id')
        .eq('id', currentUserId)
        .maybeSingle();
      return { keys: (!error && data) ? [STORAGE_KEY] : [] };
    }catch(e){
      return { keys: [] };
    }
  }

   generated here, and only here, so tightening collision-resistance is a
   single-point change. Math.random()-based 7-char ids are fine for one
   person's local data, but this app is meant to eventually run as a hosted,
   possibly multi-user product — a real UUID costs nothing today (ids are
   opaque strings everywhere: compared with ===, never parsed, sliced, or
   used as bare CSS selectors) and removes a class of "merged from two
   sources" or "many accounts, one datastore" collisions later. Falls back
   to the old generator only if crypto.randomUUID isn't available (very old

   the app currently runs. */

function findSubtopicNode(list, id){

  }

}
function removeSubtopicNode(list, id){

function fmtTime(sec){

  let tierIndex = 0;

  }
  const isLastTier = tierIndex === TIME_CRYSTAL_TIER_HOURS.length-1;
  const tierMin = TIME_CRYSTAL_TIER_HOURS[tierIndex];

function daysBetween(isoA, isoB){
  const a = new Date(isoA + 'T00:00:00');
  const b = new Date(isoB + 'T00:00:00');
  return Math.round((b-a)/86400000);
}
/* Predicted retention using an Ebbinghaus-style exponential decay curve,
   with "stability" estimated from this card's own spaced-repetition history
   (interval x ease, from the SM-2-like algorithm in App.rateCard). */
function computeRetention(c){
  if(!c.reps || c.reps<1) return null; // never reviewed yet, no curve to estimate
  const lastReviewDate = addDays(c.dueDate, -c.interval);
  const daysSince = Math.max(0, daysBetween(lastReviewDate, todayISO()));
  const stability = Math.max(1, c.interval * c.ease);
  const retention = Math.exp(-daysSince/stability);
  return Math.max(0, Math.min(1, retention));
}
function renderRetentionCurveSvg(avgR){
  const w = 320, h = 90, pad = 6;
  const points = [];
  for(let i=0;i<=40;i++){
    const t = i/40;
    const days = t * 21; // show a 21-day decay window
    const r = Math.exp(-days / 7); // reference curve, stability=7 days, for shape only
    const x = pad + t*(w-2*pad);
    const y = pad + (1-r)*(h-2*pad);
    points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  const markerX = pad;
  const markerY = pad + (1-avgR)*(h-2*pad);
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible;">
      <polyline points="${points.join(' ')}" fill="none" stroke="var(--teal)" stroke-width="2"/>
      <circle cx="${markerX}" cy="${markerY.toFixed(1)}" r="4" fill="var(--amber)"/>
    </svg>
  `;
}
function renderRetentionSection(){
  const reviewed = state.cards.map(c=>({card:c, r:computeRetention(c)})).filter(x=>x.r!==null);
  if(reviewed.length===0) return '';
  const avgR = reviewed.reduce((a,x)=>a+x.r,0)/reviewed.length;
  const weakest = reviewed.slice().sort((a,b)=>a.r-b.r).slice(0,5);
  const weakRows = weakest.map(({card,r})=>{
    const s = state.subjects.find(x=>x.id===card.subjectId);
    return `<div class="topic-row">
      <span class="topic-name" style="font-size:12.5px;">${escapeHtml((card.type==='cloze' ? stripCloze(card.clozeText) : richTextToPlain(card.front)).slice(0,60))}</span>

  }).join('');
  return `
    <div class="card" style="margin-bottom:16px;">
      <h2 class="section-title">${t('dash.retentionTitle')}</h2>
      ${renderRetentionCurveSvg(avgR)}
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px;">

    </div>
